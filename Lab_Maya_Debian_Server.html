<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debian Server Lab — Lab Maya TKJ</title>
<style>:root{--bg:#04101f;--bg2:#071a33;--pan:#0a2142;--pan2:#0d2a52;--ln:#1d4f8f;--ln2:#2b6cc4;--acc:#38bdf8;--acc2:#2563eb;--tx:#e6f0ff;--mu:#8fa9cc;--g:#22c55e;--y:#facc15;--r:#ef4444;--b:#60a5fa;--mono:"JetBrains Mono","Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;--sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--tx);font:14px/1.45 var(--sans);overflow:hidden}
body{background:#000}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:radial-gradient(1200px 600px at 70% -10%,#0e3a74 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#0b2d5c 0,transparent 60%),var(--bg);box-shadow:0 0 60px #000}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:#061629;border:1px solid var(--ln);border-radius:6px;padding:6px 8px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 2px #38bdf833}
code,kbd{font-family:var(--mono);font-size:.92em;background:#0b2240;border:1px solid #1d4f8f88;border-radius:4px;padding:0 4px;color:#9be7ff}
kbd{background:#132f55}
h1,h2,h3,h4{margin:.2em 0 .4em}
h3{font-size:15px;color:#bfe3ff;display:flex;align-items:center;gap:6px}
h3 small{font-weight:400;color:var(--mu);font-size:12px}
h4{font-size:14px;color:#cfe6ff}
.muted{color:var(--mu)}.small{font-size:12px}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.pad{padding:14px}.center{text-align:center}
.app-shell{display:flex;flex-direction:column;height:900px}
/* header */
#hdr{display:grid;grid-template-columns:280px 1fr auto;align-items:center;gap:12px;padding:8px 16px;background:linear-gradient(180deg,#0b2a55,#06162e);border-bottom:1px solid #2b6cc488;box-shadow:0 2px 20px #0008;position:relative;z-index:5}
#hdr:after{content:"";position:absolute;left:30%;right:30%;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent)}
.brand{display:flex;align-items:center;gap:10px}.brand .bi{width:40px;height:40px;border:2px solid var(--acc);border-radius:8px;display:grid;place-items:center;color:var(--acc);font-size:20px;box-shadow:0 0 12px #38bdf866}
.brand b{display:block;font-size:19px;letter-spacing:.3px}.brand small{color:#a9c6ea}
.htitle{text-align:center;display:flex;align-items:center;justify-content:center;gap:12px;min-width:0}
.htitle #hIcon{font-size:28px;filter:drop-shadow(0 0 8px #38bdf8aa)}
.htitle h1{font-size:22px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 18px #38bdf855}
.htitle p{margin:0;color:#a9c6ea;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hctl{display:flex;align-items:center;gap:6px}
.hctl select{padding:4px 6px;font-size:12px}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid var(--ln2);background:#0b2546;display:grid;place-items:center;font-size:15px}
.ib:hover{border-color:var(--acc);box-shadow:0 0 10px #38bdf855}.ib.off{opacity:.45;text-decoration:line-through}
.deb{display:flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--ln2);border-radius:20px;font-weight:600;font-size:13px}
.deb i{color:#d70a53;font-style:normal;font-size:18px}
#menu{display:flex;gap:2px;padding:0 16px;background:#061428;border-bottom:1px solid #1d4f8f66;overflow-x:auto}
#menu button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;color:#a9c6ea;white-space:nowrap}
#menu button:hover{color:#fff}#menu button.on{color:#fff;border-bottom-color:var(--acc);background:linear-gradient(0deg,#38bdf81a,transparent)}
#view{flex:1;overflow:hidden;padding:12px 14px;position:relative;min-height:0}
#view>section{height:100%}
#view.v-lab{padding:10px 12px 0;display:flex;flex-direction:column}#view.v-lab>section.lab{height:auto}
/* buttons */
.btn{background:linear-gradient(180deg,#123a6e,#0b2649);border:1px solid var(--ln2);border-radius:8px;padding:7px 14px;font-weight:600;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--acc);box-shadow:0 0 12px #38bdf844}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:linear-gradient(180deg,#2f8cff,#1d5fd6);border-color:#7cc4ff;box-shadow:0 0 16px #2f8cff55}
.btn.big{padding:12px 26px;font-size:16px;border-radius:12px}
.btn.sm{padding:4px 10px;font-size:12.5px}.btn.wide{width:100%}.btn.ghost{background:none;border-color:#1d4f8f88}
.rowr{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.rowc{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.card{background:linear-gradient(180deg,#0c2448ee,#081a35ee);border:1px solid #2b6cc477;border-radius:12px;padding:10px 12px;box-shadow:inset 0 1px 0 #ffffff0d,0 4px 20px #0006}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700}.tag.r{background:#ef444433;color:#fca5a5;border:1px solid #ef444477}.tag.y{background:#facc1529;color:#fde68a;border:1px solid #facc1566}.tag.b{background:#60a5fa29;color:#bfdbfe;border:1px solid #60a5fa66}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#475569;vertical-align:middle}.dot.on{background:var(--g);box-shadow:0 0 8px var(--g)}.dot.fail{background:var(--r);box-shadow:0 0 8px var(--r)}.dot.off{background:#94a3b8}.dot.none{background:#334155}
table.kv{width:100%;border-collapse:collapse;font-size:13px}table.kv td{padding:3px 4px;border-bottom:1px solid #1d4f8f44;vertical-align:top}table.kv td:first-child{color:var(--mu);white-space:nowrap;width:40%}table.kv td.sub{font-size:11.5px;color:#6f8db3;border-bottom-color:#1d4f8f22;padding-top:0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{background:#0f2e58;color:#cfe6ff;text-align:left;padding:7px 8px;font-weight:600}.tbl td{padding:6px 8px;border-bottom:1px solid #1d4f8f44}.tbl.small{font-size:12.5px}.tbl tr.tot td{background:#0f2e58;font-weight:700}
/* hero */
.hero{position:relative;height:100%;display:grid;place-items:center;padding:0 10px;margin:-12px -14px;height:calc(100% + 24px)}
.hero-bg{position:absolute;inset:0;background:linear-gradient(90deg,#04101fee 0,#04101f99 35%,#04101f99 65%,#04101fee 100%),repeating-linear-gradient(90deg,transparent 0 60px,#1d4f8f14 60px 61px),repeating-linear-gradient(0deg,transparent 0 60px,#1d4f8f14 60px 61px);pointer-events:none}
.hero-bg:before,.hero-bg:after{content:"";position:absolute;top:8%;bottom:8%;width:110px;border-radius:6px;background:repeating-linear-gradient(180deg,#0b1d36 0 18px,#081528 18px 22px);border:1px solid #1d4f8f88;box-shadow:0 0 30px #2563eb33}
.hero-bg:before{left:3%}.hero-bg:after{right:3%;background:repeating-linear-gradient(180deg,#0b1d36 0 18px,#081528 18px 22px),radial-gradient(circle,#22c55e 0 2px,transparent 3px) 80% 9px/100% 22px}
.hero-in{position:relative;text-align:center;max-width:1040px}
.pill{display:inline-block;padding:6px 16px;border:1px solid var(--acc);border-radius:20px;color:#bfe9ff;background:#38bdf814;box-shadow:0 0 14px #38bdf833}
.hero h1{font-size:50px;letter-spacing:3px;margin:14px 0 0;background:linear-gradient(180deg,#fff,#9fd6ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px #38bdf833}
.hero h2{font-size:22px;color:#7cc4ff;font-weight:500;letter-spacing:6px;text-transform:uppercase;margin:0 0 10px}
.hero p{color:#cfe1fa;max-width:760px;margin:0 auto 18px;font-size:15px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:10px 0 20px}
.mcard{position:relative;text-align:left;padding:14px;border-radius:12px;border:1px solid #2b6cc4aa;background:linear-gradient(180deg,#0f2d57cc,#081b37cc);transition:.2s}
.mcard:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 0 22px #38bdf844}
.mcard .mi{font-size:30px;display:block;filter:drop-shadow(0 0 6px #38bdf8)}
.mcard b{display:flex;gap:8px;align-items:center;font-size:15.5px;margin:6px 0 2px}.mcard em{font-style:normal;width:22px;height:22px;border-radius:50%;background:#1d5fd6;display:grid;place-items:center;font-size:12px}
.mcard small{color:#9bb7dc;font-size:12px}.mdone{position:absolute;top:8px;right:10px;color:var(--g);font-weight:800}
.hero-btn{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
/* brief */
.brief{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;max-width:1300px;margin:0 auto;align-items:center}
.screen{background:linear-gradient(180deg,#0d2e5c,#071b37);border:2px solid #38bdf866;border-radius:14px;padding:16px 18px;box-shadow:0 0 40px #2563eb33}
.scr-h{display:flex;justify-content:space-between;color:#9fd6ff;font-size:12px;border-bottom:1px solid #2b6cc466;padding-bottom:8px;margin-bottom:8px}.scr-h .logo{font-weight:800;letter-spacing:1px;color:#fff}
.missions{list-style:none;padding:0;margin:0}.missions li{display:flex;align-items:center;gap:10px;padding:7px 8px;border-bottom:1px solid #1d4f8f44}.missions li span{width:26px;height:26px;border-radius:50%;background:#123a6e;display:grid;place-items:center;font-weight:700;font-size:12px}.missions li b{margin-left:auto;font-size:12px;color:var(--mu);font-weight:500}.missions li.ok span{background:var(--g);color:#032}.missions li.ok b{color:var(--g)}
.instr-big{display:flex;flex-direction:column;align-items:center;gap:12px}.instr-big img{width:280px;border-radius:18px;border:2px solid #38bdf866;box-shadow:0 0 30px #2563eb44}
.bubble{background:#f1f7ff;color:#0b1d36;border-radius:14px;padding:12px 16px;position:relative;font-size:14.5px;max-width:420px}.bubble:before{content:"";position:absolute;top:-10px;left:50%;border:10px solid transparent;border-top:0;border-bottom-color:#f1f7ff}
/* topo */
.topo{display:grid;grid-template-columns:1fr 340px;gap:12px}
.tmap{display:flex;flex-direction:column;min-height:0}.tmap svg{width:100%;flex:1;min-height:0;display:block}
.tside{display:flex;flex-direction:column;gap:8px;min-height:0}.tside .card{padding:8px 12px}.tside #tinfo{flex:1;overflow:auto;min-height:0}.tside .kv{font-size:12.5px}
.ident{list-style:none;padding:0;margin:0;columns:2;font-size:13px}.ident li{padding:4px;cursor:pointer;border-radius:5px}.ident li:hover{background:#1d4f8f44}.ident li.ok{color:var(--g)}
.hint{color:#fde68a}
svg .dv{fill:#13325e;stroke:#5ba7ff;stroke-width:1.6}svg .slot{fill:#0a1d38;stroke:#2b6cc4}svg .scr{fill:#04101f;stroke:#2b6cc4}
svg .led{fill:#334155}svg .led.on{fill:#22c55e;filter:drop-shadow(0 0 3px #22c55e)}svg .ant{stroke:#5ba7ff;stroke-width:2}
svg text{fill:#d7e8ff;font-family:var(--sans);text-anchor:middle}svg .dvt{font-size:11px;font-weight:700}svg .dvn{font-size:13px;font-weight:700}svg .dvip{font-size:11px;fill:#7cc4ff;font-family:var(--mono)}svg .dvl{font-size:10px;fill:#9fb8da}svg .pn{font-size:9px;fill:#9fb8da}
svg .cloud ellipse{fill:#0e2c55;stroke:#5ba7ff;stroke-dasharray:4 3}svg .cloud text{font-size:12px;font-weight:700}
svg .cab{fill:none;stroke-width:3;stroke:#38bdf8;filter:drop-shadow(0 0 4px #38bdf8aa)}svg .cab.up{stroke:#a78bfa}svg .cab.ghost{stroke:#facc15;stroke-dasharray:6 5;stroke-width:2;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
svg .dev{cursor:pointer}svg .dev:hover .dv,svg .dev.sel .dv{stroke:#facc15;stroke-width:2.4}
svg .port{cursor:pointer}svg .port rect{fill:#020b17;stroke:#5ba7ff}svg .port:hover rect{stroke:#facc15}svg .port.used rect{stroke:#22c55e}svg .port.bad rect{stroke:#ef4444;fill:#ef444455}
/* labs */
.labs{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:12px;max-width:1450px;margin:0 auto}
.lcard{text-align:left;border:1px solid #2b6cc4aa;border-radius:12px;background:linear-gradient(180deg,#0f2d57,#081b37);padding:12px;display:flex;flex-direction:column;gap:3px;transition:.2s}.lcard:hover{transform:translateY(-2px);border-color:var(--acc)}
.lcard .lv{font-size:11px;color:#7cc4ff;text-transform:uppercase;letter-spacing:.5px}.lcard .li{font-size:28px}.lcard small{color:var(--mu)}.lcard.done{border-color:#22c55e99}.lcard.alt{background:linear-gradient(180deg,#2a1a52,#140d33);border-color:#a78bfa88}
.bar{height:6px;background:#0a1d38;border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#38bdf8)}.pc{font-size:11.5px;color:var(--mu)}
/* lab */
.lab{display:grid;grid-template-columns:300px minmax(0,1.15fr) minmax(0,1fr);gap:10px;flex:1;min-height:0}
.lcol{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden;padding-bottom:96px}.lcol .instr{flex:1;min-height:0;overflow:auto}
.steps ol{list-style:none;padding:0;margin:0}.steps li{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:13px}
.steps li span{min-width:22px;height:22px;border-radius:50%;background:#123a6e;display:grid;place-items:center;font-size:11px;font-weight:700}.steps li b{margin-left:auto;color:var(--g)}
.steps li.ok{color:#bbf7d0}.steps li.ok span{background:var(--g);color:#032}.steps li.cur{background:linear-gradient(90deg,#2563eb,#1d4ed8aa);box-shadow:0 0 12px #2563eb66}.steps li.cur span{background:#fff;color:#1d4ed8}.steps li:hover:not(.cur){background:#1d4f8f44}
.instr p{margin:.3em 0;font-size:13px;color:#d4e5fb}.instr h4{margin:.2em 0}.st-t{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mu)}.st-t em{font-style:normal}
.cmds{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.cmd{font-family:var(--mono);font-size:12px;text-align:left;background:#05152a;border:1px solid #facc1555;color:#fde68a;border-radius:6px;padding:4px 8px;word-break:break-all}.cmd:hover{border-color:#facc15;background:#0b2240}
.cmd.rel{border-color:#22c55e;color:#bbf7d0}.cmd.irr{border-color:#ef4444;color:#fca5a5}
.acc{font-size:12px;color:var(--mu);margin:6px 0 4px}
.ccol,.rcol{display:flex;flex-direction:column;gap:10px;min-height:0}
.win{background:#030b16;border:1px solid #2b6cc4aa;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 24px #0008;min-height:0}
.wbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:linear-gradient(180deg,#1a2f4f,#11223c);border-bottom:1px solid #2b6cc466;font-size:13px}.wbar b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wd{width:11px;height:11px;border-radius:50%}.wd.r{background:#ff5f57}.wd.y{background:#febc2e}.wd.g{background:#28c840}.wsp{flex:1}
.tbtn{background:none;border:1px solid #2b6cc488;border-radius:5px;padding:1px 7px;font-size:12px}
.twin{flex:1}#srvTerm{flex:1;min-height:0;display:flex}#srvTerm>.term{flex:1}
.term{font-family:var(--mono);font-size:13px;line-height:1.38;color:#d6e2f0;background:#020912;padding:8px 10px;overflow:auto;cursor:text;white-space:pre-wrap;word-break:break-word;min-height:0}
.term .tl{min-height:1.38em}.term .tl.cmdl{color:#fff}.term .tl.err{color:#ff8a8a}.term .tl.warn{color:#fbbf24}.term .tl.dim{color:#8aa0bd}.term .tl.hint{color:#fde68a;background:#facc1512;border-left:2px solid #facc15;padding-left:6px;margin:2px 0}
.term .c-g{color:#4ade80}.term .c-r{color:#f87171}.term .c-y{color:#facc15}.term .c-b{color:#60a5fa}.term .tl.c-g{color:#4ade80}.term .tl.c-y{color:#facc15}
.tline{display:flex;align-items:center}.tprompt{color:#4ade80;white-space:pre}.tin{flex:1;background:none;border:0;padding:0;color:#fff;font:inherit;box-shadow:none!important;caret-color:#4ade80;min-width:30px}
.row2{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;height:168px}.row2 .card{overflow:auto}
.fb{display:flex;gap:8px;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid}.fb.ok{background:#22c55e14;border-color:#22c55e66}.fb.err{background:#ef444414;border-color:#ef444466}.fb.warn{background:#facc1512;border-color:#facc1566}.fb.info{border-color:#60a5fa66}
.fb ul{margin:4px 0;padding-left:18px}.fb li.w{color:#fde68a}
.dora{display:flex;gap:4px;margin-top:8px}.dora span{flex:1;text-align:center;font-size:10.5px;font-weight:700;padding:5px 2px;border-radius:5px;background:#0a1d38;border:1px solid #1d4f8f;color:#7c94b8}.dora span.go{background:#16a34a;color:#fff;border-color:#4ade80;box-shadow:0 0 10px #22c55e}.dora span.bad{background:#7f1d1d;color:#fca5a5;border-color:#ef4444}
.ewin{flex:1}.ed-empty{padding:12px;display:flex;flex-direction:column;gap:6px;overflow:auto}.ed-empty p{margin:0}
.nano-h{display:flex;justify-content:space-between;background:#cbd5e1;color:#0b1d36;font-family:var(--mono);font-size:12px;padding:1px 8px}
.ro{background:#7f1d1d;color:#fecaca;font-family:var(--mono);font-size:12px;padding:2px 8px;text-align:center}
#edTa{flex:1;min-height:0;resize:none;border:0;border-radius:0;background:#020912;color:#e2e8f0;font-family:var(--mono);font-size:13px;line-height:1.4;padding:8px 10px;tab-size:4;white-space:pre;overflow:auto}
.nano-f{display:flex;flex-wrap:wrap;gap:4px;padding:4px 6px;background:#0b1626;border-top:1px solid #1d4f8f66}.nano-f button{background:none;border:0;font-family:var(--mono);font-size:12px;padding:2px 6px;border-radius:4px}.nano-f button:hover:not(:disabled){background:#1d4f8f55}.nano-f kbd{background:#cbd5e1;color:#0b1d36;border:0}
.edmod{color:#fde68a;font-size:12px}
.cwin{flex:1.15}.cbar select{padding:2px 4px;font-size:12px}.cip{font-family:var(--mono);font-size:11.5px;color:#7cc4ff;margin-left:auto;white-space:nowrap}.cip small{color:var(--mu)}
.ctabs{display:flex;gap:2px;background:#0b1626;padding:3px 6px 0}.ctabs button{background:#0f1f36;border:1px solid #1d4f8f66;border-bottom:0;border-radius:6px 6px 0 0;padding:3px 12px;font-size:12.5px;color:#9fb8da}.ctabs button.on{background:#020912;color:#fff;border-color:#2b6cc4}
.cbody{flex:1;min-height:0;display:flex;flex-direction:column;background:#020912}.cbody>.term{flex:1}
.lfoot{display:flex;align-items:center;gap:10px;padding:8px 0}.chips{flex:1;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #2b6cc4aa;background:#0b2546;border-radius:16px;padding:3px 12px;font-size:12.5px;font-weight:600}.chip.ok{border-color:#22c55e;color:#bbf7d0}.chip.cur{background:#2563eb;border-color:#93c5fd;box-shadow:0 0 10px #2563eb}
/* apps */
.app{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto;background:#eef3fa;color:#0f172a;font-size:13px}
.app input{background:#fff;color:#0f172a;border:1px solid #94a3b8;border-radius:4px;padding:4px 6px}
.app .muted{color:#64748b}.app .btn{color:#fff}.app .r{color:#dc2626}.app .g{color:#16a34a}.app .cmd{color:#854d0e;background:#fef9c3;border-color:#eab308}
.dlg{margin:14px;background:#fff;border:1px solid #cbd5e1;border-left:4px solid #dc2626;border-radius:6px;padding:10px 14px;box-shadow:0 4px 16px #0002}.dlg p{margin:4px 0}
.okbadge{position:sticky;bottom:10px;margin:10px auto;display:table;background:#16a34a;color:#fff;font-weight:700;border-radius:10px;padding:8px 16px;box-shadow:0 4px 18px #16a34a88;animation:pop .4s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.rdp{display:grid;grid-template-columns:220px 1fr}.rdp-f{background:#fff;border-right:1px solid #cbd5e1;padding:10px;display:flex;flex-direction:column;gap:6px}.rdp-f label{display:flex;flex-direction:column;font-size:12px}.rdp-h{font-weight:700;color:#1d4ed8}.rdp-o{min-height:200px;display:flex;flex-direction:column}

   { t: 'Perbarui daftar paket', cmd: ['sudo apt update'], n: 'Perbarui daftar paket repositori dengan sudo apt update. Tanpa langkah ini, apt tidak akan menemukan paket yang akan dipasang.', ck: () => S.aptUpdated },
   { t: 'Instal OpenSSH Server', cmd: ['sudo apt install openssh-server -y'], n: 'Pasang OpenSSH Server dengan sudo apt install openssh-server -y.', ck: () => inst('openssh-server') },
   { t: 'Aktifkan & periksa layanan SSH', cmd: ['sudo systemctl enable --now ssh', 'systemctl status ssh'], n: 'Aktifkan SSH agar berjalan sekarang dan otomatis saat boot, lalu periksa statusnya. Cari tulisan active running berwarna hijau.', ck: () => run('ssh') && S.svc.ssh.enabled && F('status:ssh') },
   { t: 'Uji SSH dari Client', cmd: ['ssh admin@192.168.10.2'], client: true, n: 'Pindah ke panel Client di kanan. Pilih Client 01, lalu ketik ssh admin@192.168.10.2. Jawab yes untuk fingerprint, dan masukkan password debian. Jika prompt admin at debian-server muncul, SSH berhasil.', ck: () => T_('ssh') },
   { t: 'Instal Telnet (lab terisolasi)', cmd: ['sudo apt install telnetd -y'], n: 'Pasang telnetd hanya untuk demonstrasi. Ingat, Telnet mengirim password tanpa enkripsi.', ck: () => inst('telnetd') && run('inetd') },
   { t: 'Uji Telnet dari Client', cmd: ['telnet 192.168.10.2'], client: true, n: 'Dari client, jalankan telnet 192.168.10.2 lalu login sebagai admin. Bandingkan dengan SSH: semua yang kamu ketik di Telnet dapat dibaca oleh penyadap.', ck: () => T_('telnet') },
   { t: 'Instal XRDP & desktop XFCE', cmd: ['sudo apt install xrdp xfce4 -y', 'sudo systemctl enable --now xrdp'], n: 'Pasang xrdp dan xfce4. XRDP adalah server RDP, sedangkan XFCE adalah desktop grafis yang akan ditampilkan.', ck: () => inst('xrdp') && inst('xfce4') && run('xrdp') },
   { t: 'Uji Remote Desktop', cmd: [], client: true, app: true, n: 'Buka tab aplikasi Remote Desktop pada client Windows. Masukkan alamat 192.168.10.2, user admin, password debian, lalu klik Connect.', ck: () => T_('rdp') },
  ] },
{ id: 'dhcp', scene: 'S06', no: 2, title: 'DHCP Server', sub: 'Pemberian IP otomatis dengan isc-dhcp-server', icon: '⇄', files: ['/etc/dhcp/dhcpd.conf', '/etc/default/isc-dhcp-server', '/var/lib/dhcp/dhcpd.leases'], app: null, svcs: ['isc-dhcp-server'],
  intro: 'DHCP memungkinkan komputer mendapatkan konfigurasi IP secara otomatis dari server. Kamu akan membuat rentang alamat IP 192.168.10.100 sampai 200 untuk komputer client.',
  steps: [
   { t: 'Instal isc-dhcp-server', cmd: ['sudo apt install isc-dhcp-server -y'], n: 'Pasang isc-dhcp-server. Jangan kaget jika muncul pesan Job failed. Itu normal karena layanan belum dikonfigurasi.', ck: () => inst('isc-dhcp-server') },
   { t: 'Konfigurasi dhcpd.conf', cmd: ['sudo nano /etc/dhcp/dhcpd.conf'], n: 'Edit dhcpd.conf. Ganti domain-name menjadi lab.test, domain-name-servers menjadi 192.168.10.2, lalu buat blok subnet 192.168.10.0 netmask 255.255.255.0 dengan range 100 sampai 200 dan option routers 192.168.10.1. Setiap baris pernyataan diakhiri titik koma.', ck: () => dhcpCfg().ok },
   { t: 'Tentukan interface layanan', cmd: ['sudo nano /etc/default/isc-dhcp-server'], n: 'Edit file default isc-dhcp-server. Isi INTERFACESv4 dengan "enp0s3" agar DHCP hanya melayani interface LAN.', ck: () => dhcpIface() === 'enp0s3' },
   { t: 'Restart & periksa layanan', cmd: ['sudo systemctl restart isc-dhcp-server', 'systemctl status isc-dhcp-server'], n: 'Restart layanan DHCP dan periksa statusnya. Jika gagal, baca pesan kesalahannya dengan journalctl -u isc-dhcp-server.', ck: () => run('isc-dhcp-server') },
   { t: 'Client meminta IP (DORA)', cmd: ['ipconfig /renew', 'ipconfig /all'], client: true, n: 'Di panel Client, klik tombol Adapter dan ubah ke mode DHCP. Kemudian jalankan ipconfig /renew. Perhatikan proses Discover, Offer, Request, Acknowledge, lalu cek dengan ipconfig /all.', ck: () => T_('dhcp') },
   { t: 'Periksa lease di server', cmd: ['cat /var/lib/dhcp/dhcpd.leases'], n: 'Kembali ke terminal server dan tampilkan file dhcpd.leases. Di sana tercatat IP mana yang dipinjamkan ke client mana.', ck: () => F('leases') && S.leases.length > 0 },
  ] },
{ id: 'dns', scene: 'S07', no: 3, title: 'DNS Server BIND9', sub: 'Zona lab.test, record A/NS/MX, dan pengujian nslookup', icon: '◎', files: ['/etc/bind/named.conf.local', '/etc/bind/db.lab.test'], app: null, svcs: ['named'],
  intro: 'Perusahaan ingin memakai nama domain internal agar pengguna tidak perlu menghafal alamat IP. Tugasmu membangun DNS Server dengan BIND9 untuk domain lab.test.',
  steps: [
   { t: 'Instal BIND9', cmd: ['sudo apt install bind9 bind9-utils dnsutils -y'], n: 'Pasang bind9, bind9-utils, dan dnsutils.', ck: () => inst('bind9') && inst('bind9-utils') },
   { t: 'Deklarasikan zona', cmd: ['sudo nano /etc/bind/named.conf.local'], n: 'Tambahkan deklarasi zone "lab.test" dengan type master dan file "/etc/bind/db.lab.test" di named.conf.local. Jangan lupa titik koma setelah kurung kurawal penutup.', ck: () => zoneDecl().ok },
   { t: 'Buat file zona', cmd: ['sudo cp /etc/bind/db.local /etc/bind/db.lab.test', 'sudo nano /etc/bind/db.lab.test'], n: 'Salin db.local menjadi db.lab.test sebagai kerangka, lalu edit. Isi SOA dengan ns.lab.test, record NS, dan record A untuk ns, www, ftp, dan mail ke 192.168.10.2. Perhatikan titik di akhir nama lengkap seperti ns.lab.test titik.', ck: () => zoneFile().ok && zoneHas('www.lab.test') },
   { t: 'Periksa sintaks', cmd: ['sudo named-checkconf', 'named-checkzone lab.test /etc/bind/db.lab.test'], n: 'Biasakan memeriksa sebelum restart. Jalankan named-checkconf, lalu named-checkzone lab.test diikuti path file zona. Hasil yang benar diakhiri kata OK.', ck: () => F('checkconf') && F('checkzoneok') },
   { t: 'Restart BIND9', cmd: ['sudo systemctl restart bind9', 'systemctl status bind9'], n: 'Restart bind9 agar zona baru dimuat, lalu periksa statusnya.', ck: () => run('named') && zoneLoaded() },
   { t: 'Uji resolusi dari client', cmd: ['nslookup www.lab.test'], client: true, n: 'Dari client yang sudah mendapat IP dari DHCP, jalankan nslookup www.lab.test. Jika client masih IP statis tanpa DNS, tulis nslookup www.lab.test 192.168.10.2.', ck: () => T_('dns') },
  ] },
{ id: 'samba', scene: 'S08', no: 4, title: 'File Server Samba', sub: 'Folder bersama /srv/shared dengan hak akses user', icon: '🗀', files: ['/etc/samba/smb.conf'], app: 'explorer', svcs: ['smbd'],
  intro: 'Kita akan membuat folder bersama yang hanya bisa diakses oleh user siswa. Ingat, hak akses Samba terdiri dari dua lapis: aturan share dan permission Linux.',
  steps: [
   { t: 'Instal Samba', cmd: ['sudo apt install samba -y'], n: 'Pasang paket samba.', ck: () => inst('samba') },
   { t: 'Buat folder bersama', cmd: ['sudo mkdir -p /srv/shared'], n: 'Buat direktori /srv/shared dengan mkdir -p.', ck: () => dirX('/srv/shared') },
   { t: 'Buat user Linux siswa', cmd: ['sudo adduser siswa'], n: 'Buat user Linux bernama siswa dengan adduser. Catat password yang kamu buat, karena akan dipakai lagi di FTP dan Mail.', ck: () => !!S.users.siswa },
   { t: 'Daftarkan user Samba', cmd: ['sudo smbpasswd -a siswa'], n: 'Daftarkan siswa sebagai user Samba dengan smbpasswd -a siswa. Password Samba boleh berbeda dari password Linux.', ck: () => !!S.smb.siswa },
   { t: 'Atur kepemilikan & permission', cmd: ['sudo chown root:siswa /srv/shared', 'sudo chmod 2770 /srv/shared', 'ls -ld /srv/shared'], n: 'Jadikan grup siswa pemilik grup folder, lalu chmod 2770 agar grup dapat membaca dan menulis, sedangkan orang lain tidak. Periksa dengan ls -ld.', ck: () => canWrite('siswa', '/srv/shared') },
   { t: 'Konfigurasi share [SHARED]', cmd: ['sudo nano /etc/samba/smb.conf'], n: 'Tambahkan bagian SHARED di akhir smb.conf: path /srv/shared, browseable yes, read only no, valid users siswa.', ck: () => smbShare(false).ok },
   { t: 'Uji sintaks & restart smbd', cmd: ['testparm', 'sudo systemctl restart smbd'], n: 'Jalankan testparm untuk memeriksa smb.conf, lalu restart smbd.', ck: () => F('testparm') && run('smbd') && smbShare(true).ok },
   { t: 'Akses dari Windows Explorer', cmd: [], client: true, app: true, n: 'Di client Windows, buka tab File Explorer. Ketik alamat dua garis miring terbalik 192.168.10.2 garis miring SHARED, login sebagai siswa, lalu unggah file laporan praktikum.', ck: () => T_('samba') },
  ] },
{ id: 'ftp', scene: 'S09', no: 5, title: 'FTP Server vsftpd', sub: 'Upload & download file melalui FileZilla', icon: '⇅', files: ['/etc/vsftpd.conf'], app: 'filezilla', svcs: ['vsftpd'],
  intro: 'Sekarang kita aktifkan FTP Server menggunakan vsftpd agar user dapat mengunggah dan mengunduh file. Perhatikan, file konfigurasi vsftpd tidak boleh memakai spasi di sekitar tanda sama dengan.',
  steps: [
   { t: 'Instal vsftpd', cmd: ['sudo apt install vsftpd -y'], n: 'Pasang vsftpd.', ck: () => inst('vsftpd') },
   { t: 'Konfigurasi vsftpd.conf', cmd: ['sudo nano /etc/vsftpd.conf'], n: 'Edit vsftpd.conf. Atur listen YES dan listen_ipv6 NO, anonymous_enable NO, local_enable YES, lalu hapus tanda pagar pada write_enable YES dan local_umask 022.', ck: () => ftpCfg().ok },
   { t: 'Restart & periksa vsftpd', cmd: ['sudo systemctl restart vsftpd', 'systemctl status vsftpd'], n: 'Restart vsftpd dan pastikan statusnya active running.', ck: () => run('vsftpd') && ftpCfg(true).ok },
   { t: 'Login dengan FileZilla', cmd: [], client: true, app: true, n: 'Buka tab FileZilla di client. Isi host 192.168.10.2, username siswa, password akun siswa yang kamu buat dengan adduser, port 21, lalu Quickconnect.', ck: () => T_('ftplogin') },
   { t: 'Upload file', cmd: [], client: true, app: true, n: 'Pilih file laporan_praktikum.txt di panel lokal dan klik Upload.', ck: () => T_('ftpup') },
   { t: 'Download file', cmd: [], client: true, app: true, n: 'Sekarang unduh kembali file dari panel remote untuk memastikan transfer dua arah berhasil.', ck: () => T_('ftpdown') },
  ] },
{ id: 'web', scene: 'S10', no: 6, title: 'Web Server Apache2', sub: 'Virtual host www.lab.test untuk portal PT Digital Network Indonesia', icon: '🌐', files: ['/etc/apache2/sites-available/www.lab.test.conf', '/var/www/lab.test/index.html', '/etc/apache2/sites-available/000-default.conf'], app: 'browser', svcs: ['apache2'],
  intro: 'Perusahaan membutuhkan portal informasi internal di alamat www.lab.test. Seperti di server sungguhan, kita tidak mengedit halaman bawaan, tetapi membuat virtual host sendiri: folder website, file konfigurasi di sites-available, lalu mengaktifkannya dengan a2ensite.',
  steps: [
   { t: 'Instal Apache2', cmd: ['sudo apt install apache2 -y'], n: 'Pasang apache2. Setelah terpasang, Apache langsung berjalan dengan situs bawaan 000-default yang memakai folder /var/www/html.', ck: () => inst('apache2') },
   { t: 'Aktifkan & periksa Apache', cmd: ['sudo systemctl enable --now apache2', 'systemctl status apache2', 'ls -l /etc/apache2/sites-available /etc/apache2/sites-enabled'], n: 'Pastikan apache2 aktif. Lihat juga isi folder sites-available, tempat semua konfigurasi situs, dan sites-enabled, tempat situs yang sedang aktif.', ck: () => run('apache2') && F('status:apache2') },
   { t: 'Buat folder & halaman website', cmd: ['sudo mkdir -p /var/www/lab.test', 'sudo nano /var/www/lab.test/index.html'], n: 'Buat folder document root khusus /var/www/lab.test, lalu buat file index.html di dalamnya. Halaman wajib memuat teks PT Digital Network Indonesia.', ck: () => dirX('/var/www/lab.test') && /PT Digital Network Indonesia/i.test(S.files['/var/www/lab.test/index.html'] || '') },
   { t: 'Buat file virtual host', cmd: ['sudo cp /etc/apache2/sites-available/000-default.conf /etc/apache2/sites-available/www.lab.test.conf', 'sudo nano /etc/apache2/sites-available/www.lab.test.conf'], n: 'Salin 000-default.conf menjadi www.lab.test.conf di folder sites-available, lalu edit. Isi ServerName www.lab.test, DocumentRoot /var/www/lab.test, dan pastikan blok VirtualHost ditutup dengan tag penutup.', ck: () => vhostCfg().ok },
   { t: 'Aktifkan site & cek sintaks', cmd: ['sudo a2ensite www.lab.test.conf', 'sudo a2dissite 000-default.conf', 'sudo apache2ctl configtest'], n: 'Aktifkan virtual host dengan a2ensite www.lab.test.conf. Opsional, nonaktifkan situs bawaan dengan a2dissite 000-default.conf. Lalu periksa dengan apache2ctl configtest sampai muncul Syntax OK.', ck: () => a2en().includes('www.lab.test') && F('configtest') },
   { t: 'Reload Apache', cmd: ['sudo systemctl reload apache2', 'sudo apache2ctl -S'], n: 'Muat ulang Apache dengan systemctl reload apache2 agar virtual host baru dipakai. Perintah apache2ctl minus S menampilkan daftar virtual host yang aktif.', ck: () => !!apacheVh('www.lab.test') },
   { t: 'Uji virtual host dari server', cmd: ['curl -H "Host: www.lab.test" http://localhost'], n: 'Uji dari server dengan curl dan header Host www.lab.test. Apache memilih virtual host berdasarkan nama di header Host, sehingga halaman portalmu yang tampil.', ck: () => F('curlvhost') },
   { t: 'Akses via IP dari client', cmd: [], client: true, app: true, n: 'Buka tab Browser di client dan ketik http://192.168.10.2. Perhatikan situs mana yang tampil: akses lewat IP akan dilayani virtual host default, yaitu situs pertama yang aktif.', ck: () => T_('webip') },
   { t: 'Akses via domain', cmd: [], client: true, app: true, n: 'Sekarang ketik http://www.lab.test. Ini berhasil jika client memakai DNS 192.168.10.2, zona memiliki record www, dan virtual host www.lab.test sudah aktif.', ck: () => T_('web') },
  ] },
{ id: 'mail', scene: 'S11', no: 7, title: 'Mail Server', sub: 'Postfix (SMTP) + Dovecot (IMAP) untuk domain lab.test', icon: '✉', files: ['/etc/postfix/main.cf', '/etc/dovecot/conf.d/10-mail.conf', '/etc/bind/db.lab.test'], app: 'mail', svcs: ['postfix', 'dovecot'],
  intro: 'Kita akan membangun layanan email lokal. Postfix bertugas menerima dan mengirim email, sedangkan Dovecot menyediakan mailbox yang dibaca email client melalui IMAP.',
  steps: [
   { t: 'Instal Postfix & Dovecot', cmd: ['sudo apt install postfix dovecot-imapd -y'], n: 'Pasang postfix dan dovecot-imapd. Pada dialog konfigurasi Postfix, pilih Internet Site dengan mail name lab.test.', ck: () => inst('postfix') && inst('dovecot-imapd') },
   { t: 'Konfigurasi Postfix main.cf', cmd: ['sudo nano /etc/postfix/main.cf'], n: 'Edit main.cf. Atur myhostname mail.lab.test, mydomain lab.test, mydestination yang memuat dollar mydomain, dan home_mailbox Maildir garis miring.', ck: () => postfixCfg().ok },
   { t: 'Samakan format mailbox Dovecot', cmd: ['sudo nano /etc/dovecot/conf.d/10-mail.conf'], n: 'Edit 10-mail.conf dan atur mail_location menjadi maildir:~/Maildir, sama dengan format yang ditulis Postfix. Jika berbeda, email terkirim tetapi tidak pernah muncul di inbox.', ck: () => mailFmtMatch(false) },
   { t: 'Tambahkan record MX', cmd: ['sudo nano /etc/bind/db.lab.test', 'sudo systemctl restart bind9'], n: 'Tambahkan record at IN MX 10 mail.lab.test titik pada file zona, naikkan serial, lalu restart bind9.', ck: () => zoneMX() },
   { t: 'Siapkan akun email', cmd: ['sudo adduser siswa'], n: 'Setiap user Linux otomatis memiliki alamat email. Pastikan user admin dan siswa ada. Jika siswa belum dibuat, buat dengan adduser.', ck: () => !!S.users.siswa },
   { t: 'Restart Postfix & Dovecot', cmd: ['sudo systemctl restart postfix dovecot'], n: 'Restart postfix dan dovecot agar konfigurasi baru dipakai.', ck: () => run('postfix') && run('dovecot') && postfixCfg(true).ok && mailFmtMatch(true) },
   { t: 'Kirim email admin → siswa', cmd: [], client: true, app: true, n: 'Buka tab Email di client. Pilih akun admin, tulis pesan ke siswa@lab.test dengan subjek Pengujian Mail Server, lalu Kirim.', ck: () => T_('mailsend') },
   { t: 'Baca email di akun siswa', cmd: [], client: true, app: true, n: 'Pindah ke akun siswa, login dengan password akun siswa, lalu klik Ambil Pesan. Email dari admin harus muncul di inbox.', ck: () => T_('mail') },
  ] },
{ id: 'db', scene: 'S12', no: 8, title: 'Database Server', sub: 'MariaDB: database, tabel, data, dan query SQL', icon: '🛢', files: ['/etc/mysql/mariadb.conf.d/50-server.cnf'], app: null, svcs: ['mariadb'],
  intro: 'Di Debian, MySQL digantikan oleh MariaDB yang kompatibel. Kita akan membuat database db_sekolah, tabel siswa, mengisi data, dan menampilkannya.',
  steps: [
   { t: 'Instal MariaDB Server', cmd: ['sudo apt install mariadb-server -y'], n: 'Pasang mariadb-server. Coba juga apt install mysql-server untuk melihat mengapa paket itu tidak tersedia di Debian.', ck: () => inst('mariadb-server') },
   { t: 'Periksa layanan', cmd: ['sudo systemctl enable --now mariadb', 'systemctl status mariadb'], n: 'Pastikan mariadb aktif dengan systemctl status mariadb.', ck: () => run('mariadb') && F('status:mariadb') },
   { t: 'Masuk konsol database', cmd: ['sudo mariadb -u root -p'], n: 'Masuk ke konsol dengan sudo mariadb -u root -p. Di Debian, root database memakai autentikasi unix socket, jadi harus dengan sudo.', ck: () => F('sqlin') },
   { t: 'Buat database', cmd: ['CREATE DATABASE db_sekolah;', 'USE db_sekolah;'], n: 'Buat database db_sekolah lalu pilih dengan USE db_sekolah. Setiap perintah SQL diakhiri titik koma.', ck: () => !!S.db.dbs.db_sekolah },
   { t: 'Buat tabel siswa', cmd: ['CREATE TABLE siswa (id INT AUTO_INCREMENT PRIMARY KEY, nama VARCHAR(100), jurusan VARCHAR(50));'], n: 'Buat tabel siswa dengan kolom id auto increment primary key, nama, dan jurusan.', ck: () => !!(S.db.dbs.db_sekolah && S.db.dbs.db_sekolah.siswa) },
   { t: 'Masukkan data', cmd: ["INSERT INTO siswa (nama, jurusan) VALUES ('Andi','TKJ'),('Budi','TKJ');"], n: 'Masukkan minimal dua baris data siswa dengan INSERT INTO.', ck: () => { const t = S.db.dbs.db_sekolah && S.db.dbs.db_sekolah.siswa; return !!t && t.rows.length >= 2; } },
   { t: 'Tampilkan data', cmd: ['SELECT * FROM siswa;'], n: 'Tampilkan isi tabel dengan SELECT bintang FROM siswa. Jika data muncul dalam bentuk tabel, database server berhasil.', ck: () => T_('db') },
  ] },
];

    const pat = this.mood === 'tension' ? [0, 2, 1, 3, 2, 1, 3, 2] : [0, 2, 4, 3, 1, 3, 2, 4];
    if (Math.random() < (this.mood === 'calm' ? 0.55 : 0.75)) { const n = ch[pat[pos % 8] % ch.length] + 12; this.pluck(n, t, this.mood === 'calm' ? 0.032 : 0.028); }
  },
  pad(n, t, dur, k) { const c = this.ctx; const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.022, t + 1.2); g.gain.setValueAtTime(0.022, t + dur - 0.9); g.gain.linearRampToValueAtTime(0, t + dur + 0.6); g.connect(this.lp); [-6, 6].forEach(dt => { const o = c.createOscillator(); o.type = k % 2 ? 'triangle' : 'sawtooth'; o.frequency.value = this.hz(n); o.detune.value = dt; o.connect(g); o.start(t); o.stop(t + dur + 0.7); }); },
  bass(n, t, dur) { const c = this.ctx; const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = this.hz(n); const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.13, t + 0.06); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g); g.connect(this.music); o.start(t); o.stop(t + dur + 0.1); },
  pluck(n, t, v) { const c = this.ctx; const o = c.createOscillator(); o.type = 'triangle'; o.frequency.value = this.hz(n); const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0008, t + 0.45); o.connect(g); g.connect(this.music); g.connect(this.dly); o.start(t); o.stop(t + 0.5); },
  tick(t, v) { const c = this.ctx; const b = c.createBuffer(1, 800, c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < 800; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / 800); const s = c.createBufferSource(); s.buffer = b; const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000; const g = c.createGain(); g.gain.value = v; s.connect(f); f.connect(g); g.connect(this.music); s.start(t); },
  kick(t) { const c = this.ctx; const o = c.createOscillator(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15); const g = c.createGain(); g.gain.setValueAtTime(0.14, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2); o.connect(g); g.connect(this.music); o.start(t); o.stop(t + 0.22); },
  tone(f, t0, dur, type = 'sine', v = 0.18, f2) { if (!this.ctx || !this.sfxOn) return; const c = this.ctx, t = c.currentTime + t0; const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur); const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.008); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g); g.connect(this.sfx); o.start(t); o.stop(t + dur + 0.02); },
};

const Narr = {
  on: true, ok: false, voice: null, rate: 1.0, speaking: false,
  init() {
    if (!('speechSynthesis' in window)) return; this.ok = true;
    const pick = () => { const v = speechSynthesis.getVoices(); this.voice = v.find(x => /^id[-_]ID/i.test(x.lang) && /google/i.test(x.name)) || v.find(x => /^id[-_]ID/i.test(x.lang)) || v.find(x => /^id/i.test(x.lang)) || v.find(x => /^ms/i.test(x.lang)) || null; };
    pick(); speechSynthesis.onvoiceschanged = pick;
  },
  say(text, opts = {}) {
    UI.dock(text, opts);
    if (!this.on || !this.ok) { UI.dockAutoMin(Math.max(6000, text.length * 55)); return; }
    try { speechSynthesis.cancel(); } catch (e) { }
    const clean = text.replace(/https?:\/\//g, '').replace(/[→•]/g, ',');
    const parts = clean.match(/[^.!?]+[.!?]*/g) || [clean];
    parts.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p.trim()); u.lang = 'id-ID'; if (this.voice) u.voice = this.voice; u.rate = this.rate; u.pitch = 1;
      if (i === 0) u.onstart = () => { this.speaking = true; AudioEng.duck(true); UI.dockTalk(true); };
      if (i === parts.length - 1) { u.onend = () => { this.speaking = false; AudioEng.duck(false); UI.dockTalk(false); UI.dockAutoMin(2500); }; u.onerror = u.onend; }
      speechSynthesis.speak(u);
    });
  },
  stop() { try { speechSynthesis.cancel(); } catch (e) { } this.speaking = false; AudioEng.duck(false); UI.dockTalk(false); },
};

function monStatus(r) {
  if (r.svc.some(n => !S.svc[n])) return ['FAILED', 'Belum terpasang'];
  if (r.svc.some(n => !S.svc[n].running)) return ['FAILED', 'Service tidak berjalan'];
  if (!S.tests[r.test]) return ['TEST REQUIRED', 'Aktif, belum diuji dari client'];
  let ok = false; try { ok = r.live(); } catch (e) { }
  if (!ok) return ['ACTIVE', 'Aktif, tetapi pemeriksaan fungsional gagal — uji ulang'];
  return ['SUCCESS', 'Aktif & pengujian fungsional berhasil'];
}
function vMonitor() {
  setTitle('Server Monitoring Dashboard', 'Network Services Monitoring — debian-server (192.168.10.2)', '📊');

    const all = MON.every(r => monStatus(r)[0] === 'SUCCESS'); S.monAll = all; save();
    const n = MON.filter(r => monStatus(r)[0] === 'SUCCESS').length;
    if (all) { SFX.done(); Narr.say('Semua sepuluh pemeriksaan layanan berstatus sukses. Infrastruktur server siap digunakan. Lanjutkan ke tantangan troubleshooting.'); }
    else Narr.say(`${n} dari ${MON.length} layanan berhasil. Layanan berstatus test required harus diuji dari client, dan layanan failed perlu diperiksa dengan systemctl status serta journalctl.`);

function shuffleSeed(arr, seed) { const a = arr.map((x, i) => [x, Math.sin(seed * 99 + i * 7.3)]); return a.sort((p, q) => p[1] - q[1]).map(x => x[0]); }
function vTS(openId) {
  setTitle('Tantangan Troubleshooting', 'Analisis gangguan → diagnosis → perbaikan → uji ulang', '🛠');

}
function tsCase(c) {
  const st = UI.tsState = { id: c.id, used: [], irr: 0, dTry: 0, fTry: 0, dOk: false, fOk: false };
  const checks = shuffleSeed(c.checks, c.id.length + c.id.charCodeAt(2));
  $('#tsMain').innerHTML = `<div class="card tsc"><div class="tcol"><div class="tsh"><span class="tag r">${c.svc}</span><h3>${c.title}</h3></div>
   <div class="sym"><b>Gejala:</b> ${esc(c.sym)}</div><pre class="errbox">${esc(c.err)}</pre>
   <h4>1. Pilih perintah pemeriksaan</h4><div class="chk">${checks.map((k, i) => `<button class="cmd" data-i="${c.checks.indexOf(k)}">$ ${esc(k.c)}</button>`).join('')}</div>
   <div class="tsterm" id="tsT"><div class="muted">Hasil pemeriksaan tampil di sini…</div></div></div>
   <div class="tcol r"><div id="tsD" class="tsq off"><h4>2. Diagnosis — ${esc(c.diag.q)}</h4>${c.diag.o.map((o, i) => `<label class="opt"><input type="radio" name="dg" value="${i}"> ${esc(o)}</label>`).join('')}<button class="btn sm pri" id="dOk">Kunci diagnosis</button><div id="dFb"></div></div>
   <div id="tsF" class="tsq off"><h4>3. Perbaikan — ${esc(c.fix.q)}</h4>${c.fix.o.map((o, i) => `<label class="opt"><input type="radio" name="fx" value="${i}"> ${esc(o)}</label>`).join('')}<button class="btn sm pri" id="fOk">Terapkan perbaikan</button><div id="fFb"></div></div>
   <div id="tsR" class="tsq off"><h4>4. Uji ulang</h4><button class="btn pri" id="rOk">▶ ${esc(c.re.c)}</button><div id="rFb"></div></div></div></div>`;
  Narr.say(`Kasus ${c.title}. ${c.sym} Pilih perintah pemeriksaan yang paling relevan.`);
  const term = $('#tsT');
  $$('.chk .cmd').forEach(b => b.onclick = () => {
    const k = c.checks[+b.dataset.i]; SFX.click(); if (term.querySelector('.muted')) term.innerHTML = '';
    term.insertAdjacentHTML('beforeend', `<div class="c-g">admin@debian-server:~$ ${esc(k.c)}</div><div>${esc(k.o)}</div>`); term.scrollTop = 1e6;
    if (!st.used.includes(b.dataset.i)) { st.used.push(b.dataset.i); if (!k.r) { st.irr++; b.classList.add('irr'); toast('Perintah ini kurang relevan dengan gejala (−efisiensi)', 'warn'); } else b.classList.add('rel'); }
    if (c.checks.some((x, i) => x.r && st.used.includes(String(i)))) $('#tsD').classList.remove('off');
  });
  $('#dOk').onclick = () => { const v = $('input[name=dg]:checked'); if (!v) return; st.dTry++; if (+v.value === c.diag.a) { st.dOk = true; $('#dFb').innerHTML = '<div class="fb ok">✅ <div>Diagnosis tepat.</div></div>'; SFX.ok(); $('#tsF').classList.remove('off'); $$('#tsD input').forEach(x => x.disabled = true); $('#dOk').disabled = true; Narr.say('Diagnosis tepat. Sekarang pilih tindakan perbaikan yang benar.'); } else { $('#dFb').innerHTML = '<div class="fb err">❌ <div>Belum tepat. Baca lagi hasil pemeriksaan.</div></div>'; SFX.err(); logErr('TS diagnosis salah: ' + c.title); } };
  $('#fOk').onclick = () => { const v = $('input[name=fx]:checked'); if (!v) return; st.fTry++; if (+v.value === c.fix.a) { st.fOk = true; $('#fFb').innerHTML = '<div class="fb ok">✅ <div>Perbaikan diterapkan.</div></div>'; SFX.ok(); $('#tsR').classList.remove('off'); $$('#tsF input').forEach(x => x.disabled = true); $('#fOk').disabled = true; } else { $('#fFb').innerHTML = '<div class="fb err">❌ <div>Tindakan ini tidak menyelesaikan akar masalah, atau justru menimbulkan risiko baru.</div></div>'; SFX.err(); logErr('TS perbaikan salah: ' + c.title); } };
  $('#rOk').onclick = async () => {
    $('#rOk').disabled = true; $('#rFb').innerHTML = '<p class="muted">Menguji…</p>'; await sleep(700);
    const sc = { d: [20, 10][st.dTry - 1] || 0, f: [50, 25][st.fTry - 1] || 0, r: 20, e: Math.max(0, 10 - 3 * st.irr) }; const tot = sc.d + sc.f + sc.r + sc.e;
    S.ts[c.id] = { done: true, score: tot, sc, irr: st.irr }; save(); SFX.done();
    $('#rFb').innerHTML = `<pre class="okbox">${esc(c.re.o)}</pre><div class="fb ok">🏁 <div><b>Skor kasus: ${tot}/100</b> <button class="btn sm" id="rDet">Lihat rincian</button></div></div>`;
    const det = () => modal(`<h2>🏁 ${esc(c.title)} — Skor ${tot}</h2><table class="tbl"><tr><th>Diagnosis</th><th>Perbaikan</th><th>Uji ulang</th><th>Efisiensi</th><th>Total</th></tr><tr><td>${sc.d}/20</td><td>${sc.f}/50</td><td>${sc.r}/20</td><td>${sc.e}/10</td><td><b>${tot}</b></td></tr></table><div class="lesson">💡 <b>Pelajaran:</b> ${esc(c.lesson)}</div><div class="rowr"><button class="btn pri" onclick="closeModal()">OK</button></div>`);
    $('#rDet').onclick = det; det();
    Narr.say(`Gangguan teratasi. Skor kamu ${tot}. ${c.lesson}`);
    $$('.tsi').forEach(b => { if (b.dataset.id === c.id) { b.classList.add('ok'); $('em', b).textContent = tot; } });
  };
}

function rcCase(c) {

  const prev = S.rc[c.id];
  $('#rcMain').innerHTML = `<div class="card ticket"><div class="tcol"><div class="tk-h"><div><small>TIKET #${1040 + RC_CASES.indexOf(c)} • ${c.tag}</small><h3>${esc(c.company)}</h3><p class="muted small">Pelapor: ${esc(c.who)}</p></div><span class="tag ${c.pri === 'Kritis' ? 'r' : c.pri === 'Tinggi' ? 'y' : 'b'}">${c.pri}</span></div>
   <blockquote>“${esc(c.ticket)}”</blockquote><h4>🔍 Bukti dari server</h4><pre class="errbox ev">${esc(c.evidence)}</pre>
   <div class="tsq"><h4>D. Catatan analisis <small>(opsional, masuk ke laporan)</small></h4><textarea id="rcNote" rows="2" placeholder="Tuliskan alasan dan perintah yang akan kamu jalankan...">${esc(S.rcNotes[c.id] || '')}</textarea></div>
   <div class="rowr"><span class="muted small" id="rcPrev">${prev ? `Nilai sebelumnya: <b>${prev.score}</b> — boleh dikerjakan ulang.` : ''}</span><button class="btn pri" id="rcGo">Kirim Penyelesaian Tiket ➤</button></div></div>
   <div class="tcol r"><div class="tsq"><h4>A. ${esc(c.q1.q)} <small>(30)</small></h4>${c.q1.o.map((o, i) => `<label class="opt"><input type="radio" name="q1" value="${i}"> ${esc(o)}</label>`).join('')}</div>
   <div class="tsq"><h4>B. Urutan langkah penyelesaian <small>(40) — klik sesuai urutan</small> <button class="btn sm" id="ordRst">↺</button></h4><div class="ordsrc">${shuffled.map(i => `<button class="ord" data-i="${i}"><i></i>${esc(c.steps[i])}</button>`).join('')}</div></div>
   <div class="tsq"><h4>C. ${esc(c.q3.q)} <small>(30)</small></h4>${c.q3.o.map((o, i) => `<label class="opt"><input type="radio" name="q3" value="${i}"> ${esc(o)}</label>`).join('')}</div></div></div>`;
  Narr.say(`Tiket dari ${c.company}. ${c.ticket}`);
  const draw = () => $$('.ord').forEach(b => { const k = order.indexOf(+b.dataset.i); b.classList.toggle('on', k >= 0); $('i', b).textContent = k >= 0 ? k + 1 : ''; });
  $$('.ord').forEach(b => b.onclick = () => { SFX.click(); const v = +b.dataset.i, k = order.indexOf(v); if (k >= 0) order.splice(k); else order.push(v); draw(); });

    tot >= 70 ? SFX.done() : SFX.err();
    modal(`<h2>🎫 Hasil Tiket — ${esc(c.tag)}</h2><div class="fb ${tot >= 70 ? 'ok' : 'warn'}">${tot >= 70 ? '✅' : '⚠'} <div><b>Nilai tiket: ${tot}/100</b> (A ${s1}/30 • B ${s2}/40 • C ${s3}/30)</div></div>
     <div class="key"><p><b>Akar masalah:</b> ${esc(c.q1.o[c.q1.a])}</p><p><b>Urutan yang tepat:</b></p><ol>${c.steps.map((s, i) => `<li class="${order[i] === i ? 'g' : 'r'}">${esc(s)}</li>`).join('')}</ol><p><b>Pencegahan:</b> ${esc(c.q3.o[c.q3.a])}</p></div><div class="rowr"><button class="btn pri" onclick="closeModal()">OK</button></div>`, { wide: true }); $('#rcPrev').innerHTML = `Nilai: <b>${tot}</b>`;
    Narr.say(tot >= 70 ? `Tiket diselesaikan dengan baik. Nilai ${tot}.` : `Nilai ${tot}. Pelajari kunci jawabannya: akar masalahnya adalah ${c.q1.o[c.q1.a]}`);
    $$('.tsi').forEach(b => { if (b.dataset.id === c.id) { b.classList.add('ok'); $('em', b).textContent = tot; } });
  };
}

/* ============================================================
   S15 — LAPORAN & EVALUASI
   ============================================================ */
function modScore(m) { const d = stepCount(m), n = m.steps.length; const pen = Math.min(20, (S.tpl[m.id] || 0) * 5 + (S.hints[m.id] || 0) * 2); return d ? Math.max(0, Math.round(d / n * 100) - (d === n ? pen : Math.min(pen, Math.round(d / n * 100)))) : 0; }
function vReport() {
  setTitle('Hasil Praktikum & Evaluasi', 'Final Report and Evaluation', '🏆');
  const rows = MODULES.map(m => [m.title, modScore(m), `${stepCount(m)}/${m.steps.length} langkah${S.tpl[m.id] ? `, templat ×${S.tpl[m.id]}` : ''}${S.hints[m.id] ? `, petunjuk ×${S.hints[m.id]}` : ''}`]);
  const tsAvg = Math.round(TS_CASES.reduce((s, c) => s + ((S.ts[c.id] && S.ts[c.id].score) || 0), 0) / TS_CASES.length);
  const rcAvg = Math.round(RC_CASES.reduce((s, c) => s + ((S.rc[c.id] && S.rc[c.id].score) || 0), 0) / RC_CASES.length);
  rows.push(['Troubleshooting (8 kasus)', tsAvg, `${TS_CASES.filter(c => S.ts[c.id]).length}/8 kasus selesai`]);
  rows.push(['Kasus Dunia Nyata (7 tiket)', rcAvg, `${RC_CASES.filter(c => S.rc[c.id]).length}/7 tiket selesai`]);
  const avg = (rows.reduce((s, r) => s + r[1], 0) / rows.length);
  const mins = Math.round((Date.now() - S.startedAt) / 60000);
  const pred = avg >= 90 ? ['A', 'Sangat Baik'] : avg >= 80 ? ['B', 'Baik'] : avg >= 75 ? ['C', 'Cukup (Tuntas)'] : ['D', 'Belum Tuntas'];
  const svcList = MON.map(r => { const s = monStatus(r); return `<li><span class="st ${s[0].replace(' ', '-')}">${s[0]}</span> ${r.k}</li>`; }).join('');
  $('#view').innerHTML = `<section class="report">
   <div class="card rp"><div class="rp-h"><div><small>LAPORAN PRAKTIKUM</small><h2>Konfigurasi dan Pengujian Layanan Server Debian Linux</h2><p class="muted">Administrasi Sistem Jaringan • Lab Maya TKJ</p></div><div class="badge ${avg >= 75 ? 'pass' : ''}"><b>${avg.toFixed(1).replace('.', ',')}</b><span>${pred[0]} — ${pred[1]}</span></div></div>
   <div class="grid3"><label class="fld">Nama peserta didik<input id="rN" value="${esc(S.student.name)}"></label><label class="fld">Kelas<input id="rK" value="${esc(S.student.kelas)}"></label><div class="fld">Tanggal / durasi<div class="ro2">${new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} • ${mins} menit • mode ${S.mode === 'guided' ? 'Terbimbing' : 'Mandiri'}</div></div></div>
   <div class="cols2"><div><h4>Nilai per materi</h4><table class="tbl"><tr><th>Materi</th><th>Nilai</th><th>Keterangan</th></tr>${rows.map(r => `<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td class="small">${r[2]}</td></tr>`).join('')}<tr class="tot"><td>Rata-rata</td><td><b>${avg.toFixed(1).replace('.', ',')}</b></td><td></td></tr></table></div>
   <div><h4>Hasil pengujian layanan</h4><ul class="svl">${svcList}</ul>
   <h4>Kesalahan yang ditemukan (${S.errs.length})</h4><ul class="errs">${S.errs.slice(-12).reverse().map(e => `<li><small>${e.t}</small> ${esc(e.m)}</li>`).join('') || '<li class="muted">Tidak ada catatan kesalahan.</li>'}</ul>
   <h4>Riwayat troubleshooting</h4><ul class="errs">${TS_CASES.filter(c => S.ts[c.id]).map(c => `<li>${c.title}: <b>${S.ts[c.id].score}</b> <small>(perintah tak relevan: ${S.ts[c.id].irr})</small></li>`).join('') || '<li class="muted">Belum ada.</li>'}</ul>
   ${Object.keys(S.rcNotes).filter(k => S.rcNotes[k]).length ? `<h4>Catatan analisis kasus nyata</h4><ul class="errs">${RC_CASES.filter(c => S.rcNotes[c.id]).map(c => `<li><b>${c.tag}:</b> ${esc(S.rcNotes[c.id])}</li>`).join('')}</ul>` : ''}</div></div>
   ${avg >= 75 ? `<div class="cert"><span>🏅</span><div><b>Network Administrator — Debian Server</b><p>Diberikan kepada ${esc(S.student.name || 'peserta didik')} atas penyelesaian praktikum layanan server Debian.</p></div></div>` : ''}
   <p class="muted small">Nilai dihitung dari langkah yang terverifikasi otomatis, dikurangi pemakaian templat/petunjuk; troubleshooting & kasus nyata dihitung dari rubrik masing-masing.</p>
   <div class="rowc noprint"><button class="btn pri" id="rPrint">🖨 CETAK LAPORAN</button><button class="btn" id="rCopy">📋 SALIN TEKS</button><button class="btn" id="rAgain">↺ ULANGI PRAKTIKUM</button><button class="btn" id="rHome">⌂ KEMBALI KE MENU UTAMA</button></div></div></section>`;
  $('#rN').onchange = e => { S.student.name = e.target.value; save(); }; $('#rK').onchange = e => { S.student.kelas = e.target.value; save(); };
  $('#rPrint').onclick = () => printReport(rows, avg, pred, mins); $('#rCopy').onclick = () => copyReport(rows, avg, pred, mins); $('#rHome').onclick = () => go('home'); $('#rAgain').onclick = resetAll;
  Narr.say(avg >= 75 ? 'Selamat! Kamu telah menyelesaikan praktikum Debian Server. Seluruh layanan jaringan telah dikonfigurasi dan diuji. Kamu berhasil menjalankan tugas sebagai seorang Network Administrator.' : `Nilai rata-rata kamu saat ini ${Math.round(avg)}. Lengkapi modul yang belum selesai, tantangan troubleshooting, dan kasus dunia nyata untuk mencapai ketuntasan.`);
}
async function resetAll() { if (!(await askDlg('Hapus seluruh progres dan mulai praktikum dari awal?', 'Ya, reset'))) return; const keep = { name: S.student.name, kelas: S.student.kelas }; S = freshState(); S.student = { name: keep.name, kelas: keep.kelas }; SRVT = null; UI.cterm = {}; UI.exp = UI.fz = UI.br = UI.ml = null; UI.editor = null; save(); go('home'); toast('Progres direset'); }

/* ============================================================
   BOOT
   ============================================================ */
function settingsDlg() {
  modal(`<h2>⚙ Pengaturan</h2>
  <label class="tg"><input type="checkbox" id="sMus" ${AudioEng.musicOn ? 'checked' : ''}> Backsound</label>
  <label class="fld">Volume backsound<input type="range" id="sVol" min="0" max="0.8" step="0.02" value="${AudioEng.vol}"></label>
  <label class="tg"><input type="checkbox" id="sSfx" ${AudioEng.sfxOn ? 'checked' : ''}> Efek suara</label>
  <label class="tg"><input type="checkbox" id="sNar" ${Narr.on ? 'checked' : ''}> Narasi suara instruktur</label>
  <label class="fld">Kecepatan narasi<input type="range" id="sRate" min="0.7" max="1.4" step="0.05" value="${Narr.rate}"></label>
  <p class="muted small">Suara narasi: ${Narr.ok ? (Narr.voice ? esc(Narr.voice.name) + ' (' + Narr.voice.lang + ')' : 'suara bawaan browser — pasang paket suara Bahasa Indonesia di sistem operasi untuk pelafalan terbaik') : 'browser tidak mendukung Web Speech'}</p>
  <hr><button class="btn" id="sReset">↺ Reset seluruh progres</button>`);
  $('#sMus').onchange = e => { AudioEng.start(); AudioEng.setMusic(e.target.checked); syncCtl(); };
  $('#sVol').oninput = e => { AudioEng.start(); AudioEng.setVol(+e.target.value); };
  $('#sSfx').onchange = e => AudioEng.sfxOn = e.target.checked;
  $('#sNar').onchange = e => { Narr.on = e.target.checked; if (!Narr.on) Narr.stop(); syncCtl(); };
  $('#sRate').oninput = e => Narr.rate = +e.target.value;
  $('#sReset').onclick = () => { closeModal(); resetAll(); };
}
function boot() {
  S = load() || freshState();
  Narr.init();
  $('#btnMusic').onclick = () => { AudioEng.start(); AudioEng.setMusic(!AudioEng.musicOn); syncCtl(); };
  $('#btnNarr').onclick = () => { Narr.on = !Narr.on; if (!Narr.on) Narr.stop(); else if (UI.lastNarr) Narr.say(UI.lastNarr); syncCtl(); };
  $('#btnSet').onclick = settingsDlg; $('#btnHelp').onclick = showGuide;
  $('#modeSel').onchange = e => { S.mode = e.target.value; save(); toast(S.mode === 'guided' ? 'Mode Terbimbing: petunjuk perintah & templat tersedia' : 'Mode Mandiri: petunjuk hanya jika diminta', 'warn'); if (UI.view === 'lab') { renderSteps(); renderEditor(); } };
  $('#dockReplay').onclick = () => UI.lastNarr && Narr.say(UI.lastNarr);
  $('#dockStop').onclick = () => Narr.stop();
  $('#dockMin').onclick = () => $('#dock').classList.toggle('min');
  $('#dockImg').onclick = () => $('#dock').classList.remove('min');
  // aktifkan audio pada interaksi pertama
  const first = () => { AudioEng.start(); window.removeEventListener('pointerdown', first); window.removeEventListener('keydown', first); if (UI.lastNarr && Narr.on && !Narr.speaking && UI.view === 'home') Narr.say(UI.lastNarr); };
  window.addEventListener('pointerdown', first); window.addEventListener('keydown', first);
  syncCtl(); go('home');
}
document.addEventListener('DOMContentLoaded', boot);

/* ---------- cetak / salin laporan ---------- */
function reportHTML(rows, avg, pred, mins) {
  const tr = rows.map(r => `<tr><td>${esc(r[0])}</td><td style="text-align:center"><b>${r[1]}</b></td><td>${esc(r[2])}</td></tr>`).join('');
  const sv = MON.map(r => `<tr><td>${r.k}</td><td>${r.port}</td><td>${monStatus(r)[0]}</td></tr>`).join('');
  const er = S.errs.slice(-15).map(e => `<li>${esc(e.t)} — ${esc(e.m)}</li>`).join('') || '<li>Tidak ada</li>';
  const ts = TS_CASES.filter(c => S.ts[c.id]).map(c => `<li>${c.title}: ${S.ts[c.id].score}</li>`).join('') || '<li>Belum ada</li>';
  const nt = RC_CASES.filter(c => S.rcNotes[c.id]).map(c => `<li><b>${c.tag}</b>: ${esc(S.rcNotes[c.id])}</li>`).join('');
  return `<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><title>Laporan Praktikum - ${esc(S.student.name)}</title><style>body{font-family:Arial,sans-serif;max-width:800px;margin:20px auto;color:#000}h1{font-size:20px;margin:0}h2{font-size:15px;margin:18px 0 6px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border:1px solid #888;padding:5px 7px}th{background:#e5e7eb}.hd{border-bottom:3px double #000;padding-bottom:8px;margin-bottom:10px}.na{font-size:30px;font-weight:bold}.ttd{display:flex;justify-content:space-between;margin-top:40px;font-size:13px}.ttd div{width:40%;text-align:center}@media print{button{display:none}}</style></head><body>
<div class="hd"><small>SMKN 1 Batam • Teknik Komputer dan Jaringan</small><h1>LAPORAN PRAKTIKUM ADMINISTRASI SISTEM JARINGAN</h1><div>Konfigurasi dan Pengujian Layanan Server Debian Linux — Lab Maya TKJ</div></div>
<table><tr><td width="30%">Nama peserta didik</td><td>${esc(S.student.name || '-')}</td></tr><tr><td>Kelas</td><td>${esc(S.student.kelas || '-')}</td></tr><tr><td>Tanggal praktikum</td><td>${new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</td></tr><tr><td>Durasi / mode</td><td>${mins} menit • ${S.mode === 'guided' ? 'Terbimbing' : 'Mandiri'}</td></tr><tr><td>Nilai akhir</td><td><span class="na">${avg.toFixed(1).replace('.', ',')}</span> (${pred[0]} — ${pred[1]})</td></tr></table>
<h2>A. Nilai per materi</h2><table><tr><th>Materi</th><th>Nilai</th><th>Keterangan</th></tr>${tr}</table>
<h2>B. Hasil pengujian layanan</h2><table><tr><th>Layanan</th><th>Port</th><th>Status</th></tr>${sv}</table>
<h2>C. Kesalahan yang ditemukan</h2><ul>${er}</ul><h2>D. Riwayat troubleshooting</h2><ul>${ts}</ul>${nt ? `<h2>E. Catatan analisis kasus dunia nyata</h2><ul>${nt}</ul>` : ''}
<div class="ttd"><div>Guru Pembimbing<br><br><br><br>(..............................)</div><div>Peserta Didik<br><br><br><br>(${esc(S.student.name || '..............................')})</div></div>
<p style="text-align:center;margin-top:24px"><button onclick="window.print()">🖨 Cetak</button></p></body></html>`;
}
async function printReport(rows, avg, pred, mins) {
  const html = reportHTML(rows, avg, pred, mins); const fn = `Laporan_DebianServerLab_${(S.student.name || 'peserta').replace(/\W+/g, '_')}.html`;
  let dl = null; try { dl = window.claude && window.claude.use ? await Promise.race([window.claude.use('downloads'), sleep(3000).then(() => null)]) : null; } catch (e) { dl = null; }
  if (dl) { try { await dl.save({ filename: fn, data: html, mimeType: 'text/html' }); toast('📄 Laporan disimpan. Buka file tersebut lalu tekan Cetak (Ctrl+P).'); return; } catch (e) { toast('Penyimpanan dibatalkan.', 'warn'); return; } }
  try { const w = window.open('', '_blank'); if (w) { w.document.write(html); w.document.close(); w.focus(); setTimeout(() => w.print(), 400); return; } } catch (e) { }
  try { window.print(); } catch (e) { }
  toast('Jika dialog cetak tidak muncul, gunakan tombol SALIN TEKS lalu tempel ke dokumen.', 'warn');
}
async function copyReport(rows, avg, pred, mins) {
  const t = `LAPORAN PRAKTIKUM — Konfigurasi dan Pengujian Layanan Server Debian Linux\nNama: ${S.student.name}\nKelas: ${S.student.kelas}\nTanggal: ${new Date().toLocaleDateString('id-ID')}\nDurasi: ${mins} menit\n\nNILAI PER MATERI\n${rows.map(r => `- ${r[0]}: ${r[1]} (${r[2]})`).join('\n')}\nRata-rata: ${avg.toFixed(1)} (${pred[0]} — ${pred[1]})\n\nHASIL PENGUJIAN LAYANAN\n${MON.map(r => `- ${r.k}: ${monStatus(r)[0]}`).join('\n')}\n\nKESALAHAN YANG DITEMUKAN\n${S.errs.slice(-15).map(e => `- ${e.t} ${e.m}`).join('\n') || '-'}`;
  try { await navigator.clipboard.writeText(t); toast('📋 Teks laporan disalin. Tempel ke Word/Google Docs.'); } catch (e) { modal(`<h3>Salin laporan</h3><textarea style="width:100%;height:300px">${esc(t)}</textarea>`); }
}
