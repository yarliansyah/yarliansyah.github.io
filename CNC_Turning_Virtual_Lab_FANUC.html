<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNC Turning Virtual Lab – FANUC Controller</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#04070d;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#e8eefc;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%;overflow:hidden;background:radial-gradient(ellipse at 70% 20%,#16305e 0%,#0a1630 55%,#060c1a 100%)}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
input,select,textarea{font-family:inherit}
.screen{position:absolute;inset:0;display:none}.screen.show{display:block}
b,strong{font-weight:700}
.y{color:#ffc400}.mono{font-family:Consolas,"DejaVu Sans Mono",monospace}
/* ---------- splash ---------- */
#screen-splash{background:#050a14}
#screen-splash .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(6px) brightness(.35);transform:scale(1.08)}
.splash-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.splash-logo{width:120px;height:120px;border-radius:28px;background:linear-gradient(135deg,#ffc400,#ff8a00);display:grid;place-items:center;font-size:64px;box-shadow:0 0 60px rgba(255,196,0,.45);animation:pulse 2.4s infinite}
.splash-c h1{font-size:56px;letter-spacing:1px}.splash-c h1 span{color:#ffc400}
.splash-c p{font-size:20px;color:#b8c6e6}
.loadbar{width:420px;height:8px;border-radius:8px;background:#1a2440;overflow:hidden}.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffc400,#ff7a00);transition:width .3s}
.bigbtn{padding:18px 54px;border-radius:16px;font-size:24px;font-weight:800;color:#1a1200;background:linear-gradient(180deg,#ffd84a,#ffb300);box-shadow:0 8px 0 #a86f00,0 14px 40px rgba(255,180,0,.35);transition:transform .1s}
.bigbtn:hover{transform:translateY(-2px)}.bigbtn:active{transform:translateY(4px);box-shadow:0 3px 0 #a86f00}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
/* ---------- opening ---------- */
#screen-opening .hero3d{position:absolute;right:0;top:0;width:1120px;height:900px}
#screen-opening .heroimg{position:absolute;right:0;top:0;width:1120px;height:804px;background-size:cover;background-position:center;border-radius:0;mask-image:linear-gradient(90deg,transparent 0,#000 22%)}
#screen-opening .shade{position:absolute;inset:0;background:linear-gradient(90deg,#071433 0%,rgba(7,20,51,.92) 32%,rgba(7,20,51,.15) 62%,transparent 80%),linear-gradient(0deg,rgba(5,12,30,.9) 0,transparent 28%);pointer-events:none}
.op-top{position:absolute;left:56px;top:40px;display:flex;align-items:center;gap:16px}
.op-top .tut{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,#2f72ff,#123a8f);display:grid;place-items:center;font-size:30px;border:3px solid #fff3}
.op-top div small{display:block;color:#b8c6e6;font-size:16px}.op-top div b{font-size:28px}
.op-tag{position:absolute;left:56px;top:150px;background:#ffc400;color:#0b1730;font-weight:900;font-style:italic;font-size:32px;padding:6px 28px;transform:skewX(-12deg)}
.op-title{position:absolute;left:56px;top:212px;font-size:60px;line-height:1.08;font-weight:800;text-shadow:0 4px 20px #0008}.op-title em{color:#ffc400}
.op-sub{position:absolute;left:58px;top:430px;width:620px;font-size:19px;line-height:1.5;color:#cfdaf5}
.op-btns{position:absolute;left:56px;top:540px;display:flex;gap:16px}
.mbtn{width:200px;height:132px;border-radius:18px;background:linear-gradient(180deg,rgba(28,58,120,.9),rgba(10,28,70,.95));border:2px solid #3f6bc0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:19px;font-weight:700;transition:.15s;box-shadow:0 10px 30px #0006}
.mbtn i{font-style:normal;font-size:40px}.mbtn:hover{transform:translateY(-4px);border-color:#ffc400}
.mbtn.primary{border:3px solid #ffc400;box-shadow:0 0 30px rgba(255,196,0,.45)}
.op-info{position:absolute;left:0;right:0;bottom:0;height:96px;background:rgba(5,14,36,.85);border-top:1px solid #2a4580;display:flex;align-items:center;gap:0;padding:0 56px}
.op-info>div{flex:1;display:flex;gap:14px;align-items:center;border-right:1px solid #2a4580;padding:0 24px}.op-info>div:last-child{border:none}
.op-info i{font-style:normal;font-size:34px}.op-info b{color:#ffc400;display:block;font-size:17px}.op-info span{font-size:15px;color:#d6e0f7}
.op-icons{position:absolute;right:34px;top:30px;display:flex;gap:12px}
.ic{width:52px;height:52px;border-radius:14px;background:rgba(20,40,90,.85);border:1px solid #3f6bc0;font-size:22px;display:grid;place-items:center}
.ic:hover{border-color:#ffc400}.ic.off{opacity:.45}
/* ---------- app shell ---------- */
#topbar{position:absolute;left:0;top:0;right:0;height:60px;background:linear-gradient(180deg,#0f2552,#0a1a3c);border-bottom:2px solid #ffc400;display:flex;align-items:center;padding:0 12px;gap:6px;z-index:20}
.brand{display:flex;align-items:center;gap:8px;margin-right:4px;width:205px;flex:none}
.brand .lg{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#ffc400,#ff8a00);display:grid;place-items:center;font-size:22px}
.brand b{font-size:14.5px;display:block;line-height:1.15;white-space:nowrap}.brand small{font-size:10px;color:#9fb3df;white-space:nowrap}
.nav{height:40px;padding:0 9px;border-radius:10px;font-size:13.5px;font-weight:600;color:#c9d6f3;display:flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.nav:hover{background:#1b3570;color:#fff}.nav.sel{background:#ffc400;color:#0b1730}
.tb-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.tb-right .ic{width:36px;height:36px;font-size:16px;border-radius:9px}
.pchip{display:flex;align-items:center;gap:6px;background:#132a5c;border:1px solid #2d4f96;border-radius:22px;padding:3px 10px 3px 3px;font-size:12px;cursor:pointer;max-width:120px}.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip img{width:30px;height:30px;flex:none;border-radius:50%;object-fit:cover;object-position:top}
.page{position:absolute;left:0;top:60px;width:1600px;height:840px;display:none;padding:12px}.page.show{display:block}
.card{background:linear-gradient(180deg,rgba(18,36,78,.92),rgba(10,22,52,.94));border:1px solid #2b4a8c;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card h3{font-size:17px;color:#ffc400;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.btn{height:38px;padding:0 16px;border-radius:10px;background:#1f3d7c;border:1px solid #3d64b4;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:.12s}
.btn:hover{background:#28509f}.btn.pri{background:linear-gradient(180deg,#ffd84a,#ffb300);color:#1c1300;border-color:#ffcf3a}.btn.pri:hover{filter:brightness(1.06)}
.btn.grn{background:#159a4e;border-color:#2bd27a}.btn.red{background:#b8231f;border-color:#ff5a52}.btn.sm{height:30px;font-size:12.5px;padding:0 10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.abs{position:absolute}
.view3d{position:relative;overflow:hidden;border-radius:14px;background:#111a28;border:1px solid #2b4a8c}
.view3d canvas#gl3d{position:absolute;left:0;top:0;display:block;cursor:grab}
.no3d{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:#9fb3df;font-size:15px}
.vtools{position:absolute;right:10px;top:10px;display:flex;gap:6px;z-index:3;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
.vtools button{height:30px;padding:0 10px;border-radius:8px;background:rgba(8,18,40,.85);border:1px solid #3d64b4;font-size:12px;font-weight:600}
.vtools button.sel,.vtools button:hover{background:#ffc400;color:#111}
.hud{position:absolute;left:10px;top:10px;background:rgba(4,10,24,.78);border:1px solid #2b4a8c;border-radius:10px;padding:8px 12px;font-family:Consolas,monospace;font-size:14px;z-index:3;line-height:1.45;pointer-events:none}
.hud b{color:#7fffd4}
.lbl3d{position:absolute;transform:translate(-50%,-100%);background:rgba(10,22,52,.9);border:1px solid #ffc400;color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap;pointer-events:auto;cursor:pointer;z-index:4}
.lbl3d:after{content:"";position:absolute;left:50%;bottom:-7px;width:2px;height:7px;background:#ffc400}
.marker{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#ffc400;color:#111;font-weight:900;display:grid;place-items:center;border:3px solid #fff;z-index:4;box-shadow:0 0 0 4px rgba(255,196,0,.35);font-size:15px}
.marker.ok{background:#22c55e;color:#fff}.marker.drop{transform:scale(1.3)}
.hot{position:absolute;transform:translate(-50%,-50%);z-index:4;display:flex;align-items:center;gap:8px;background:rgba(8,20,48,.9);border:2px solid #ffc400;border-radius:30px;padding:6px 14px 6px 6px;font-weight:700;font-size:14px;cursor:pointer;animation:hotp 2s infinite}
.hot i{font-style:normal;width:32px;height:32px;border-radius:50%;background:#ffc400;display:grid;place-items:center;font-size:17px}
@keyframes hotp{0%,100%{box-shadow:0 0 0 0 rgba(255,196,0,.6)}50%{box-shadow:0 0 0 10px rgba(255,196,0,0)}}
.hot:hover{background:#ffc400;color:#111}
/* subnav */
.subnav{position:absolute;left:12px;top:12px;width:240px;bottom:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.subnav button{text-align:left;padding:11px 12px;border-radius:12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;color:#c9d6f3;border:1px solid transparent}
.subnav button i{font-style:normal;width:30px;height:30px;border-radius:9px;background:#1b3570;display:grid;place-items:center;font-size:15px;flex:none}
.subnav button:hover{background:#17306a}.subnav button.sel{background:#1f3d7c;border-color:#ffc400;color:#fff}
.subnav button .ck{margin-left:auto;color:#22c55e;font-size:14px}
.content{position:absolute;left:264px;top:12px;right:12px;bottom:12px}
.tabs{display:flex;gap:6px}.tabs button{height:36px;padding:0 16px;border-radius:10px 10px 0 0;background:#132a5c;font-weight:700;font-size:14px;color:#9fb3df}.tabs button.sel{background:#ffc400;color:#111}
/* steps */
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid #23407c;font-size:13.5px;line-height:1.35}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;background:#23407c;display:grid;place-items:center;font-weight:800;font-size:13px}
.step.cur{border-color:#ffc400;background:rgba(255,196,0,.08)}.step.cur .n{background:#ffc400;color:#111}
.step.done{border-color:#1f8a4c;background:rgba(34,197,94,.08)}.step.done .n{background:#22c55e;color:#fff}
.step small{display:block;color:#9fb3df;font-size:12px;margin-top:2px}
.step .act{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
/* narrator */
#narr{position:absolute;left:14px;bottom:14px;width:610px;min-height:96px;display:none;z-index:40;align-items:flex-end;gap:0;pointer-events:none}
#narr.show{display:flex}
#narr .av{width:96px;height:96px;border-radius:50%;flex:none;background-size:cover;background-position:50% 12%;border:3px solid #ffc400;box-shadow:0 6px 20px #0008;pointer-events:auto;cursor:pointer;position:relative;z-index:2}
#narr.talking .av{animation:talk .5s infinite alternate}
@keyframes talk{from{box-shadow:0 0 0 0 rgba(255,196,0,.7)}to{box-shadow:0 0 0 9px rgba(255,196,0,0)}}
#narr .bub{margin-left:-14px;margin-bottom:6px;padding:10px 14px 10px 26px;background:rgba(9,22,54,.96);border:1px solid #ffc400;border-radius:16px;flex:1;pointer-events:auto;box-shadow:0 8px 30px #0009}
#narr .bub b{color:#ffc400;font-size:13px}#narr .bub p{font-size:14.5px;line-height:1.45;margin-top:3px;min-height:40px}
#narr .bub .nb{position:absolute;right:8px;top:6px;display:flex;gap:4px}#narr .bub .nb button{width:26px;height:26px;border-radius:7px;background:#1b3570;font-size:12px}
#narr .bub{position:relative}
#narr.min .bub{display:none}
#stage.opening #narr{left:auto;right:30px;bottom:auto;top:100px;width:560px}#narr.min .av{width:62px;height:62px}
/* toast/alarm/modal */
#toasts{position:absolute;right:16px;top:72px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;padding:10px 16px;border-radius:12px;background:#122a5c;border:1px solid #3d64b4;box-shadow:0 10px 30px #0008;font-size:14px;max-width:520px;animation:tin .25s}
.toast.ok{border-color:#22c55e;background:#0f3b26}.toast.err{border-color:#ff5a52;background:#4a1212}.toast.warn{border-color:#ffc400;background:#3d300a}
.toast .ti{font-weight:900}.toast.out{opacity:0;transform:translateX(30px);transition:.4s}
@keyframes tin{from{opacity:0;transform:translateX(30px)}}
#alarmBar{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:55;display:none;align-items:center;gap:14px;padding:10px 18px;background:linear-gradient(90deg,#7a0d0d,#c41f1f);border:2px solid #ff8a80;border-radius:12px;font-weight:700;box-shadow:0 0 40px rgba(255,0,0,.45)}
#alarmBar.show{display:flex;animation:blink 1s infinite}
@keyframes blink{50%{box-shadow:0 0 10px rgba(255,0,0,.2)}}
.shake{animation:shake .5s}@keyframes shake{20%{transform:translate(-50%,-50%) translate(-8px,4px) scale(var(--s))}40%{transform:translate(-50%,-50%) translate(8px,-4px) scale(var(--s))}60%{transform:translate(-50%,-50%) translate(-6px,2px) scale(var(--s))}80%{transform:translate(-50%,-50%) translate(4px,-2px) scale(var(--s))}}
#modal{position:absolute;inset:0;background:rgba(2,6,16,.7);z-index:70;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
#modal.show{display:flex}
#modalBox{max-height:820px;display:flex;flex-direction:column;background:linear-gradient(180deg,#132a5c,#0b1a3c);border:2px solid #ffc400;border-radius:18px;box-shadow:0 20px 60px #000a;overflow:hidden}
.mhead{display:flex;align-items:center;padding:12px 18px;background:#0a1a3c;border-bottom:1px solid #2b4a8c;font-size:18px}.mhead b{color:#ffc400}.mx{margin-left:auto;width:32px;height:32px;border-radius:8px;background:#1b3570}
.mbody{padding:16px 18px;overflow:auto;font-size:14.5px;line-height:1.55}.mfoot{padding:12px 18px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid #2b4a8c}
.mbody h4{color:#ffc400;margin:10px 0 4px}.mbody ul{padding-left:20px}
/* tables */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}table.t th{background:#1b3570;color:#ffc400;padding:7px 8px;text-align:left;font-weight:700}table.t td{padding:6px 8px;border-bottom:1px solid #23407c}
table.t input{width:90px;height:28px;border-radius:6px;border:1px solid #3d64b4;background:#081433;color:#fff;padding:0 6px;font-family:Consolas,monospace}
.ok-t{color:#22c55e;font-weight:800}.ng-t{color:#ff5a52;font-weight:800}
.inp{height:36px;border-radius:9px;border:1px solid #3d64b4;background:#081433;color:#fff;padding:0 10px;font-size:14px}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;background:#1b3570}
.pill.g{background:#14532d;color:#86efac}.pill.r{background:#5a1414;color:#fca5a5}.pill.y{background:#4a3a06;color:#ffd84a}
/* ---------- FANUC PANEL ---------- */
.fpanel{width:560px;height:808px;background:linear-gradient(180deg,#d9dde3,#bfc5cd);border-radius:14px;padding:8px;color:#111;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 2px #fff6,0 10px 30px #0008;position:relative}
.fp-unit{background:#2a2f37;border-radius:10px;padding:6px 8px 8px}
.fp-brand{color:#ddd;font-size:12px;margin-bottom:4px}.fp-brand b{color:#ffd400;font-size:14px;letter-spacing:1px}
.fp-screen{display:flex;gap:6px}
.fp-bezel{background:#111;border-radius:6px;padding:5px;box-shadow:inset 0 0 8px #000}
#fanucLCD{width:432px;height:270px;display:block;border-radius:2px;image-rendering:auto}
.fp-side{display:flex;flex-direction:column;gap:5px;flex:1}
.fk{height:48px;border-radius:6px;background:linear-gradient(180deg,#f2f3f5,#c9cdd3);color:#123;font-size:11.5px;font-weight:800;box-shadow:0 2px 0 #777}
.fk.sel{background:linear-gradient(180deg,#ffe36a,#ffc400)}
.fp-soft{display:flex;gap:4px;margin-top:6px;padding:0 2px}.sk{flex:1;height:22px;border-radius:4px;background:linear-gradient(180deg,#e9ebee,#b9bec5);font-size:10.5px;font-weight:700;color:#123;box-shadow:0 2px 0 #666;font-family:Consolas,monospace}
.fp-mid{display:flex;gap:6px}
.fp-keys{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;flex:1}
.fp-edit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;width:186px}
.kk{height:26px;border-radius:5px;background:linear-gradient(180deg,#fdfdfd,#d4d8dd);font-size:12px;font-weight:800;color:#203;box-shadow:0 2px 0 #8a8f96}
.kk.num{background:linear-gradient(180deg,#fff,#e6e9ed)}.kk.fn{background:linear-gradient(180deg,#e6ecf7,#b9c6dd);font-size:10.5px}
.kk.red{background:linear-gradient(180deg,#ff9b8f,#e24a3d);color:#fff}
.kk:active,.ob:active,.fk:active,.sk:active{transform:translateY(2px);box-shadow:none}
.fp-op{flex:1;background:#2b3038;border-radius:10px;padding:7px;display:flex;flex-direction:column;gap:6px;color:#e6e6e6}
.oprow{display:flex;gap:8px;align-items:center;justify-content:space-between}
.oprow.r2{align-items:stretch}
.pw{display:flex;flex-direction:column;gap:6px}
.ob{min-width:54px;height:32px;border-radius:7px;background:linear-gradient(180deg,#f4f5f6,#c7ccd2);color:#123;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 3px 0 #555;position:relative;padding:0 4px;line-height:1.05}
.ob .led{width:16px;height:4px;border-radius:2px;background:#59606a}.ob.lit .led{background:#3cff6a;box-shadow:0 0 6px #3cff6a}
.ob.g{background:linear-gradient(180deg,#5af08b,#16a34a);color:#fff}.ob.r{background:linear-gradient(180deg,#ff8a80,#d32f2f);color:#fff}
.ob.big{width:86px;height:46px;font-size:11px}.ob.g.lit{box-shadow:0 0 14px #3cff6a,0 3px 0 #555}.ob.r.lit{box-shadow:0 0 14px #ff3b3b,0 3px 0 #555}
.ob.jog{width:44px;min-width:44px;font-size:20px}.ob.jog.on{background:#ffc400}
.ob.ax{width:44px;min-width:44px;font-size:15px}
.cyc{display:flex;flex-direction:column;gap:8px}
.modesel{position:relative;width:150px;height:112px}
.knob{position:absolute;left:44px;top:30px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#555,#111);box-shadow:0 4px 10px #000,inset 0 0 0 4px #333;cursor:pointer}
.knob-ptr{position:absolute;left:50%;top:6px;width:6px;height:24px;margin-left:-3px;background:#fff;border-radius:3px;transform-origin:50% 25px;transition:transform .2s}
.mlab{position:absolute;transform:translate(-50%,-50%);font-size:10px;font-weight:800;color:#cfd4da;padding:2px 4px;border-radius:4px;background:#3a414b}
.mlab.sel{background:#ffc400;color:#111}
.estop{width:88px;height:88px;border-radius:50%;background:#ffd400;display:grid;place-items:center;position:relative;cursor:pointer;box-shadow:0 4px 10px #000}
.estop-cap{width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6b5e,#b10f0f);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;box-shadow:0 6px 0 #6b0000,0 8px 14px #000;transition:.1s;z-index:1}
.estop.pressed .estop-cap{box-shadow:0 1px 0 #6b0000;transform:translateY(4px)}
.estop-ring{position:absolute;top:4px;font-size:8px;font-weight:900;color:#111;letter-spacing:.5px}
.grp{background:#353b45;border-radius:8px;padding:5px;display:flex;flex-direction:column;gap:5px;align-items:center}
.grp label{font-size:9px;color:#aab;font-weight:700;letter-spacing:.5px}
.grp .ob{min-width:0;width:100%}
.axr{display:flex;gap:4px;width:100%;justify-content:center}.axr .ob{flex:1}
.mpg{display:flex;flex-direction:column;align-items:center;gap:2px}
.mpg-dial{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f0f0f0,#8b9098);box-shadow:0 3px 8px #000,inset 0 0 0 3px #aaa;position:relative;cursor:grab;touch-action:none}
.mpg-dial:before{content:"";position:absolute;inset:4px;border-radius:50%;background:repeating-conic-gradient(#555 0 2deg,transparent 2deg 9deg);mask:radial-gradient(circle,transparent 62%,#000 63%)}
.mpg-grip{position:absolute;left:44px;top:14px;width:12px;height:12px;border-radius:50%;background:#333}
.mpg-lab{font-size:9px;color:#ccc}
.ovr{display:flex;flex-direction:column;align-items:center;cursor:pointer;width:62px}
.ovr-knob{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#555,#111);position:relative;box-shadow:0 3px 8px #000}
.ovr-knob .knob-ptr{height:16px;top:3px;transform-origin:50% 19px}
.ovr-v{font-size:12px;font-weight:800;color:#ffd400;font-family:Consolas,monospace}.ovr small{font-size:8.5px;color:#aab}
.fpanel .hl-pulse{outline:3px solid #ff2d55;outline-offset:2px;animation:hlp .8s infinite}
@keyframes hlp{50%{outline-color:#ffd400}}
/* ---------- editor ---------- */
.editor{position:relative;background:#06135a;border:3px solid #2a2f37;border-radius:10px;overflow:hidden;font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:15px;line-height:22px}
.editor .ehead{height:30px;background:#ffd400;color:#000;display:flex;align-items:center;padding:0 10px;font-weight:700;font-size:14px}
.editor .ewrap{position:absolute;left:0;right:0;top:30px;bottom:0;overflow:hidden}
.editor .gut{position:absolute;left:0;top:0;width:44px;bottom:0;background:#040d40;color:#6d7bc4;text-align:right;padding:8px 6px 0 0;overflow:hidden;white-space:pre}
.editor pre,.editor textarea{position:absolute;left:44px;top:0;right:0;bottom:0;padding:8px 10px;margin:0;font:inherit;line-height:22px;white-space:pre;overflow:auto;tab-size:4}
.editor pre{color:#fff;pointer-events:none;overflow:hidden}
.editor textarea{background:transparent;color:transparent;caret-color:#ffd400;border:none;outline:none;resize:none;user-select:text}
.editor textarea::selection{background:rgba(255,212,0,.35)}
.tk-g{color:#5fe1ff}.tk-m{color:#ff7ad9}.tk-c{color:#ffe066}.tk-f{color:#7dff9a}.tk-n{color:#8a97d8}.tk-o{color:#ffa94d;font-weight:700}.tk-cm{color:#8890b5;font-style:italic}.tk-err{background:rgba(255,60,60,.35);border-radius:3px}.tk-warn{background:rgba(255,200,0,.18)}.tk-cur{background:rgba(255,212,0,.25)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:5px 10px;border-radius:8px;background:#1b3570;border:1px solid #3d64b4;font-family:Consolas,monospace;font-weight:700;font-size:13px;cursor:pointer}
.chip:hover,.chip.sel{background:#ffc400;color:#111}
.chip.drag{cursor:grab;font-family:inherit}
.errlist{overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:5px}
.errlist div{padding:6px 9px;border-radius:8px;background:#3a1010;border-left:4px solid #ff5a52;cursor:pointer}.errlist div.w{background:#3a300a;border-color:#ffc400}.errlist div.o{background:#0f3b26;border-color:#22c55e}
.proglist{font-family:Consolas,monospace;font-size:13px;line-height:20px;overflow:hidden;background:#06135a;border-radius:10px;padding:6px 0;white-space:pre}
.proglist div{padding:0 10px}.proglist div.cur{background:#ffd400;color:#000}
/* misc components */
.thumb{width:100%;border-radius:10px;object-fit:cover;background:#fff}
.compbtn{display:flex;gap:8px;align-items:center;padding:6px;border-radius:10px;background:#132a5c;border:1px solid #2b4a8c;font-size:13px;font-weight:600;text-align:left}
.compbtn img{width:42px;height:34px;object-fit:cover;border-radius:6px;background:#fff}.compbtn.sel{border-color:#ffc400;background:#1f3d7c}.compbtn.ok{border-color:#22c55e}
.lamp{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 8px;border-radius:8px;background:#0b1a3c}
.lamp i{width:14px;height:14px;border-radius:50%;background:#51596a;flex:none}.lamp.on i{background:#22c55e;box-shadow:0 0 10px #22c55e}.lamp.bad i{background:#ff3b3b;box-shadow:0 0 10px #ff3b3b}
.levels{display:flex;flex-direction:column;gap:6px}
.lvl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#0f2250;border:1px solid #23407c;cursor:pointer;transition:.12s}
.lvl:hover{border-color:#ffc400;transform:translateX(3px)}.lvl .ln{width:34px;height:34px;border-radius:10px;background:#1f3d7c;display:grid;place-items:center;font-weight:900;color:#ffc400}
.lvl b{font-size:14px}.lvl small{display:block;color:#9fb3df;font-size:12px}.lvl .st{margin-left:auto}
.lvl.done .ln{background:#22c55e;color:#fff}
.room{position:relative;height:96px;border-radius:12px;overflow:hidden;background-size:cover;background-position:center;border:1px solid #2b4a8c;cursor:pointer;display:flex;align-items:flex-end}
.room span{width:100%;padding:6px 8px;background:linear-gradient(0deg,rgba(5,12,30,.92),transparent);font-weight:700;font-size:13px}.room:hover{border-color:#ffc400}
.apd{position:relative;border-radius:12px;background:#fff;height:112px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:3px solid transparent;overflow:hidden}
.apd img{max-width:90%;max-height:80px}.apd span{position:absolute;bottom:0;left:0;right:0;background:#0b1a3cdd;font-size:12px;font-weight:700;text-align:center;padding:3px}
.apd.on{border-color:#22c55e}.apd.on:after{content:"✔";position:absolute;right:6px;top:4px;color:#22c55e;font-weight:900;font-size:18px}.apd.bad{border-color:#ff3b3b}
.chk{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;background:#0f2250;border:1px solid #23407c;cursor:pointer;font-size:14px}
.chk i{width:24px;height:24px;border-radius:6px;border:2px solid #4a6cb8;display:grid;place-items:center;font-style:normal;flex:none}.chk.on{border-color:#22c55e}.chk.on i{background:#22c55e;border-color:#22c55e}.chk.on i:after{content:"✔";color:#fff;font-size:14px}
.big-n{font-family:Consolas,monospace;font-size:44px;font-weight:800;color:#7fffd4}
.formula{background:#081433;border:1px dashed #3d64b4;border-radius:12px;padding:10px 14px;font-family:Consolas,monospace;font-size:15px;line-height:1.6}
input[type=range]{width:100%;accent-color:#ffc400}
.slider-row{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:14px}
.slider-row b{font-family:Consolas,monospace;color:#ffc400;text-align:right}
.quiz-opt{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:10px;background:#132a5c;border:1px solid #2b4a8c;margin-top:7px;font-size:14px}
.quiz-opt:hover{border-color:#ffc400}.quiz-opt.right{background:#14532d;border-color:#22c55e}.quiz-opt.wrong{background:#5a1414;border-color:#ff5a52}
.bar{height:12px;border-radius:8px;background:#0b1a3c;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffc400,#22c55e);border-radius:8px}
.stepper{display:flex;gap:6px;margin-bottom:10px}
.stepper button{flex:1;height:44px;border-radius:12px;background:#132a5c;border:1px solid #2b4a8c;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;color:#9fb3df}
.stepper button.sel{background:#ffc400;color:#111;border-color:#ffc400}.stepper button.done{border-color:#22c55e;color:#86efac}.stepper button:disabled{opacity:.35}
.dropzone{position:absolute;border:3px dashed #ffc400;border-radius:14px;background:rgba(255,196,0,.08);display:grid;place-items:center;color:#ffc400;font-weight:800;z-index:5;pointer-events:none;font-size:16px}
.dragghost{position:absolute;z-index:80;pointer-events:none;opacity:.9;transform:translate(-50%,-50%)}
.instr{display:flex;gap:10px}.instr button{flex:1;background:#fff;border-radius:12px;border:3px solid transparent;padding:6px;color:#111;font-weight:700;font-size:13px}
.instr button img{height:56px;max-width:100%;object-fit:contain;display:block;margin:0 auto 4px}.instr button.sel{border-color:#ffc400;box-shadow:0 0 0 3px rgba(255,196,0,.35)}
.readout{font-family:Consolas,monospace;background:#a9c79a;color:#102010;font-size:34px;font-weight:800;padding:6px 14px;border-radius:8px;box-shadow:inset 0 0 10px rgba(0,0,0,.4);text-align:right;letter-spacing:2px}
.cert{width:100%;border-radius:10px;border:1px solid #2b4a8c}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#3d64b4;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
</style>
</head>

<script>/* ================= CORE: helpers, stage, store, audio, narrator ================= */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k]; if (v == null || v === false) continue;
    if (k === 'class') el.className = v; else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (k === 'html') el.innerHTML = v; else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const f3 = v => (v < 0 ? '-' : ' ') + Math.abs(v).toFixed(3);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const IMG = window.__IMG || {};

/* ---------- stage scaling (16:9, no scroll) ---------- */
let STAGE_SCALE = 1;
function fitStage() {
  const st = $('#stage'); STAGE_SCALE = Math.min(innerWidth / 1600, innerHeight / 900);
  st.style.transform = `translate(-50%,-50%) scale(${STAGE_SCALE})`;
}
function stagePt(e) { const r = $('#stage').getBoundingClientRect(); return { x: (e.clientX - r.left) / STAGE_SCALE, y: (e.clientY - r.top) / STAGE_SCALE }; }

  load() { try { const s = JSON.parse(localStorage.getItem(this.key)); if (s) this.d = Object.assign(this.d, s, { settings: Object.assign(this.d.settings, s.settings || {}) }); } catch (e) { } },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.d)); } catch (e) { } },

/* ---------- AUDIO ENGINE (procedural music + machine sounds) ---------- */
const AudioX = {
  ctx: null, nodes: {}, musicOn: true, sfxOn: true, step: 0, nextT: 0, intensity: 1, alarmTimer: null, duck: 1,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4; comp.connect(c.destination);
    const master = c.createGain(); master.gain.value = 0.9; master.connect(comp);
    const mus = c.createGain(); mus.gain.value = 0; mus.connect(master);
    const sfx = c.createGain(); sfx.gain.value = 0.55; sfx.connect(master);

    this.typing = setInterval(() => { el.textContent = text.slice(0, i += 2); if (i >= text.length) clearInterval(this.typing); }, 18);

/* ---------- MATERIAL (radius profile along part Z) ---------- */
const MAT = {
  zMin: -70, zMax: 12, step: 0.05, N: 0, r: null, ver: 0,
  loaded: false, dia: 30, len: 60, face: 5, end: -55, cf: -45, name: 'Aluminium 6061',
  init() { this.N = Math.round((this.zMax - this.zMin) / this.step) + 1; this.r = new Float32Array(this.N); },
  idx(z) { return Math.round((z - this.zMin) / this.step); },
  zAt(i) { return this.zMin + i * this.step; },
  load(dia = 30, len = 60, stick = 50, name, face = 0) {
    if (!this.r) this.init();
    this.dia = dia; this.len = len; this.face = face; this.end = face - len; this.cf = face - stick; if (name) this.name = name;
    for (let i = 0; i < this.N; i++) { const z = this.zAt(i); this.r[i] = (z <= this.face + 1e-6 && z >= this.end - 1e-6) ? dia / 2 : 0; }
    this.loaded = true; this.ver++; Bus.emit('material');
  },
  unload() { if (!this.r) this.init(); this.r.fill(0); this.loaded = false; this.ver++; Bus.emit('material'); },
  rAt(z) { const i = this.idx(z); return (i < 0 || i >= this.N) ? 0 : this.r[i]; },
  snapshot() { return Float32Array.from(this.r); },
  faceZ() { for (let i = this.N - 1; i >= 0; i--) if (this.r[i] > 0.3) return this.zAt(i); return 0; },
  // profile points (z, r) simplified for drawing / 3D
  profile(tol = 0.01) {
    const pts = []; const r = this.r; let last = -1;
    for (let i = 0; i < this.N; i++) {
      const prev = i > 0 ? r[i - 1] : 0, next = i < this.N - 1 ? r[i + 1] : 0;
      if (r[i] !== prev || r[i] !== next) pts.push([this.zAt(i), r[i]]);
    }
    if (pts.length > 500) return rdp(pts, tol * 4);
    return pts;
  }
};
function rdp(pts, eps) {
  if (pts.length < 3) return pts;
  const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1;
  const st = [[0, pts.length - 1]];
  while (st.length) {
    const [a, b] = st.pop(); let md = 0, mi = -1;
    const [x1, y1] = pts[a], [x2, y2] = pts[b]; const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1e-9;
    for (let i = a + 1; i < b; i++) { const d = Math.abs(dy * pts[i][0] - dx * pts[i][1] + x2 * y1 - y2 * x1) / L; if (d > md) { md = d; mi = i; } }
    if (md > eps && mi > 0) { keep[mi] = 1; st.push([a, mi], [mi, b]); }
  }
  return pts.filter((p, i) => keep[i]);
}

  mode: 'EDIT', axis: 'X', inc: 0.01, feedOvr: 100, spOvr: 100, rapidOvr: 50,
  singleBlock: false, dryRun: false, optStop: false,
  m: { x: -95, z: -140 }, rel: { x: 0, z: 0 },
  tool: 1, off: 1, turret: { ...TURRET_DEFAULT }, turretAng: 0, turretTarget: 0,
  geo: {}, wear: {}, offMeasured: {},
  sp: { dir: 0, S: 0, css: false, V: 0, max: 3000, rpm: 0, target: 0 }, coolant: false,
  F: 0, feedMode: 99, motion: 0,
  state: 'idle', alarms: [], warns: [],
  progText: '', progName: 'O0001', blocks: [], ops: [], opi: 0, curBlk: -1, mdiText: '',
  simSpeed: 1, trace: [], cutRate: 0, lastCut: 0, runTime: 0, cutTime: 0,
  jog: null, hnd: 0, manualSpindleS: 800, pagesel: 'POS', keybuf: '',

  tipHome(t) { const L = TOOL_LEN[t] || [0, 0]; return { x: HOME_X + L[0], z: MAT.cf + HOME_Z_FROM_CF + L[1] }; },
  trueOffset(t) { const H = this.tipHome(t); return { x: -H.x, z: -H.z }; },

  clearOffsets() { for (let t = 1; t <= 8; t++) { this.geo[t] = { x: 0, z: 0, r: TOOL_TYPES[this.turret[t]]?.nose || 0, t: 3 }; this.wear[t] = { x: 0, z: 0 }; this.offMeasured[t] = { x: false, z: false }; } Bus.emit('change'); },
  O(t = this.off) { const g = this.geo[t] || { x: 0, z: 0 }, w = this.wear[t] || { x: 0, z: 0 }; return { x: g.x + w.x, z: g.z + w.z }; },
  tip() { const H = this.tipHome(this.tool); return { x: this.m.x + H.x, z: this.m.z + H.z }; }, // true tip, part coords (x dia)
  abs() { const o = this.O(); return { x: this.m.x - o.x, z: this.m.z - o.z }; },
  toolType() { return this.turret[this.tool]; },

  /* ---------- alarms ---------- */
  alarm(code, msg, crash) {

  },
  reset() {

    this.sp.target = 0; this.sp.dir = 0; this.coolant = false; this.cutRate = 0;

  },
  setPower(on) {

  },
  setEstop(on) {

    Bus.emit('event', 'estop', on); Bus.emit('change');
  },
  setDoor(st) {
    this.door = st; Bus.emit('event', 'door', st);
    if (st === 'open' && (this.state === 'run' || this.sp.rpm > 1)) {
      this.alarm('EX1001', 'PINTU TERBUKA – INTERLOCK AKTIF'); this.sp.target = 0; this.sp.dir = 0; this.coolant = false;
    }

  },
  setMode(m) { this.mode = m; this.jog = null; Bus.emit('event', 'mode', m); Bus.emit('change'); },
  ready() { return this.power && this.booting <= 0 && !this.estop && !this.alarms.length; },

  /* ---------- spindle ---------- */
  spindleCmd(dir, S, css) {

    this.sp.dir = dir; Bus.emit('event', 'spindle', dir);
  },
  rpmTarget() {

    let n = this.sp.S;
    if (this.sp.css) { const X = Math.max(Math.abs(this.abs().x), 1); n = 1000 * this.sp.S / (Math.PI * X); }
    n = Math.min(n, this.sp.max || 4000, 4000);
    return n * this.spOvr / 100;
  },

  /* ---------- motion core ---------- */
  // move machine position by small steps toward target (machine coords). cut=true for feed moves
  moveStep(nx, nz, cut) {
    // overtravel
    if (nx > 0.002) return this.alarm('OT0500', '+X OVER TRAVEL (BATAS SUMBU)'), false;
    if (nz > 0.002) return this.alarm('OT0500', '+Z OVER TRAVEL (BATAS SUMBU)'), false;
    if (nx < LIM.xmin) return this.alarm('OT0501', '-X OVER TRAVEL (BATAS SUMBU)'), false;
    if (nz < LIM.zmin) return this.alarm('OT0501', '-Z OVER TRAVEL (BATAS SUMBU)'), false;
    const ox = this.m.x, oz = this.m.z;
    const d = Math.hypot((nx - ox) / 2, nz - oz); const n = Math.max(1, Math.ceil(d / 0.05));

      }

    }

  },
  // returns removed volume or -1 on crash
  cutAt(tz, tr, tt, canCut) {
    const r = MAT.r, i0 = Math.max(0, MAT.idx(tz + tt.dz[0])), i1 = Math.min(MAT.N - 1, MAT.idx(tz + tt.dz[1]));
    let vol = 0, inter = false;
    for (let i = i0; i <= i1; i++) {
      const dz = MAT.zAt(i) - tz, hs = MAT.step * 0.5; const lim = Math.max(0, tr + (Math.abs(dz) <= hs ? 0 : tt.low(dz - Math.sign(dz) * hs)));
      if (r[i] > lim + 0.003) { inter = true; if (canCut) { const nl = Math.max(lim, 0); vol += (r[i] * r[i] - nl * nl); r[i] = nl; } }
    }

      this.alarm('EX2002', this.sp.rpm > 5 ? 'TABRAKAN! Gerak cepat G00 masuk ke benda kerja' : 'TABRAKAN! Pahat menyentuh benda kerja saat spindle BERHENTI', true);

  },
  addTrace(type) {
    const t = this.tip(); const L = this.trace; const last = L[L.length - 1];
    if (last && last.type === type) { const p = last.pts[last.pts.length - 1]; if (Math.abs(p[0] - t.z) + Math.abs(p[1] - t.x) > 0.15) last.pts.push([t.z, t.x]); }

  },

  /* ---------- program ---------- */
  loadProgram(text, name) { this.progText = text; if (name) this.progName = name; this.ops = []; this.opi = 0; this.curBlk = -1; this.blocks = parseProgram(text).blocks; Bus.emit('program'); Bus.emit('change'); },
  cycleStart() {
    Bus.emit('event', 'cycle');

    if (this.guard && !this.guard()) return;
    if (this.alarms.length) { Bus.emit('msg', 'Masih ada ALARM. Tekan RESET setelah penyebab diperbaiki.'); return; }
    if (this.state === 'hold' || this.state === 'sbwait' || this.state === 'optstop') { this.state = 'run'; Bus.emit('change'); return; }
    if (this.state === 'run') return;
    if (this.mode !== 'MEM' && this.mode !== 'MDI') { Bus.emit('msg', 'CYCLE START hanya bekerja pada mode MEMORY (AUTO) atau MDI.'); return; }

  feedHold() { if (this.state === 'run') { this.state = 'hold'; Bus.emit('event', 'hold'); Bus.emit('change'); } },

  /* ---------- tick ---------- */
  tick(dt) {

      else if (!this.alarms.length) this.runManual(dt);

  },
  goTo(x, z, cb) { this.gt = { x, z, cb }; },
  runManual(dt) {
    if (this.gt) {
      const sp = 5000 / 60 * dt; const dx = this.gt.x - this.m.x, dz = this.gt.z - this.m.z; const d = Math.hypot(dx / 2, dz);

      else { if (this.moveStep(this.m.x + dx / d * sp, this.m.z + dz / d * sp, false)) this.addTrace('rapid'); else this.gt = null; }
      Bus.emit('change'); return;

      const sp = (this.jog.rapid ? 4000 * this.rapidOvr / 100 : 800 * this.feedOvr / 100) / 60 * dt;
      const ax = this.jog.axis, dir = this.jog.dir;
      const nx = this.m.x + (ax === 'X' ? dir * sp * 2 : 0), nz = this.m.z + (ax === 'Z' ? dir * sp : 0);
      if (this.moveStep(nx, nz, !this.jog.rapid)) this.addTrace(this.jog.rapid ? 'rapid' : 'feed');
      if (Math.random() < 0.05) Bus.emit('change');
    }

      else { const nz = Math.min(0, this.m.z + sp); this.moveStep(this.m.x, nz, false); if (nz >= 0) { this.m.z = 0; this.ref.z = true; this.jog = null; Bus.emit('event', 'ref', 'Z'); Bus.emit('sfx', 'ok'); } }
      Bus.emit('change');
    }
    if (this.hnd !== 0) {
      const sp = 2400 / 60 * dt; const step = Math.sign(this.hnd) * Math.min(Math.abs(this.hnd), sp);
      const ax = this.axis; const nx = this.m.x + (ax === 'X' ? step : 0), nz = this.m.z + (ax === 'Z' ? step : 0);
      this.hnd -= step; if (Math.abs(this.hnd) < 1e-6) this.hnd = 0;
      if (this.moveStep(nx, nz, true)) this.addTrace('feed'); else this.hnd = 0;
      Bus.emit('change');
    }
  },
  handwheel(det) {
    if (this.mode !== 'HANDLE' || !this.ready()) return;
    const d = det * this.inc * (this.axis === 'X' ? 1 : 1); this.hnd += d; Bus.emit('event', 'handle', { axis: this.axis, det });
  },
  finishOp() {
    const op = this.ops[this.opi]; this.opi++;
    const nx = this.ops[this.opi];
    if (!nx) return;
    if (this.singleBlock && op.blk !== nx.blk && this.state === 'run') { this.state = 'sbwait'; Bus.emit('change'); }
  },
  runAuto(dt) {

      const op = this.ops[this.opi];

      if (op.k === 'move' || op.k === 'arc' || op.k === 'ref') {
        if (!op.rt) this.prepMove(op);
        if (this.state !== 'run') break;

        if (v <= 0) {
          if (op.k === 'move' && !op.rapid && this.feedMode === 99 && this.sp.rpm < 1) { this.alarm('PS0011', 'FEED ZERO – spindle belum berputar (G99 mm/putaran). Tambahkan M03 sebelum G01.'); break; }
          budget = 0; break; // waiting (spindle accelerating)
        }

        const adv = Math.min(remain, ds); op.rt.s += adv; budget -= adv / v;

      else if (op.k === 'tool') {
        if (op.t0 === undefined) { op.t0 = 0; this.turretTarget = (op.t - 1) * Math.PI / 4; Bus.emit('sfx', 'turret'); this.tool = op.t; this.off = op.o; Bus.emit('event', 'tool', op.t); if (!this.turret[op.t]) Bus.emit('msg', `Peringatan: Stasiun T${String(op.t).padStart(2, '0')} kosong (tidak ada pahat).`); }
        op.t0 += budget; if (op.t0 >= 0.9) { budget = op.t0 - 0.9; op.t0 = undefined; this.finishOp(); } else budget = 0;
      }

      else if (op.k === 'smax') { this.sp.max = op.max; this.finishOp(); }
      else if (op.k === 'sval') { this.sp.S = op.S; this.sp.css = op.css; this.finishOp(); }
      else if (op.k === 'coolant') { this.coolant = op.on; Bus.emit('event', 'coolant', op.on); this.finishOp(); }
      else if (op.k === 'feedmode') { this.feedMode = op.v; this.finishOp(); }
      else if (op.k === 'stop') { this.finishOp(); if (!op.opt || this.optStop) { this.state = 'optstop'; this.sp.target = 0; Bus.emit('msg', op.opt ? 'M01 Optional Stop – tekan CYCLE START untuk lanjut.' : 'M00 Program Stop – periksa benda kerja lalu tekan CYCLE START.'); Bus.emit('change'); } }

      else this.finishOp();

  },
  endProgram() { this.state = 'idle'; this.sp.dir = 0; this.coolant = false; this.opi = 0; this.curBlk = -1; Bus.emit('end'); Bus.emit('change'); },
  prepMove(op) {
    const o = this.O(); const from = { x: this.m.x - o.x, z: this.m.z - o.z };
    op.rt = { o, from, s: 0 };
    if (op.k === 'ref') {
      if (!op.legs) op.legs = []; op.stage = op.stage || 0;
      if (op.stage === 0) {
        const via = { x: op.via.x ?? from.x, z: op.via.z ?? from.z };
        op.legs = [via, { x: op.axes.x ? -o.x : via.x, z: op.axes.z ? -o.z : via.z }];
      }

    }
    if (op.k === 'arc') {
      const a = { z: from.z, r: from.x / 2 }, b = { z: op.to.z, r: op.to.x / 2 };

        if (d < 1e-6 || Math.abs(op.R) < d / 2 - 1e-3) { this.alarm('PS0022', 'R/I/K TIDAK SESUAI – radius terlalu kecil'); return; }
        const hh = Math.sqrt(Math.max(0, op.R * op.R - d * d / 4)); let pz = dr / d, pr = -dz / d; // right of chord
        const s = (op.cw ? 1 : -1) * (op.R > 0 ? 1 : -1);

      } else c = { z: a.z + (op.K || 0), r: a.r + (op.I || 0) };
      const a0 = Math.atan2(a.r - c.r, a.z - c.z); let a1 = Math.atan2(b.r - c.r, b.z - c.z);
      const R = Math.hypot(a.r - c.r, a.z - c.z);

  },
  pathPoint(op, t) {
    const f = op.rt.from;
    if (op.k === 'arc') { const A = op.rt.arc; const a = A.a0 + A.sweep * t; return { z: A.c.z + A.R * Math.cos(a), x: 2 * (A.c.r + A.R * Math.sin(a)) }; }

  },
  moveSpeed(op) {
    if (op.rapid) return 10000 * this.rapidOvr / 100 / 60;
    if (this.dryRun) return 3000 * this.feedOvr / 100 / 60;
    let f = op.f || 0;
    if ((op.fm || 99) === 99) f = f * this.sp.rpm; // mm/min
    if (this.sp.rpm < 5 && (op.fm || 99) === 99) return 0;
    return f * this.feedOvr / 100 / 60;
  },
};

/* ---------- PARSER ---------- */

/* ---------- MAIN LOOP & INIT ---------- */
let lastT = performance.now(), panelT = 0;
function mainLoop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  try {
    CNC.tick(dt);
    const op = CNC.ops[CNC.opi]; const servo = CNC.state === 'run' && op && (op.k === 'move' || op.k === 'arc' || op.k === 'ref') ? (op.rapid ? 1 : 0.35) : (CNC.jog || CNC.hnd || CNC.gt ? 0.6 : 0);
    AudioX.machine({ rpm: CNC.power ? CNC.sp.rpm : 0, cut: CNC.cutRate, coolant: CNC.coolant && CNC.power, servo });
    if (t - panelT > 66) { panelT = t; updatePanel(); }
    const P = App.pages[App.cur]; if (P && $('#app').classList.contains('show')) { P.tick && P.tick(dt); if (App.cur === 'materi') { const S = P.subs?.[P.curSub]; S && S.tick && S.tick(dt); } }
  } catch (e) { console.error(e); }
  requestAnimationFrame(mainLoop);
}
function initApp() {
  Store.load(); MAT.init(); MAT.load(30, 60, 50, 'Aluminium 6061', 0); CNC.setCorrectOffsets();
  fitStage(); addEventListener('resize', fitStage);
  buildSplash(); buildShell(); $('#screen-splash').classList.add('show');
  Bus.on('alarm', (code, msg, crash) => { const b = $('#alarmBar'); b.innerHTML = `<span style="font-size:22px">🚨</span><span>ALARM ${code}</span><span style="font-weight:500">${msg}</span><button class="btn sm" onclick="CNC.reset()">RESET</button>`; b.classList.add('show'); AudioX.alarm(true); if (crash) { AudioX.sfx('crash'); const s = $('#stage'); s.style.setProperty('--s', STAGE_SCALE); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); Narr.say('Awas! Terjadi tabrakan! Mesin berhenti otomatis. Periksa program atau posisi pahat, lalu tekan RESET.'); } Store.mistake(`${code} ${msg}`); });
  Bus.on('change', () => { if (!CNC.alarms.length) $('#alarmBar').classList.remove('show'); });
  Bus.on('reset', () => { $('#alarmBar').classList.remove('show'); AudioX.alarm(false); });
  Bus.on('msg', m => toast(m, 'warn')); Bus.on('sfx', n => AudioX.sfx(n));
  $('#narr .av').addEventListener('click', () => { const n = $('#narr'); n.classList.toggle('min'); });
  $('#narrReplay').addEventListener('click', () => Narr.say(Narr.cur)); $('#narrMin').addEventListener('click', () => { $('#narr').classList.add('min'); Narr.stop(); });
  document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return; if (e.key === 'Escape') closeModal(); });
  // load 3D library
  let p = 10; const li = $('#loadI'), lt = $('#loadT'); const tm = setInterval(() => { p = Math.min(92, p + 6); li.style.width = p + '%'; }, 120);
  const done = ok => { clearInterval(tm); li.style.width = '100%'; if (ok) M3D.init(); lt.textContent = M3D.ok ? 'Laboratorium 3D siap!' : 'Mode 2D (Three.js tidak dapat dimuat – periksa koneksi internet).'; $('#enterBtn').style.visibility = 'visible'; };
  loadThree(done);
  requestAnimationFrame(mainLoop);
}
function loadThree(cb) {
  if (window.THREE) return cb(true);
  const srcs = ['https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js', 'https://unpkg.com/three@0.149.0/build/three.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'];
  let i = 0; const next = () => { if (i >= srcs.length) return cb(false); const s = document.createElement('script'); s.src = srcs[i++]; s.onload = () => cb(!!window.THREE); s.onerror = next; document.head.append(s); };
  const to = setTimeout(() => { if (!window.THREE) { i = srcs.length; cb(false); } }, 15000); next(); const orig = cb; cb = ok => { clearTimeout(to); orig(ok); cb = () => { }; };
}
window.addEventListener('load', initApp);
