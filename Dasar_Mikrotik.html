  <h3 style="margin:16px 0 6px;color:var(--navy)">Rincian Lab</h3><div style="font-size:13.5px">${LAB_ORDER.concat(["ch1", "ch2"]).map(id => { const st = P.missions[id] || {}; return `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #E1E8F4"><span>${esc(M[id].level)}</span><b style="color:${st.done ? "var(--ok)" : "#9AA3B2"}">${st.score ?? "○"}</b></div>`; }).join("")}</div>
  <div class="row" style="margin-top:16px"><button class="btn btn-gold btn-sm" id="toCert">🏆 Sertifikat</button><button class="btn btn-blue btn-sm" id="toRef">✎ Refleksi</button></div></div></div></div>`;
  const sv = () => { P.name = $("#stName").value.trim(); P.school = $("#stSch").value.trim(); saveP(); };
  $("#stName").onchange = sv; $("#stSch").onchange = sv;
  $("#toCert").onclick = () => { sv(); if (!s.complete) { Audio.sfx("err"); toast("Selesaikan Evaluasi Teori, Evaluasi Praktik, dan Lab 06 dahulu.", "warn"); return; } if (s.fin < 70) { Audio.sfx("err"); toast("Sertifikat membutuhkan Final Score minimal 70. Ulangi lab atau evaluasi.", "warn"); return; } if (!P.name) { toast("Isi nama terlebih dahulu.", "warn"); $("#stName").focus(); return; } go("cert"); };
  $("#toRef").onclick = () => { sv(); go("reflect"); };
  Narr.say(s.complete ? `Nilai akhirmu ${s.fin}, dengan badge ${lv}.` : "Ini rangkuman hasil belajarmu. Lengkapi evaluasi teori, praktik, dan lab troubleshooting untuk mendapatkan nilai akhir.", s.fin >= 80 ? "hore" : "jelas");
}
function renderCert() {
  const v = $("#v-cert"); const s = finalScores(); const d = new Date().toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
  v.innerHTML = bg("bgstudio") + `<div class="wrap"><div class="cert"><div class="cs">Media Pembelajaran Interaktif · TKJ</div><div class="ct">CERTIFICATE OF COMPLETION</div><div style="font-weight:800;letter-spacing:2px;color:#1F5FE0">DASAR-DASAR JARINGAN DENGAN MIKROTIK</div><p style="margin:18px 0 0">Diberikan kepada:</p><div class="nm">${esc(P.name)}</div><p style="max-width:56ch;margin:0 auto;line-height:1.6">Telah menyelesaikan pembelajaran <b>Dasar Konfigurasi MikroTik melalui Virtual WinBox</b>, meliputi interface, IP address, DHCP, DNS, routing, NAT, firewall, wireless, dan troubleshooting.</p><div style="display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-top:16px;font-weight:800"><span>Score: <span style="color:#1F5FE0">${s.fin}</span></span><span>Badge: <span style="color:#1F5FE0">${levelOf(s.fin)}</span></span></div>
  <div class="sig"><div><div style="height:46px"></div><div class="ln">${esc(P.school)}<br><small style="font-weight:500">${d}</small></div></div><svg class="seal" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#0F2A6E"/><circle cx="50" cy="50" r="38" fill="none" stroke="#C9A227" stroke-width="2" stroke-dasharray="3 3"/><path d="M50 22l7 14 15 2-11 10 3 15-14-7-14 7 3-15-11-10 15-2z" fill="#C9A227"/><text x="50" y="80" text-anchor="middle" font-size="9" fill="#fff" font-weight="800" letter-spacing="1">MTCNA LAB</text></svg><div><img src="${IMG.setuju}" alt="" style="height:64px;display:block;margin:-18px auto 0"><div class="ln">Pak Yarli<br><small style="font-weight:500">Pembimbing Belajar MTCNA</small></div></div></div></div>
  <p class="lead" style="text-align:center;margin:16px auto 0">Simpan sertifikat dengan tangkapan layar (screenshot).</p><div class="row" style="justify-content:center"><button class="btn btn-ghost btn-sm" id="cBack">← Hasil Belajar</button><button class="btn btn-blue btn-sm" id="cRef">Isi Refleksi ›</button></div></div>`;
  $("#cBack").onclick = () => go("result"); $("#cRef").onclick = () => go("reflect"); Audio.sfx("win");
  Narr.say(`Selamat, ${P.name}! Kamu telah menyelesaikan Dasar-Dasar Jaringan dengan MikroTik. Terus berlatih, sampai jumpa di materi berikutnya.`, "tutup");
}
function renderReflect() {
  const Q = ["Bagian konfigurasi apa yang paling mudah?", "Bagian apa yang paling sulit?", "Kesalahan konfigurasi apa yang paling sering terjadi?", "Bagaimana cara menemukan kesalahan tersebut?", "Apa fungsi NAT?", "Mengapa DHCP diperlukan?"];
  const v = $("#v-reflect");
  v.innerHTML = bg("bglab") + `<div class="wrap"><div class="eyebrow">Scene 40 · Refleksi</div><h1 class="title">Refleksi Belajar</h1><div class="glass" style="padding:20px"><div class="refGrid">${Q.map((q, i) => `<div class="fld"><label for="rf${i}">${i + 1}. ${q}</label><textarea class="inp" id="rf${i}">${esc(P.reflection[i] || "")}</textarea></div>`).join("")}</div><div class="row" style="justify-content:flex-end"><button class="btn btn-gold btn-sm" id="rfSave">Simpan Refleksi</button></div></div></div>`;
  $("#rfSave").onclick = () => { Q.forEach((_, i) => P.reflection[i] = $("#rf" + i).value); saveP(); Audio.sfx("ok"); toast("Refleksi tersimpan.", "ok"); Narr.say("Terima kasih sudah menulis refleksi. Refleksi membantumu mengingat pelajaran lebih lama.", "tutup"); };
  Narr.say("Tuliskan refleksimu dengan jujur. Tidak ada jawaban salah di bagian ini.", "senyum");
}
const RENDER = { home: renderHome, guide: renderGuide, map: renderMap, materi: renderMateri, labs: renderLabs, challenge: renderChallenge, eval: renderEval, result: renderResult, cert: renderCert, reflect: renderReflect };

/* ================= SETTINGS / TEACHER MODE (sec. 60) ================= */
async function openSettings() {
  const c = caseCfg();
  const html = `<div class="mhead"><img src="${IMG.arahan}" alt=""><h3>Pengaturan &amp; Mode Guru</h3></div><div class="mbody">
  <div class="setRow"><span><b>Backsound</b><br><small>Musik latar ambient</small></span><span class="row"><input type="checkbox" id="sMu" ${SET.music ? "checked" : ""}><input type="range" id="sMv" min="0" max="1" step="0.05" value="${SET.musicVol}" aria-label="Volume musik"></span></div>
  <div class="setRow"><span><b>Narasi suara Pak Yarli</b><br><small>${"speechSynthesis" in window ? "Text-to-speech Bahasa Indonesia dari browser" : "Browser tidak mendukung suara; teks tetap tampil"}</small></span><span class="row"><input type="checkbox" id="sVo" ${SET.voice ? "checked" : ""}><input type="range" id="sVr" min="0.7" max="1.3" step="0.05" value="${SET.voiceRate}" aria-label="Kecepatan narasi"></span></div>
  <div class="setRow"><span><b>Suara narator</b><br><small>Aktif: ${esc(Narr.current())}</small></span><select class="inp" id="sVn" style="width:220px;padding:7px"><option value="">Otomatis (utamakan laki-laki)</option>${Narr.voices().map(v => `<option ${v.name === SET.voiceName ? "selected" : ""}>${esc(v.name)}</option>`).join("")}</select></div>
  <div class="setRow"><span><b>Berat suara</b><br><small>Geser ke kiri agar lebih berat / laki-laki</small></span><span class="row"><input type="range" id="sVp" min="0.3" max="1.3" step="0.05" value="${SET.voicePitch ?? 0.6}" aria-label="Nada suara"><button class="btn btn-ghost btn-sm" style="color:#1C3A86;border-color:#BFD0EE" id="sVpA">Otomatis</button></span></div>
  <h3 style="margin:16px 0 4px;color:var(--navy)">Teacher Mode</h3>
  <div class="setRow"><span><b>Buka semua materi &amp; lab</b><br><small>Untuk demonstrasi di kelas</small></span><input type="checkbox" id="sUn" ${SET.unlockAll ? "checked" : ""}></div>
  <div class="setRow"><span><b>Hint aktif</b><br><small>Matikan untuk ujian</small></span><input type="checkbox" id="sHi" ${SET.hints ? "checked" : ""}></div>
  <div class="setRow"><span><b>Waktu challenge</b><br><small>menit</small></span><input type="number" class="inp" id="sTm" min="5" max="90" value="${SET.challengeMin}" style="width:90px"></div>
  <div style="padding:10px 0;border-bottom:1px solid #E6ECF6"><b>Create Case · Challenge Level 1</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px"><input class="inp" id="sLan" value="${esc(c.lan)}" aria-label="LAN" placeholder="192.168.50.1/24"><input class="inp" id="sPool" value="${esc(c.pool)}" aria-label="Pool" placeholder="192.168.50.10-192.168.50.100"></div><small>Target LAN dan pool DHCP untuk Challenge Level 1.</small></div>
  <div class="setRow"><span><b>Reset semua progress</b><br><small>Nilai, materi, refleksi di perangkat ini</small></span><button class="btn btn-ghost btn-sm" style="color:#A51E1E;border-color:#F09A9A" data-r="reset">Reset</button></div>
  <p id="sErr" class="fb bad"></p></div><div class="mfoot"><button class="btn btn-blue btn-sm" data-r="save">Simpan</button></div>`;
  const m = modal(html);
  $("#sMu").onchange = e => { SET.music = e.target.checked; Audio.startMusic(); Audio.setMusicGain(); saveS(); };
  $("#sMv").oninput = e => { SET.musicVol = +e.target.value; Audio.setMusicGain(); saveS(); };
  $("#sVo").onchange = e => { SET.voice = e.target.checked; saveS(); if (!SET.voice) Narr.stop(); else Narr.say("Narasi suara aktif.", "senyum"); };
  $("#sVn").onchange = e => { SET.voiceName = e.target.value; saveS(); Narr.repick(); Narr.say("Halo, saya Pak Yarli. Begini suara saya sekarang.", "senyum"); };
  $("#sVp").onchange = e => { SET.voicePitch = +e.target.value; saveS(); Narr.say("Halo, saya Pak Yarli. Begini suara saya sekarang.", "senyum"); };
  $("#sVpA").onclick = () => { SET.voicePitch = null; saveS(); Narr.say("Nada suara kembali otomatis.", "senyum"); };
  $("#sVr").onchange = e => { SET.voiceRate = +e.target.value; saveS(); Narr.say("Kecepatan narasi seperti ini.", "senyum"); };
  const r = await m;
  if (r === "reset") { if (await confirmBox("Reset progress", "Semua nilai, materi selesai, konfigurasi tersimpan, dan refleksi di perangkat ini akan dihapus.", "Hapus", "Batal", "kaget")) { Store.keys("").forEach(k => Store.del(k)); location.reload(); } return; }
  if (r === "save") {
    SET.unlockAll = $("#sUn").checked; SET.hints = $("#sHi").checked; SET.challengeMin = clamp(+$("#sTm").value || 20, 5, 90);
    const lan = $("#sLan").value.trim(), pool = $("#sPool").value.trim(); const lc = parseCidr(lan), rg = parseRange(pool);
    if (lc && lan.includes("/") && rg && inNet(rg.a, lc.net, lc.p) && inNet(rg.b, lc.net, lc.p)) SET.customCase = (lan === "192.168.50.1/24" && pool === "192.168.50.10-192.168.50.100") ? null : { lan: lc.str, pool: pool.replace(/\s/g, "") };
    else toast("Case tidak disimpan: pool harus berada di dalam subnet LAN.", "bad");
    saveS(); toast("Pengaturan disimpan.", "ok"); if (RENDER[CUR]) RENDER[CUR]();
  }
}

/* ================= SPLASH (scene 01) & boot ================= */
function splash() {
  const ports = $("#spPorts"); ports.innerHTML = [0, 1, 2, 3, 4].map(i => { const x = 120 + i * 52; return `<rect x="${x}" y="66" width="40" height="34" rx="3" fill="#DDE2E9" stroke="#9AA3B2"/><rect x="${x + 5}" y="71" width="30" height="22" fill="#15181D"/><circle cx="${x + 8}" cy="110" r="3" fill="#3A404B" class="spl"/><circle cx="${x + 32}" cy="110" r="3" fill="#3A404B" class="spl2"/><text x="${x + 20}" y="124" font-size="7.5" fill="#5A6170" text-anchor="middle" font-family="Segoe UI,Arial">ether${i + 1}</text>`; }).join("");
  const cv = $("#spCanvas"), cx = cv.getContext("2d"); let W, H; W = cv.width = 1600; H = cv.height = 900;
  const lines = Array.from({ length: 26 }, () => ({ y: Math.random(), s: .2 + Math.random() * .8, o: Math.random(), dir: Math.random() < .5 ? 1 : -1 }));
  let alive = true; const draw = t => { if (!alive) return; cx.clearRect(0, 0, W, H); lines.forEach(l => { const y = l.y * H; cx.strokeStyle = "rgba(60,194,255,.07)"; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke(); const x = ((t * .00012 * l.s + l.o) % 1) * W; const px = l.dir > 0 ? x : W - x; const g = cx.createLinearGradient(px - 120 * l.dir, 0, px, 0); g.addColorStop(0, "rgba(60,194,255,0)"); g.addColorStop(1, "rgba(125,240,255,.75)"); cx.strokeStyle = g; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(px - 120 * l.dir, y); cx.lineTo(px, y); cx.stroke(); }); requestAnimationFrame(draw); }; requestAnimationFrame(draw);
  const stats = ["Booting RouterOS simulation engine…", "Loading Virtual WinBox UI…", "Initializing topology engine…", "Loading validation & scoring engine…", "Preparing Pak Yarli…", "Ready."];
  let p = 0; const bar = $("#spBar"); const it = setInterval(() => {
    p = Math.min(100, p + 2 + Math.random() * 5); bar.style.width = p + "%"; $("#spStat").textContent = stats[Math.min(stats.length - 1, Math.floor(p / 20))] + "  " + Math.floor(p) + "%";
    $$(".spl").forEach((c, i) => { if (p > 10 + i * 15) c.setAttribute("fill", Math.random() > .3 ? "#2BD45E" : "#1E7A3A"); }); $$(".spl2").forEach((c, i) => { if (p > 30 + i * 12) c.setAttribute("fill", Math.random() > .5 ? "#F2B705" : "#7A5C00"); });
    if (p >= 100) { clearInterval(it); $("#spGo").hidden = false; $("#spHint").hidden = false; $("#spGo").focus(); setInterval(() => { $$(".spl").forEach(c => c.setAttribute("fill", Math.random() > .3 ? "#2BD45E" : "#1E7A3A")); }, 180); }
  }, 70);
  $("#spGo").onclick = () => { Audio.unlock(); try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} Audio.sfx("boot"); setTimeout(() => Audio.startMusic(), 1200); alive = false; const s = $("#splash"); s.style.transition = "opacity .6s"; s.style.opacity = 0; setTimeout(() => s.remove(), 650); go("home"); };
}
function initUI() {
  $$("[data-go]", $("#topbar")).forEach(b => b.onclick = () => { Audio.sfx("click"); go(b.dataset.go); });
  $("#menuBtn").onclick = () => $("#nav").classList.toggle("open");
  const mb = $("#btnMusic"), vb = $("#btnVoice");
  const sync = () => { mb.classList.toggle("off", !SET.music); vb.classList.toggle("off", !SET.voice); };
  mb.onclick = () => { SET.music = !SET.music; saveS(); Audio.startMusic(); Audio.setMusicGain(); sync(); toast(SET.music ? "Backsound aktif" : "Backsound mati"); };
  vb.onclick = () => { SET.voice = !SET.voice; saveS(); if (!SET.voice) Narr.stop(); sync(); toast(SET.voice ? "Narasi suara aktif" : "Narasi suara mati (teks tetap tampil)"); };
  $("#btnSet").onclick = openSettings; sync();
  $("#btnFS").onclick = toggleFS;
  $("#nReplay").onclick = () => Narr.replay(); $("#nStop").onclick = () => Narr.stop(); $("#nHide").onclick = () => Narr.mini(); $("#narrImg").onclick = () => Narr.mini();
  $("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#modal").hidden) closeModal(); });
  setInterval(() => { if (CUR === "lab" && L.r) { renderStatus(); L.wins.filter(w => ["interfaces", "torch", "resources"].includes(w.kind)).forEach(w => { const el = document.getElementById(w.id); if (el && !el.contains(document.activeElement)) { const st = el.querySelector(".wbody").scrollTop; drawWin(w); document.getElementById(w.id).querySelector(".wbody").scrollTop = st; focusWinZ(w); } }); } }, 2000);
}
addEventListener("resize", () => { const d = $("#wbDesk"); if (!d || CUR !== "lab") return; const dw = d.clientWidth; L.wins.forEach(w => { const nw = Math.min(w.w, dw - 4); if (nw !== w.w || w.x + nw > dw) { w.w = nw; w.x = clamp(w.x, 0, Math.max(0, dw - nw - 2)); const el = document.getElementById(w.id); if (el) { el.style.width = w.w + "px"; el.style.left = w.x + "px"; } } }); });
function toggleFS() { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => toast("Layar penuh tidak diizinkan di tampilan ini. Tekan F11.", "warn")); } catch (e) { toast("Tekan F11 untuk layar penuh.", "warn"); } }
function fitStage() { const st = $("#screen"); SCALE = Math.min(innerWidth / 1600, innerHeight / 900); st.style.transform = `scale(${SCALE})`; st.style.left = Math.max(0, (innerWidth - 1600 * SCALE) / 2) + "px"; st.style.top = Math.max(0, (innerHeight - 900 * SCALE) / 2) + "px"; }
addEventListener("resize", fitStage); fitStage();
Face.attach($("#narrCv"));
initUI(); splash();


</script>
