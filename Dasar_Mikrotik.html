<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dasar-Dasar Jaringan dengan MikroTik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: navy network-lab shell (top bar + scene view) over blurred lab photography; WinBox simulator uses its own light-grey desktop-app skin. Single committed look. */
:root{
  --ink:#0A1838; --navy:#0F2A6E; --navy2:#16378C; --blue:#1F5FE0; --cyan:#3CC2FF; --gold:#FFC419; --gold2:#FF9F0A;
  --paper:#F4F7FC; --card:#FFFFFF; --line:#D6DFEE; --mute:#5E6E8F; --text:#13213F;
  --ok:#17A34A; --bad:#DC2F2F; --warn:#E8A10C; --off:#9AA3B2;
  --wb-bg:#E9EAEC; --wb-face:#F3F3F4; --wb-white:#FFFFFF; --wb-line:#C4C8CE; --wb-line2:#E2E4E8; --wb-text:#111; --wb-sel:#2B67D6; --wb-t1:#4C66DA; --wb-t2:#2F43B0; --wb-stripe:#2A3FA6;
  --f-disp:"Exo 2","Trebuchet MS",sans-serif; --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif; --f-ui:"Segoe UI",Tahoma,Verdana,Arial,sans-serif; --f-mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
*{box-sizing:border-box}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
#topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,#0E2668,#0A1C52);border-bottom:1px solid #2A4AA8;box-shadow:0 4px 18px rgba(0,0,0,.35)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#0E2668}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;background:none;border:0;padding:0}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-disp);font-style:italic;font-weight:800;font-size:17px;letter-spacing:.2px;line-height:1}
.brand small{display:block;font-size:10.5px;color:#9FC2FF;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-top:3px}
#nav{display:flex;gap:4px;margin-left:12px;flex-wrap:wrap}
#nav button{background:transparent;border:1px solid transparent;color:#C9D8FF;padding:7px 11px;border-radius:8px;font-weight:600;font-size:13.5px}
#nav button:hover{background:rgba(255,255,255,.08);color:#fff}
#nav button.on{background:rgba(60,194,255,.16);border-color:rgba(60,194,255,.45);color:#fff}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icob{width:36px;height:36px;border-radius:9px;border:1px solid #2E4FA9;background:#132F7A;color:#DCE7FF;display:grid;place-items:center;padding:0}
.icob svg{width:18px;height:18px}
.icob.off{opacity:.5}
.icob:hover{background:#1A3C93}
#menuBtn{display:none}
@media (max-width:1px) and (max-width:1060px){#nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:#0B1F5C;padding:10px 16px;border-bottom:1px solid #2A4AA8}#nav.open{display:flex}#menuBtn{display:grid}#nav button{text-align:left;font-size:15px;padding:10px 12px}}
@media (max-width:1px) and (max-width:480px){.brand small{display:none}.brand b{font-size:15px}}

/* ---------- views ---------- */
main{min-height:calc(100% - 56px)}
.view{display:none;min-height:calc(100vh - 56px);position:relative}
.view.on{display:block;animation:fadein .35s ease}
@keyframes fadein{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.labbg{position:absolute;inset:0;overflow:hidden;z-index:0}
.labbg::before{content:"";position:absolute;inset:-30px;background:var(--bgimg) center/cover no-repeat;filter:blur(6px) saturate(1.1);transform:scale(1.04)}
.labbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,24,64,.78),rgba(9,24,64,.9) 60%,rgba(7,18,48,.97))}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding-block:28px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--cyan)}
h1.title,h2.title{font-family:var(--f-disp);font-style:italic;font-weight:800;color:#fff;margin:.2em 0 .3em;text-wrap:balance;line-height:1.05}
h1.title{font-size:clamp(28px,4.2vw,46px)}
h2.title{font-size:clamp(24px,3.2vw,36px)}
.lead{color:#C8D6F5;max-width:68ch;line-height:1.6;margin:0 0 18px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;border:0;padding:12px 20px;font-weight:800;font-size:15px;letter-spacing:.2px;transition:transform .12s, box-shadow .12s}
.btn:active{transform:translateY(1px)}
.btn-gold{background:linear-gradient(180deg,#FFD84A,#FFB800);color:#0F1E4A;box-shadow:0 6px 0 #C98600,0 10px 24px rgba(255,190,0,.35)}
.btn-gold:hover{box-shadow:0 6px 0 #C98600,0 12px 30px rgba(255,190,0,.5)}
.btn-blue{background:linear-gradient(180deg,#2F78FF,#1A50C8);color:#fff;box-shadow:0 5px 0 #0F3389}
.btn-ghost{background:rgba(255,255,255,.08);color:#E2EBFF;border:1px solid rgba(255,255,255,.25)}
.btn-ghost:hover{background:rgba(255,255,255,.14)}
.btn-sm{padding:8px 13px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.glass{background:rgba(255,255,255,.96);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,10,.35);color:var(--text)}

/* ---------- splash (scene 01) ---------- */
#splash{position:fixed;inset:0;z-index:200;background:radial-gradient(120% 90% at 50% 10%,#173A93 0%,#0A1A4A 55%,#050D26 100%);display:grid;place-items:center;overflow:hidden;color:#fff}
#splash canvas{position:absolute;inset:0;width:100%;height:100%}
.sp-inner{position:relative;text-align:center;padding:24px;width:min(1100px,100%)}
.sp-router{width:min(440px,86vw);margin:0 auto 18px;filter:drop-shadow(0 22px 30px rgba(0,0,0,.55))}
.sp-title{font-family:var(--f-disp);font-style:italic;font-weight:900;font-size:64px;letter-spacing:.5px;line-height:1.05;white-space:nowrap;margin:0;background:linear-gradient(180deg,#fff 30%,#9CD7FF);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.sp-title .sp-t2{font-size:.62em;letter-spacing:3px}
.sp-sub{color:#B8CCF5;margin:12px 0 26px;font-size:clamp(14px,2vw,17px)}
.sp-bar{height:10px;border-radius:10px;background:rgba(255,255,255,.12);overflow:hidden;width:min(460px,90%);margin:0 auto;border:1px solid rgba(255,255,255,.18)}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#7DF0FF);box-shadow:0 0 18px var(--cyan)}
.sp-stat{font-family:var(--f-mono);font-size:12.5px;color:#8FB2E8;margin-top:10px;min-height:1.4em}
#spGo{margin-top:22px}
.sp-hint{font-size:12px;color:#7F98C7;margin-top:14px}

/* ---------- home (scene 02) ---------- */
.homeStage{position:relative;width:100%;max-width:1400px;margin:0 auto;aspect-ratio:1672/941;max-height:calc(100vh - 56px);background:#0A1838}
.homeStage img{width:100%;height:100%;object-fit:contain;display:block}
.hotspot{position:absolute;border-radius:60px;background:transparent;border:0;cursor:pointer}
.hotspot:hover,.hotspot:focus-visible{box-shadow:0 0 0 4px rgba(255,255,255,.7),0 0 40px rgba(255,210,0,.8)}
.homeDock{position:relative;z-index:2;max-width:1400px;margin:0 auto;padding-block:16px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.hcard{background:linear-gradient(180deg,#14347F,#0E2563);border:1px solid #2B4FB0;border-radius:14px;padding:16px;color:#fff;text-align:left;display:flex;gap:12px;align-items:flex-start}
.hcard:hover{border-color:var(--cyan);background:linear-gradient(180deg,#1A3E95,#112B70)}
.hcard .ic{width:42px;height:42px;border-radius:11px;background:linear-gradient(180deg,#2F7BFF,#1748C2);display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.hcard .ic svg{width:24px;height:24px}
.hcard b{display:block;font-size:15px}
.hcard span{font-size:13px;color:#AFC4F0;line-height:1.45}

/* ---------- narrator dock ---------- */
#narr{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:120;display:flex;align-items:flex-end;gap:0;max-width:min(640px,calc(100vw - 24px));pointer-events:none}
#narr.hide{display:none}
#narrImg{width:118px;height:150px;object-fit:contain;object-position:bottom;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));pointer-events:auto;cursor:pointer;flex:none;transition:transform .25s}
#narr.talk #narrImg{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.bubble{pointer-events:auto;background:#fff;border-radius:16px 16px 16px 4px;padding:12px 14px 10px;box-shadow:0 14px 40px rgba(0,0,0,.4);margin-bottom:26px;border:2px solid #CFE0FF;position:relative;min-width:200px}
.bubble .who{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:6px}
.bubble .who .eq{display:inline-flex;gap:2px;align-items:flex-end;height:10px}
.bubble .who .eq i{width:3px;background:var(--blue);border-radius:2px;height:3px}
#narr.talk .eq i{animation:eq .6s ease-in-out infinite}
#narr.talk .eq i:nth-child(2){animation-delay:.15s}#narr.talk .eq i:nth-child(3){animation-delay:.3s}
@keyframes eq{50%{height:10px}}
#narrText{font-size:14.5px;line-height:1.5;color:#13213F;margin:4px 0 8px;max-height:9em;overflow:auto}
.bubble .ctl{display:flex;gap:6px}
.bubble .ctl button{border:1px solid #CFDBF0;background:#F2F6FD;color:#1C3A86;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700}
#narr.mini .bubble{display:none}
#narr.noav #narrImg{display:none}
#narr.mini #narrImg{width:70px;height:88px}
@media (max-width:1px) and (max-width:600px){#narrImg{width:78px;height:100px}#narrText{font-size:13.5px;max-height:6.5em}.bubble{margin-bottom:12px}}

/* ---------- guide, map ---------- */
.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 26px}
.flow .st{background:linear-gradient(180deg,#1C4BC7,#123590);color:#fff;border:1px solid #3C6BEA;padding:12px 16px;border-radius:12px;font-weight:800;letter-spacing:.5px;font-size:14px;position:relative}
.flow .st.lit{background:linear-gradient(180deg,#FFD84A,#FFB800);color:#0F1E4A;border-color:#FFE27A;box-shadow:0 0 24px rgba(255,196,25,.5)}
.flow .arr{color:#6FA8FF;font-weight:900}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.steps li{list-style:none;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px 14px 14px 52px;color:#E2EAFF;position:relative;line-height:1.45}
.steps li::before{content:attr(data-n);position:absolute;left:14px;top:13px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#0F1E4A;font-weight:900;display:grid;place-items:center;font-size:13px}
.steps{padding:0;margin:0}
.layoutDemo{display:grid;grid-template-columns:150px 1fr 200px;gap:8px;margin-top:22px;max-width:760px}
.layoutDemo div{border:1px dashed #6E8FDB;border-radius:10px;padding:14px 10px;color:#CFE0FF;font-size:13px;text-align:center;background:rgba(255,255,255,.04)}
@media (max-width:1px) and (max-width:600px){.layoutDemo{grid-template-columns:1fr}}

.road{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:18px}
.node{position:relative;text-align:left;border-radius:16px;padding:16px;background:linear-gradient(180deg,#163A91,#0F296D);border:1px solid #2F57BF;color:#fff;min-height:120px;display:flex;flex-direction:column;gap:6px}
.node:hover:not(.lock){border-color:var(--cyan);transform:translateY(-2px)}
.node .num{font-family:var(--f-disp);font-style:italic;font-weight:900;font-size:30px;color:rgba(255,255,255,.18);position:absolute;right:12px;top:6px}
.node .nic{width:40px;height:40px;border-radius:11px;background:#fff;display:grid;place-items:center}
.node .nic svg{width:24px;height:24px}
.node b{font-size:15.5px}
.node small{color:#A9BFF0;font-size:12.5px;line-height:1.4}
.node .tag{margin-top:auto;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.node.done .tag{color:#5BE38A}
.node.lock{opacity:.55;cursor:not-allowed;filter:saturate(.4)}
.node.lock .tag{color:#9AA8C7}
.node.cur{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,196,25,.35)}
.node.cur .tag{color:var(--gold)}
.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:30px}
.sectionHead h3{color:#fff;font-family:var(--f-disp);font-style:italic;font-weight:800;font-size:22px;margin:0}

/* ---------- materi ---------- */
.mGrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;margin-top:10px}
@media (max-width:1px) and (max-width:900px){.mGrid{grid-template-columns:1fr}}
@media (min-width:901px){.mStage{min-height:380px}}
.mStage{background:#fff;border-radius:18px;padding:18px;box-shadow:0 18px 50px rgba(0,0,10,.35);position:relative;overflow:hidden}
.mText{background:rgba(255,255,255,.97);border-radius:18px;padding:20px 22px;box-shadow:0 18px 50px rgba(0,0,10,.35);color:var(--text);line-height:1.62}
.mText h3{margin:0 0 6px;font-size:20px;color:var(--navy)}
.mText p{margin:0 0 10px}
.mText ul{margin:0 0 10px;padding-left:20px}
.mText li{margin:3px 0}
.mText code,.kbd{font-family:var(--f-mono);font-size:.88em;background:#EEF3FC;border:1px solid #D5E0F3;padding:1px 6px;border-radius:6px;color:#18357F}
.pager{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.dots{display:flex;gap:6px;margin-right:auto}
.dots i{width:9px;height:9px;border-radius:50%;background:#CCD7EA}
.dots i.on{background:var(--blue);width:22px;border-radius:6px}
.note{border-left:4px solid var(--gold);background:#FFF8E1;padding:10px 12px;border-radius:0 10px 10px 0;font-size:14px;margin:10px 0}
.tip{position:absolute;z-index:5;background:#0F2A6E;color:#fff;font-size:13px;line-height:1.45;padding:10px 12px;border-radius:10px;max-width:260px;box-shadow:0 10px 30px rgba(0,0,0,.35);pointer-events:none}
.tip b{color:var(--gold)}
.actBox{margin-top:12px;border:1px dashed #9FB6E3;border-radius:12px;padding:12px;background:#F6F9FF}
.actBox .q{font-weight:700;color:var(--navy);margin-bottom:8px}
.fb{font-size:14px;font-weight:600;margin-top:8px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #BFD0EE;background:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:13.5px;color:#1B3779}
.chip.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip.good{background:#E6F7EC;border-color:#7ED39A;color:#11733A}
.chip.wrong{background:#FDECEC;border-color:#F09A9A;color:#A51E1E}
.matchRow{display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:center;margin:6px 0}
.matchRow select{padding:7px;border-radius:8px;border:1px solid #BFD0EE;font:inherit;font-size:13.5px;min-width:0;width:100%}
.diagram svg{width:100%;height:auto;display:block}

/* ---------- lab hub ---------- */
.labGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:14px}
.lcard{background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 30px rgba(0,0,0,.3);color:var(--text);text-align:left;border:2px solid transparent}
.lcard:hover{border-color:var(--cyan)}
.lcard .lv{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--blue)}
.lcard h4{margin:0;font-size:17px;color:var(--navy)}
.lcard p{margin:0;font-size:13.5px;color:var(--mute);line-height:1.5}
.lcard .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;border-top:1px solid #E6ECF6}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px}
.pill.ok{background:#E3F6EA;color:#11733A}.pill.no{background:#EEF2F8;color:#5E6E8F}.pill.warn{background:#FFF3D6;color:#8A5B00}.pill.bad{background:#FDE8E8;color:#A51E1E}

/* ---------- WinBox lab ---------- */
#v-lab{background:#0B1A42}
.labTop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#0F2463;border-bottom:1px solid #22408F;color:#fff}
.labTop .mt{font-weight:800;font-size:16px}
.labTop .ml{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--cyan);font-weight:800}
.timer{font-family:var(--f-mono);font-weight:600;background:#071537;border:1px solid #2C4C9F;border-radius:8px;padding:6px 10px;font-size:14px;color:#9FF0C0}
.timer.low{color:#FF8A8A}
.labBody{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;padding:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:150px}
@media (max-width:1px) and (max-width:1150px){.labBody{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.panel>h5{margin:0;padding:9px 12px;background:linear-gradient(180deg,#F5F8FE,#E7EEFA);border-bottom:1px solid #D2DDF0;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#1C3A86;display:flex;align-items:center;gap:8px}
.panel>h5 .sp{margin-left:auto}
.pbody{padding:12px}
.story{font-size:13.5px;line-height:1.55;color:#24345A;margin:0 0 10px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tasks li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;font-size:13.5px;line-height:1.4;padding:7px 8px;border-radius:9px;background:#F5F8FD;border:1px solid #E1E8F4}
.tasks li .ck{width:20px;height:20px;border-radius:50%;border:2px solid #B9C6DD;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;margin-top:1px}
.tasks li.done{background:#ECF9F0;border-color:#BCE6CA}
.tasks li.done .ck{background:var(--ok);border-color:var(--ok)}
.tasks li.fail .ck{background:var(--bad);border-color:var(--bad)}
.tasks li.cur{border-color:#F3C64B;background:#FFFBEA}
.tasks li small{display:block;color:#5E6E8F;font-size:12.5px;margin-top:3px}
.tasks li .pts{font-size:11px;font-weight:800;color:#5E6E8F}
.scoreRow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.score{font-family:var(--f-disp);font-weight:800;font-style:italic;font-size:26px;color:var(--navy)}
.score small{font-size:12px;font-family:var(--f-body);font-style:normal;color:var(--mute);font-weight:600}
.labBtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.labBtns button{border:1px solid #C9D6EE;background:#F3F7FE;border-radius:9px;padding:8px;font-size:12.5px;font-weight:700;color:#1C3A86;display:flex;align-items:center;justify-content:center;gap:6px}
.labBtns button:hover{background:#E6EEFC}
.labBtns button.pri{background:linear-gradient(180deg,#2F78FF,#1A50C8);color:#fff;border-color:#1A50C8}
.hintBox{margin-top:10px;background:#FFF8E0;border:1px solid #F1D27A;border-radius:10px;padding:10px;font-size:13px;line-height:1.5;color:#5C4100}
.topo svg{display:block;width:100%;height:auto}
.topo .dev{cursor:pointer}
.topo .dev:hover .devbox{stroke:#3CC2FF;stroke-width:2.5}
.tests{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tests button{border:1px solid #BFD0EE;background:#fff;border-radius:8px;padding:6px 9px;font-size:12.5px;font-weight:700;color:#1B3779;display:flex;gap:6px;align-items:center}
.tests button:hover{background:#EEF4FF}
.tests button.ok{border-color:#7ED39A;background:#ECF9F0;color:#11733A}
.tests button.bad{border-color:#F09A9A;background:#FDF0F0;color:#A51E1E}
.flowLog{font-family:var(--f-mono);font-size:12px;background:#0B1433;color:#BFE3FF;border-radius:8px;padding:8px 10px;margin-top:8px;max-height:150px;overflow:auto;line-height:1.5;white-space:pre-wrap}
.flowLog .g{color:#7DF0A6}.flowLog .r{color:#FF8F8F}.flowLog .y{color:#FFD970}
.diag{list-style:none;margin:0;padding:0;font-size:13px}
.diag li{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px dashed #E1E8F4;font-family:var(--f-mono)}
.diag .v-ok{color:var(--ok);font-weight:800}.diag .v-bad{color:var(--bad);font-weight:800}.diag .v-q{color:#9AA3B2;font-weight:800}

/* WinBox window (outer app frame) */
.wbApp{background:var(--wb-bg);border:1px solid #8E96A6;border-radius:8px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45);font-family:var(--f-ui);font-size:12px;color:var(--wb-text);display:flex;flex-direction:column;height:clamp(560px,calc(100vh - 140px),920px);user-select:none}
@media (max-width:1px) and (max-width:760px){.wbApp{height:78vh;min-height:520px}}
.wbTitle{height:32px;display:flex;align-items:center;gap:8px;padding:0 0 0 10px;background:linear-gradient(180deg,#FDFDFE,#E7EBF2);border-bottom:1px solid #C3C9D4;font-size:13px}
.wbTitle .gl{width:18px;height:18px}
.wbTitle .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.wbTitle .wc{display:flex;height:100%}
.wbTitle .wc span{width:42px;display:grid;place-items:center;font-size:14px;color:#333}
.wbTitle .wc span:last-child:hover{background:#E81123;color:#fff}
.wbMenu{display:flex;gap:2px;padding:2px 6px;background:#F7F8FA;border-bottom:1px solid #D4D8DF}
.wbMenu span{padding:3px 8px;border-radius:3px;font-size:12.5px}
.wbMenu span:hover{background:#DDE6F7}
.wbTool{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#EEF0F3;border-bottom:1px solid #C8CDD5;flex-wrap:wrap}
.wbTool .tbtn{height:24px;min-width:28px;padding:0 8px;border:1px solid #A9B0BC;border-radius:3px;background:linear-gradient(#FFF,#E4E7EC);display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#222}
.wbTool .tbtn:hover{background:linear-gradient(#FFF,#D6E3F8);border-color:#7E9BD4}
.wbTool .tbtn.safe.on{background:linear-gradient(#FFE58A,#F2C433);border-color:#B68A00}
.wbTool .sess{display:flex;align-items:center;gap:5px;font-size:12px}
.wbTool .sess input{height:22px;width:120px;border:1px solid #A9B0BC;padding:0 5px;font:12px var(--f-ui);background:#fff}
.wbTool .led{margin-left:auto;width:14px;height:14px;background:#2BB34B;border:1px solid #1B7A31;box-shadow:inset 0 0 3px rgba(255,255,255,.6)}
.wbMain{display:flex;flex:1;min-height:0;position:relative}
.wbStripe{width:24px;background:linear-gradient(180deg,#3A52C4,#24379C);color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px;font-weight:600;letter-spacing:.6px;display:flex;align-items:center;justify-content:flex-start;padding:10px 0;white-space:nowrap;flex:none}
.wbSide{width:168px;flex:none;background:#F4F5F7;border-right:1px solid #C3C8D0;overflow:auto;padding:3px 0}
.mi{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 8px;cursor:default;position:relative;font-size:12.5px;white-space:nowrap}
.mi svg{width:17px;height:17px;flex:none}
.mi:hover,.mi.open{background:#CCDDF7}
.mi .chev{margin-left:auto;font-size:9px;color:#555}
.mi.pulse{animation:pulse 1.2s ease-in-out infinite;background:#FFF1B8}
@keyframes pulse{50%{box-shadow:inset 0 0 0 2px #F0B400;background:#FFE27A}}
.sub{position:absolute;z-index:400;background:#FAFBFC;border:1px solid #9AA2AF;box-shadow:3px 4px 12px rgba(0,0,0,.25);min-width:150px;padding:2px 0}
.sub .mi{padding:4px 12px}
.wbDesk{flex:1;position:relative;overflow:hidden;background:#D9DCE1 repeating-linear-gradient(45deg,transparent 0 12px,rgba(255,255,255,.08) 12px 13px);min-width:0}
.wbStatus{height:22px;display:flex;align-items:center;gap:14px;padding:0 10px;background:#ECEEF1;border-top:1px solid #C3C8D0;font-size:11.5px;color:#333;white-space:nowrap;overflow:hidden}
.wbStatus b{font-weight:600}
#wbSideToggle{display:none}
@media (max-width:1px) and (max-width:760px){
  .wbStripe{display:none}
  .wbSide{position:absolute;z-index:300;left:0;top:0;bottom:0;transform:translateX(-102%);transition:transform .2s;box-shadow:6px 0 18px rgba(0,0,0,.3)}
  .wbSide.open{transform:none}
  #wbSideToggle{display:inline-flex}
  .wbTool .sess{display:none}
}
/* inner windows */
.win{position:absolute;background:var(--wb-face);border:1px solid #6F7A8E;box-shadow:2px 4px 14px rgba(0,0,0,.32);display:flex;flex-direction:column;min-width:260px;max-width:calc(100% - 4px)}
.win.active{box-shadow:3px 6px 22px rgba(0,0,0,.45);border-color:#2F43B0}
.wt{height:24px;display:flex;align-items:center;background:linear-gradient(180deg,#8A98C8,#6E7EB4);color:#fff;font-size:12.5px;font-weight:600;padding:0 0 0 8px;cursor:move;flex:none}
.win.active .wt{background:linear-gradient(180deg,var(--wb-t1),var(--wb-t2))}
.wt .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt .wb{width:22px;height:18px;margin-right:3px;border:1px solid rgba(255,255,255,.6);display:grid;place-items:center;font-size:11px;background:rgba(255,255,255,.12);cursor:pointer}
.wt .wb:hover{background:rgba(255,255,255,.3)}
.wbody{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto}
.tabs{display:flex;gap:0;padding:4px 4px 0;border-bottom:1px solid #A9B0BC;background:var(--wb-face);flex-wrap:wrap}
.tabs span{padding:3px 10px;border:1px solid transparent;border-bottom:0;margin-bottom:-1px;font-size:12px;cursor:pointer;border-radius:3px 3px 0 0;color:#333}
.tabs span.on{background:#fff;border-color:#A9B0BC;color:#000}
.tabs span.dis{color:#999;cursor:default}
.ltool{display:flex;align-items:center;gap:3px;padding:4px;flex-wrap:wrap}
.ltool .tb{width:26px;height:22px;border:1px solid #A9B0BC;border-radius:2px;background:linear-gradient(#FFF,#E2E6EB);display:grid;place-items:center;padding:0}
.ltool .tb svg{width:14px;height:14px}
.ltool .tb:hover{border-color:#6E8FD6;background:linear-gradient(#FFF,#D5E2F8)}
.ltool .tb[disabled]{opacity:.45}
.ltool .tw{height:22px;border:1px solid #A9B0BC;border-radius:2px;background:linear-gradient(#FFF,#E2E6EB);padding:0 8px;font:12px var(--f-ui)}
.ltool .tw:hover{border-color:#6E8FD6}
.ltool .find{margin-left:auto;height:22px;width:110px;border:1px solid #A9B0BC;padding:0 5px;font:12px var(--f-ui);color:#666}
.grid{flex:1;overflow:auto;background:#fff;border-top:1px solid #C9CED6;border-bottom:1px solid #C9CED6;min-height:90px}
.grid table{border-collapse:collapse;width:100%;font-size:12px}
.grid th{position:sticky;top:0;background:linear-gradient(#FBFBFC,#E9EBEE);border-right:1px solid #CDD1D7;border-bottom:1px solid #B4BAC4;font-weight:400;text-align:left;padding:3px 6px;white-space:nowrap;color:#111}
.grid td{padding:2px 6px;white-space:nowrap;border-bottom:1px solid #F0F1F3;border-right:1px solid #F3F4F6;height:20px}
.grid td.fl{width:28px;color:#333;font-weight:600}
.grid tr.sel td{background:var(--wb-sel);color:#fff}
.grid tr.x td{color:#8A8F98}
.grid tr.dyn td{color:#2B2BA8}
.grid tr:hover:not(.sel) td{background:#EAF1FD}
.grid .num{text-align:right;font-variant-numeric:tabular-nums}
.grid .empty td{color:#888;font-style:italic;border:0}
.lfoot{padding:3px 8px;font-size:11.5px;color:#333;display:flex;gap:16px}
/* dialog */
.dlg{display:flex;gap:8px;padding:8px;min-width:0}
.dlg .fields{flex:1;min-width:0;background:#fff;border:1px solid #B9BFC9;padding:10px 10px 6px}
.dlg .btns{display:flex;flex-direction:column;gap:5px;width:84px;flex:none}
.dlg .btns button{height:24px;border:1px solid #A0A8B5;border-radius:2px;background:linear-gradient(#FFF,#E2E6EB);font:12px var(--f-ui);color:#111}
.dlg .btns button:hover{border-color:#6E8FD6;background:linear-gradient(#FFF,#D5E2F8)}
.dlg .btns button.def{border-color:#2F59C9;box-shadow:inset 0 0 0 1px #8CA9EC}
.fr{display:grid;grid-template-columns:118px minmax(0,1fr);align-items:center;gap:6px;margin-bottom:6px}
.fr label{text-align:right;color:#222;font-size:12px}
.fr input[type=text],.fr select,.fr .ro{height:22px;border:1px solid #9EA6B3;padding:0 5px;font:12px var(--f-ui);background:#fff;width:100%;min-width:0;border-radius:0}
.fr .ro{background:#F1F2F4;color:#555;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.fr .cb{display:flex;align-items:center;gap:6px}
.fr input.bad{background:#FFE8E8;border-color:#D24}
.dstat{display:flex;justify-content:space-between;gap:8px;padding:3px 8px;font-size:11.5px;color:#333;border-top:1px solid #C9CED6;background:#ECEEF1}
.derr{background:#FFF0F0;color:#B00000;border-top:1px solid #E7B4B4;padding:4px 8px;font-size:12px}
.wiz{padding:10px 12px;background:#fff;border:1px solid #B9BFC9;margin:8px}
.wiz p{margin:0 0 8px;font-size:12.5px}
.wbtnrow{display:flex;gap:6px;justify-content:flex-end;padding:0 8px 8px}
.wbtnrow button{height:24px;min-width:72px;border:1px solid #A0A8B5;border-radius:2px;background:linear-gradient(#FFF,#E2E6EB);font:12px var(--f-ui)}
.wbtnrow button:hover{border-color:#6E8FD6}
.term{background:#000;color:#D8D8D8;font-family:var(--f-mono);font-size:12.5px;line-height:1.45;padding:6px 8px;flex:1;overflow:auto;white-space:pre-wrap;word-break:break-word;min-height:260px;cursor:text;user-select:text}
.term .p{color:#7CE07C}
.term .e{color:#FF7B7B}
.term .h{color:#7FC8FF}
.term input{background:transparent;border:0;color:#fff;font:inherit;outline:none;width:60%;caret-color:#fff}
.logrow{display:grid;grid-template-columns:70px 120px 1fr;gap:8px;padding:2px 6px;border-bottom:1px solid #F0F1F3;font-size:12px}
.logrow .tp{color:#555}
.pingSum{display:flex;gap:16px;padding:4px 8px;font-size:12px;border-top:1px solid #C9CED6}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:500;background:rgba(4,10,30,.6);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
#modal[hidden]{display:none!important}
.mbox{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.5);position:relative}
.mbox.wide{max-width:860px}
.mhead{padding:18px 20px 6px;display:flex;gap:14px;align-items:center}
.mhead img{width:74px;height:84px;object-fit:contain;object-position:bottom}
.mhead h3{margin:0;font-size:20px;color:var(--navy)}
.mbody{padding:6px 20px 16px;line-height:1.55;color:#24345A}
.mfoot{padding:12px 20px 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.mbox pre{background:#0B1433;color:#CFE6FF;font-family:var(--f-mono);font-size:12.5px;padding:12px;border-radius:10px;overflow:auto;max-height:50vh;white-space:pre}
.inp{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #BFD0EE;font:inherit;font-size:15px}
textarea.inp{min-height:70px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.fld label{font-weight:700;font-size:13.5px;color:var(--navy)}

/* ---------- eval / results ---------- */
.qcard{background:#fff;border-radius:18px;padding:22px;box-shadow:0 18px 50px rgba(0,0,10,.35);max-width:820px}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);font-weight:700;margin-bottom:8px}
.qbar{height:6px;border-radius:6px;background:#E3EAF6;overflow:hidden;margin-bottom:16px}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.qtext{font-size:18px;font-weight:700;color:var(--navy);margin:0 0 14px;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid #D7E1F2;background:#F8FAFE;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;color:#1B2B52;display:flex;gap:10px;align-items:center}
.opt:hover{border-color:#8FB0EA}
.opt .k{width:28px;height:28px;border-radius:8px;background:#E4ECFA;display:grid;place-items:center;font-weight:900;color:var(--navy);flex:none}
.opt.sel{border-color:var(--blue);background:#EEF4FF}
.opt.good{border-color:var(--ok);background:#ECF9F0}
.opt.wrong{border-color:var(--bad);background:#FDF0F0}
.ordBox{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:8px;border:2px dashed #C9D6EE;border-radius:12px;margin-bottom:10px}
.miniSide{width:190px;border:1px solid #B5BCC8;background:#F4F5F7;font-family:var(--f-ui);font-size:12.5px;border-radius:4px;overflow:hidden}
.miniSide .mi{cursor:pointer}
.res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:1px) and (max-width:860px){.res{grid-template-columns:1fr}}
.scoreTiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.stile{background:#F3F7FE;border:1px solid #DCE6F6;border-radius:12px;padding:12px}
.stile small{font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.stile b{display:block;font-family:var(--f-disp);font-style:italic;font-weight:800;font-size:32px;color:var(--navy);font-variant-numeric:tabular-nums}
.badge{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#0F2A6E,#1F5FE0);color:#fff;border-radius:14px;padding:14px 16px}
.badge svg{width:48px;height:48px;flex:none}
.badge b{font-family:var(--f-disp);font-style:italic;font-weight:900;font-size:22px;letter-spacing:.5px}
.prog{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:13.5px;font-weight:700;color:#24345A}
.prog .b{height:12px;border-radius:8px;background:#E3EAF6;overflow:hidden}
.prog .b i{display:block;height:100%;background:linear-gradient(90deg,#17A34A,#5BE38A)}
.prog span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.cert{background:#FFFDF6;border-radius:6px;padding:clamp(18px,4vw,40px);position:relative;color:#1A2547;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45);border:10px solid #0F2A6E;outline:2px solid #C9A227;outline-offset:-22px;max-width:900px;margin:0 auto}
.cert .ct{font-family:var(--f-disp);font-weight:900;font-style:italic;font-size:clamp(24px,4vw,40px);letter-spacing:3px;color:#0F2A6E;margin:8px 0 2px}
.cert .cs{letter-spacing:4px;font-size:12px;font-weight:800;color:#8A6D12;text-transform:uppercase}
.cert .nm{font-family:var(--f-disp);font-style:italic;font-weight:800;font-size:clamp(26px,5vw,48px);color:#1F5FE0;border-bottom:2px solid #C9A227;display:inline-block;padding:0 24px 4px;margin:10px 0 12px}
.cert .sig{display:flex;justify-content:space-between;align-items:end;margin-top:26px;gap:16px;flex-wrap:wrap;text-align:center}
.cert .sig div{min-width:180px;margin:0 auto}
.cert .sig .ln{border-top:1px solid #1A2547;padding-top:4px;font-weight:700;font-size:13px}
.seal{width:96px;height:96px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));z-index:600;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast div{background:#0F2A6E;color:#fff;border-left:5px solid var(--cyan);padding:10px 14px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:14px;font-weight:600;max-width:320px;animation:fadein .25s}
.toast div.ok{border-color:#5BE38A}.toast div.bad{border-color:#FF6B6B}.toast div.warn{border-color:var(--gold)}
.setRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #E6ECF6}
.setRow input[type=range]{width:160px}

/* ===== 16:9 stage (1600×900, scaled to fit, no page scroll) ===== */
html,body{height:100%;overflow:hidden;background:#02071A}
body::before{display:none}
:root{padding:0!important}
#screen{position:fixed;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:var(--ink);display:flex;flex-direction:column;box-shadow:0 0 0 1px #0E2263}
#screen.homeMode #topbar{display:none}
#topbar{position:relative;top:0;flex:none;height:60px;padding:0 24px}
#nav{position:static!important;display:flex!important;flex-direction:row!important;background:none!important;padding:0!important;border:0!important}
#menuBtn{display:none!important}
main{flex:1;min-height:0;position:relative}
.view{height:100%;min-height:0;overflow:hidden}
.view.on{display:block}
.wrap{height:100%;overflow-y:auto;scrollbar-width:none;padding:22px 44px 22px;max-width:none}
.wrap::-webkit-scrollbar{display:none}
#splash,#modal{position:absolute}
.toast{position:absolute;top:76px;right:22px}
#narr{position:absolute;left:18px;bottom:16px;max-width:760px;align-items:flex-end;gap:12px}
.nport{position:relative;width:150px;height:180px;flex:none;border-radius:20px;overflow:hidden;background:radial-gradient(120% 90% at 50% 25%,#3C8CFF 0%,#1546B8 55%,#0B2466 100%);border:3px solid #fff;box-shadow:0 14px 34px rgba(0,0,0,.5);pointer-events:auto;cursor:pointer;transition:width .25s,height .25s}
.nport canvas{width:100%;height:100%;display:block}
.nport .nname{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(5,15,45,.85));color:#fff;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;text-align:center;padding:14px 0 5px}
#narr.talk .nport{box-shadow:0 0 0 4px rgba(60,194,255,.55),0 14px 34px rgba(0,0,0,.5)}
#narr.talk #narrImg{animation:none}
#narr.mini .nport{width:92px;height:110px}
#narr.mini .nname{display:none}
#narr.noav .nport{display:none}
.bubble{margin-bottom:10px;max-width:560px}
.bubble::before{content:"";position:absolute;left:-9px;bottom:22px;border:9px solid transparent;border-right-color:#CFE0FF;border-left:0}
#narr.noav .bubble::before{display:none}
/* home */
#v-home .homeStage{position:absolute;inset:0;max-width:none;max-height:none;aspect-ratio:auto;width:100%;height:100%}
#v-home .homeStage img{object-fit:fill}
#homeFace{position:absolute;pointer-events:none}
.homeNav{position:absolute;right:22px;bottom:18px;display:flex;gap:8px;z-index:3}
.homeNav button{display:flex;align-items:center;gap:7px;background:rgba(10,28,82,.82);backdrop-filter:blur(6px);border:1px solid rgba(160,200,255,.45);color:#fff;border-radius:999px;padding:9px 15px;font-weight:700;font-size:13.5px}
.homeNav button:hover{background:rgba(31,95,224,.95)}
.homeNav button svg{width:16px;height:16px}
/* map */
.road{grid-template-columns:repeat(7,minmax(0,1fr))}
.node{min-height:150px}
/* materi */
#v-materi .wrap{display:flex;flex-direction:column}
#v-materi .mGrid{flex:1;min-height:0;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.mStage{min-height:0!important;overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;justify-content:center}
.mStage .diagram svg{max-height:560px}
.mText{overflow:auto;scrollbar-width:thin;min-height:0}
/* labs */
.labGrid.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.labGrid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.labGrid.g2{grid-template-columns:repeat(2,minmax(0,420px))}
.lcard p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* lab */
#v-lab.on{display:flex;flex-direction:column}
.labTop{flex:none;padding:8px 18px}
.labBody{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) 390px!important;padding:10px 14px 12px!important}
#wbHost{min-height:0;height:100%}
.wbApp{height:100%!important;min-height:0!important}
.side{overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:thin;scrollbar-color:#3C6BEA #0B1A42;padding-right:6px;gap:10px}
.side::-webkit-scrollbar{width:8px}.side::-webkit-scrollbar-thumb{background:#3C6BEA;border-radius:8px}.side::-webkit-scrollbar-track{background:#0B1A42}
.side>.panel{flex:none;overflow:visible}
.side>.panel>h5{border-radius:12px 12px 0 0}
.side .pbody{padding:10px 12px}
.side .story{margin-bottom:8px}
.side .topo svg{max-height:300px}
/* reflect */
.refGrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.refGrid textarea.inp{min-height:84px}
.cert{transform:scale(.92);transform-origin:top center}
</style>

    notes.forEach(n => [-7, 7].forEach(dt => { const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = N(n); o.detune.value = dt; const og = ctx.createGain(); og.gain.value = 0.18; o.connect(og); og.connect(lp); o.start(t); o.stop(t + dur + 0.5); }));
  }
  function pluck(n, t, v = 0.07) {
    const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = N(n);
    const g = ctx.createGain(); env(g, t, 0.005, v, 0.35); o.connect(g); g.connect(music); g.connect(delay); o.start(t); o.stop(t + 0.5);
  }
  function bass(n, t, dur) { const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = N(n); const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(music); o.start(t); o.stop(t + dur + 0.05); }
  function kick(t) { const o = ctx.createOscillator(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12); const g = ctx.createGain(); env(g, t, 0.003, 0.22, 0.22); o.connect(g); g.connect(music); o.start(t); o.stop(t + 0.3); }
  function hat(t, v = 0.03) { const s = ctx.createBufferSource(); s.buffer = noiseBuf; const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 7500; const g = ctx.createGain(); env(g, t, 0.002, v, 0.05); s.connect(hp); hp.connect(g); g.connect(music); s.start(t); s.stop(t + 0.08); }
  const ARP = [0, 1, 2, 3, 2, 1, 2, 3];
  function tick() {
    while (nextT < ctx.currentTime + 0.25) {
      const bar = Math.floor(step / 16) % 4, s = step % 16, ch = CH[bar], t = nextT;
      if (s === 0) { pad(ch, t, S16 * 16); bass(BASS[bar], t, S16 * 6); }
      if (s === 8) bass(BASS[bar], t, S16 * 3);
      if (s === 11) bass(BASS[bar] + 12, t, S16 * 2);
      if (s % 2 === 0) pluck(ch[ARP[(s / 2) % 8]] + 12, t, s % 4 === 0 ? 0.06 : 0.04);
      if (s === 0 || s === 8) kick(t);
      if (s % 4 === 2) hat(t, 0.025); if (s % 4 === 3 && Math.random() < .4) hat(t, 0.012);
      step++; nextT += S16;
    }
  }
  function setMusicGain() { if (!ctx) return; const v = SET.music ? SET.musicVol * 0.55 * duckLvl : 0; music.gain.cancelScheduledValues(ctx.currentTime); music.gain.linearRampToValueAtTime(v, ctx.currentTime + 0.4); }
  function startMusic() { init(); if (ctx.state === "suspended") ctx.resume(); if (!started) { started = true; nextT = ctx.currentTime + 0.1; timer = setInterval(tick, 90); } setMusicGain(); }
  function tone(type, f1, f2, t, dur, v, dest = sfx) { const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f1, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur); const g = ctx.createGain(); env(g, t, 0.004, v, dur); o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05); }
  const SFX = {
    click: t => tone("square", 1800, 1200, t, 0.025, 0.05),
    open: t => { tone("sine", 660, 0, t, 0.08, 0.12); tone("sine", 990, 0, t + 0.06, 0.12, 0.1); },
    close: t => { tone("sine", 880, 0, t, 0.06, 0.08); tone("sine", 600, 0, t + 0.05, 0.1, 0.07); },
    ok: t => [72, 76, 79, 84].forEach((n, i) => tone("triangle", N(n), 0, t + i * 0.07, 0.25, 0.14)),
    err: t => { tone("square", 220, 180, t, 0.16, 0.08); tone("square", 165, 140, t + 0.17, 0.22, 0.08); },
    ping: t => tone("sine", 1568, 1568, t, 0.09, 0.12),
    timeout: t => tone("sawtooth", 196, 150, t, 0.25, 0.05),
    win: t => { [60, 64, 67, 72, 76, 79, 84].forEach((n, i) => tone("triangle", N(n), 0, t + i * 0.09, 0.35, 0.13)); tone("sine", N(48), 0, t + 0.6, 1.2, 0.18); },
    type: t => tone("square", 2400 + Math.random() * 600, 0, t, 0.012, 0.02),
    boot: t => { tone("sawtooth", 80, 640, t, 1.3, 0.06); [0, .25, .5].forEach((d, i) => tone("sine", 1200 + i * 300, 0, t + 1.1 + d, 0.09, 0.1)); tone("sine", N(60), 0, t + 1.9, 1.4, 0.12); tone("sine", N(67), 0, t + 1.9, 1.4, 0.1); tone("sine", N(76), 0, t + 1.9, 1.4, 0.08); },
    hint: t => { tone("sine", N(84), 0, t, 0.18, 0.09); tone("sine", N(88), 0, t + 0.1, 0.25, 0.08); },
    pkt: t => tone("sine", 2200, 2600, t, 0.04, 0.035)
  };
  return {
    unlock() { init(); if (ctx.state === "suspended") ctx.resume(); },
    sfx(name) { try { init(); if (ctx.state === "suspended") ctx.resume(); SFX[name] && SFX[name](ctx.currentTime + 0.01); } catch (e) {} },
    startMusic, setMusicGain,
    duck(on) { duckLvl = on ? 0.35 : 1; setMusicGain(); }
  };
})();

/* ================= narration (TTS + subtitles) ================= */
const POSE = { main: "main", sambut: "sambut", jelas: "presentasi", arahan: "arahan", tutup: "penutup", pikir: "berpikir", kaget: "terkejut", hore: "berhasil", setuju: "setuju", saran: "saran", senyum: "senyum", antusias: "antusias", wajah: "jelas" };
const Narr = (() => {
  let voice = null, lastText = "", lastPose = "jelas", typeTimer = null, speakingId = 0;
  const MALE = /ardi|andika|male|pria|laki|\bman\b/i, FEMALE = /gadis|damayanti|female|wanita|perempuan|google/i;
  let isMale = false;
  function pickVoice() {
    const vs = speechSynthesis.getVoices();
    const id = vs.filter(v => /^id|in[-_]ID/i.test(v.lang) || /indonesia/i.test(v.name));
    const chosen = SET.voiceName && vs.find(v => v.name === SET.voiceName);
    voice = chosen || id.find(v => MALE.test(v.name)) || id.find(v => !FEMALE.test(v.name)) || id[0] || null;
    isMale = !!voice && MALE.test(voice.name);
  }
  function pitch() { return SET.voicePitch != null ? SET.voicePitch : isMale ? 0.95 : 0.55; }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  const el = () => $("#narr");
  function autoMini(my) { setTimeout(() => { if (my === speakingId && !el().matches(":hover")) el().classList.add("mini"); }, 3500); }
  function show(text, pose) {
    const n = el(); n.classList.remove("hide", "mini"); n.classList.toggle("noav", CUR === "home");
    Face.pose(POSE[pose] || pose);
    const box = $("#narrText"); clearInterval(typeTimer); box.textContent = ""; let i = 0;
    typeTimer = setInterval(() => { i += 2; box.textContent = text.slice(0, i); if (i >= text.length) clearInterval(typeTimer); }, 18);
  }
  function speak(text) {
    if (!("speechSynthesis" in window) || !SET.voice) { const my = ++speakingId; el().classList.add("talk"); Face.talk(true); setTimeout(() => { if (my === speakingId) Face.talk(false); el().classList.remove("talk"); autoMini(my); }, Math.min(7000, 1500 + text.length * 45)); return; }
    speechSynthesis.cancel(); const my = ++speakingId;
    const parts = text.replace(/[→]/g, " ke ").replace(/\//g, " per ").match(/[^.!?]+[.!?]*/g) || [text];
    el().classList.add("talk"); Audio.duck(true); Face.talk(true);
    parts.forEach((p, idx) => {
      const u = new SpeechSynthesisUtterance(p.trim()); u.lang = "id-ID"; if (voice) u.voice = voice; u.rate = isMale ? SET.voiceRate : SET.voiceRate * 0.92; u.pitch = pitch();
      u.onstart = () => { if (my === speakingId) Face.talk(true); }; u.onboundary = () => { if (my === speakingId) Face.pulse(); };
      if (idx === parts.length - 1) u.onend = u.onerror = () => { if (my === speakingId) { el().classList.remove("talk"); Audio.duck(false); Face.talk(false); autoMini(my); } };
      speechSynthesis.speak(u);
    });
    const chk = setInterval(() => { if (my !== speakingId) return clearInterval(chk); if (!speechSynthesis.speaking && !speechSynthesis.pending) { clearInterval(chk); el().classList.remove("talk"); Audio.duck(false); Face.talk(false); autoMini(my); } }, 600);
  }
  return {
    say(text, pose = "jelas") { lastText = text; lastPose = pose; show(text, pose); speak(text); },
    replay() { if (lastText) { show(lastText, lastPose); speak(lastText); } },
    stop() { speakingId++; if ("speechSynthesis" in window) speechSynthesis.cancel(); el().classList.remove("talk"); Audio.duck(false); Face.talk(false); },
    hide() { this.stop(); el().classList.add("hide"); },
    mini() { el().classList.toggle("mini"); },
    voices() { return "speechSynthesis" in window ? speechSynthesis.getVoices().filter(v => /^id|in[-_]ID/i.test(v.lang) || /indonesia/i.test(v.name)) : []; },
    current() { return voice ? voice.name + (isMale ? " (laki-laki)" : " (dibuat berat)") : "tidak ada suara Indonesia"; },
    repick() { if ("speechSynthesis" in window) pickVoice(); },
    pose(p) { Face.pose(POSE[p] || p); }
  };
})();

/* ================= UI helpers ================= */
function toast(msg, kind = "") { const d = document.createElement("div"); d.className = kind; d.textContent = msg; $("#toast").appendChild(d); setTimeout(() => d.remove(), 3200); }
function modal(html, opts = {}) {
  const m = $("#modal"), b = $("#mbox"); b.className = "mbox" + (opts.wide ? " wide" : ""); b.innerHTML = html; m.hidden = false;
  return new Promise(res => {
    b.onclick = e => { const t = e.target.closest("[data-r]"); if (t) { m.hidden = true; Audio.sfx("click"); res(t.dataset.r); } };
  });
}
function closeModal() { $("#modal").hidden = true; }
function confirmBox(title, text, yes = "YA", no = "BATAL", pose = "pikir") {
  return modal(`<div class="mhead"><img src="${IMG[POSE[pose]]}" alt=""><h3>${esc(title)}</h3></div><div class="mbody">${text}</div><div class="mfoot"><button class="btn btn-ghost btn-sm" style="color:#1C3A86;border-color:#BFD0EE" data-r="no">${no}</button><button class="btn btn-blue btn-sm" data-r="yes">${yes}</button></div>`).then(r => r === "yes");
}

function caseCfg() { return SET.customCase || { lan: "192.168.50.1/24", pool: "192.168.50.10-192.168.50.100" }; }

/* ================= start mission ================= */
function startMission(id, opts = {}) {
  closeModal(); stopTimer();
  const m = M[id]; L.m = Object.assign({ id }, m); L.m.tasksList = typeof m.tasks === "function" ? m.tasks() : m.tasks;
  L.r = blankRouter(); m.init(L.r); logEv(L.r, "system,info", "router has been started"); logEv(L.r, "system,info,account", "user admin logged in from 192.168.88.254 via winbox");
  L.w = WORLDS[m.world](); PCI = 0; L.wins = []; UNDO.length = 0; L.uptime0 = Date.now();
  L.ses = { pass: {}, hints: 0, hintLvl: {}, done: {}, pings: {}, opened: {}, findOk: false, findTries: 0, faults: [], validated: null, t0: Date.now(), finished: false };
  if (m.kind === "trouble") { const pool = FAULTS.slice().sort(() => Math.random() - 0.5); const pick = [pool[0]]; const clash = { lanip: ["pool", "gw"], pool: ["lanip"], gw: ["lanip"] }; pick.push(pool.slice(1).find(f => !(clash[pick[0].id] || []).includes(f.id))); pick.forEach(f => f.apply(L.r)); L.ses.faults = pick.map(f => f.id); logEv(L.r, "system,warning", "configuration changed by unknown user"); }
  if (opts.restore) { L.r = opts.restore; }
  go("lab", true);
  const v = $("#v-lab");
  const timed = m.timer;
  v.innerHTML = `<div class="labTop"><div><div class="ml">${esc(m.level)}</div><div class="mt">${esc(m.title)}</div></div>${timed ? `<div class="timer" id="timer">--:--</div>` : ""}<div style="margin-left:auto" class="row"><button class="btn btn-ghost btn-sm" id="labBack">← ${["lab", "trouble"].includes(m.kind) ? "Daftar Lab" : m.kind === "guided" ? "Kembali ke Materi" : m.kind === "challenge" ? "Challenge" : m.kind === "exam" ? "Evaluasi" : "Beranda"}</button></div></div>
  <div class="labBody"><div id="wbHost" style="min-width:0">${winboxHTML()}</div><div class="side"><div class="panel" id="pMission"></div><div class="panel" id="pTopo"><h5>Topologi &amp; Uji Koneksi <span class="sp"></span></h5><div class="pbody"><div class="topo" id="topo"></div><div id="devInfo" style="font-size:12.5px;color:#24345A;min-height:1em"></div><div class="tests" id="tests"></div><div class="flowLog" id="flowLog">Klik tombol uji untuk mengirim paket.</div></div></div><div class="panel" id="pDiag"><h5>Network Diagnostic</h5><div class="pbody" id="diag"></div></div></div></div>`;
  $("#labBack").onclick = () => { stopTimer(); go(m.kind === "guided" ? "materi" : m.kind === "challenge" ? "challenge" : m.kind === "exam" ? "eval" : m.kind === "free" ? "home" : "labs"); };
  renderSide(); bindWinbox(); renderStatus();
  const desk = $("#wbDesk"); const narrow = desk.clientWidth < 600;
  if (m.kind === "free") { openWin("interfaces", { w: 600 }); if (!narrow) { openWin("addresses", { dy: 220, dx: 0, w: 380 }); openWin("routes", { dy: 220, dx: 330, w: 420 }); } }
  else if (!narrow) openWin("interfaces");
  updatePulse(); renderMission(); renderTopo(); renderTests(); renderDiag();
  if (timed) startTimer((m.kind === "exam" ? 20 : SET.challengeMin) * 60);
  const intro = m.kind === "guided" ? `${m.story} ${L.m.tasksList[0].how}` : m.kind === "trouble" ? "Internet laboratorium mati. Jangan langsung mengubah konfigurasi. Amati gejala, uji koneksi, periksa setiap menu, lalu laporkan temuanmu." : m.kind === "challenge" ? "Challenge dimulai. Tidak ada panduan. Baca target, konfigurasi router, lalu tekan Validasi." : m.kind === "exam" ? "Evaluasi praktik dimulai. Kerjakan mandiri tanpa hint. Semoga sukses." : m.kind === "free" ? "Ini Virtual WinBox mode bebas. Coba klik setiap menu di sidebar, lalu uji hasilnya pada topologi di sebelah kanan." : m.story;

const isHidden = () => ["challenge", "exam"].includes(L.m.kind);
function curTask() { return L.m.tasksList.find((t, i) => !L.ses.done[i]); }
function updatePulse() { const t = L.m && L.m.kind === "guided" && curTask(); L.pulse = t && t.menu || null; renderSide(); }
function hookMenu(k) { if (L.m && L.m.kind === "guided") { const t = curTask(); if (t && t.menu === k) { /* correct menu found */ } } }
function routerPingDone(target, ok) { if (L.ses) { L.ses.pings[target] = ok; } }

/* ================= mission panel ================= */
function evalTasks() {
  let newly = [];
  L.m.tasksList.forEach((t, i) => {
    let ok; try { ok = !!t.check(); } catch (e) { ok = false; }
    if (t.test && !isHidden()) ok = ok && !!L.ses.pass[t.test];
    if (!isHidden()) { if (ok && !L.ses.done[i]) { L.ses.done[i] = true; newly.push(t); } if (!ok && L.ses.done[i] && !t.test) { L.ses.done[i] = false; } }
  });
  return newly;
}
function missionScore() {
  const tasks = L.m.tasksList; const total = tasks.reduce((a, t) => a + t.pts, 0) || 1;
  const done = isHidden() ? (L.ses.validated || []) : tasks.map((_, i) => !!L.ses.done[i]);
  const earned = tasks.reduce((a, t, i) => a + (done[i] ? t.pts : 0), 0);
  return clamp(Math.round(100 * (earned - L.ses.hints - L.ses.findTries * 3) / total), 0, 100);
}

function animate(path, stopIdx, ok, my, expectFail) {
  return new Promise(res => {
    const fx = document.querySelector("#fx"); if (!fx || !L.N) return res(); fx.innerHTML = "";
    const pts = path.map(n => L.N[n]); const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle"); dot.setAttribute("r", 5.5); dot.setAttribute("fill", "#3CC2FF"); dot.setAttribute("filter", "url(#glow)"); dot.setAttribute("stroke", "#fff"); dot.setAttribute("stroke-width", "1.5"); fx.appendChild(dot);
    let seg = 0, t0 = performance.now(); const D = reduce ? 1 : 340;
    const mark = (p, good) => { fx.insertAdjacentHTML("beforeend", good ? `<circle cx="${p[0]}" cy="${p[1]}" r="20" fill="none" stroke="#17A34A" stroke-width="3"><animate attributeName="r" values="12;24;20" dur=".5s"/></circle>` : `<g transform="translate(${p[0]},${p[1] - 2})"><circle r="13" fill="#DC2F2F" stroke="#fff" stroke-width="2"><animate attributeName="r" values="6;15;13" dur=".4s"/></circle><path d="M-5 -5l10 10M5 -5l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>`); };
    if (stopIdx <= 0) { dot.setAttribute("cx", pts[0][0]); dot.setAttribute("cy", pts[0][1]); mark(pts[0], ok && !expectFail); return setTimeout(res, 400); }

    const step = now => {
      if (my !== ANIM) return res();
      const k = Math.min(1, (now - t0) / D); const a = pts[seg], b = pts[seg + 1];

      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

    { h: "Cara mengakses RouterOS", html: `<ul><li><b>WinBox</b>: aplikasi GUI Windows/macOS/Linux, paling populer untuk administrasi.</li><li><b>WebFig</b>: konfigurasi lewat web browser (http://192.168.88.1).</li><li><b>CLI / Terminal</b>: perintah teks, lewat New Terminal, SSH, Telnet, atau console.</li></ul><div class="note">IP bawaan router MikroTik baru adalah <code>192.168.88.1</code> dengan user <code>admin</code>.</div>`, narr: "RouterOS bisa diakses lewat WinBox, WebFig di browser, atau command line interface melalui terminal.", vis: "chain" },
    { h: "Aktivitas: cocokkan istilah", html: `<div class="actBox" id="matchBox"></div>`, narr: "Cocokkan setiap istilah dengan fungsinya. Pilih jawaban pada setiap kotak, lalu klik periksa.", vis: "chain", act: "match" }] },
  { id: "winbox", t: "WinBox", ic: "win", sub: "Login & mengenal dashboard", slides: [
    { h: "Login ke router", html: `<p>WinBox terhubung ke router lewat <b>IP address</b> atau <b>MAC address</b>. Isi <b>Connect To</b>, <b>Login</b>, dan <b>Password</b>, lalu klik <b>Connect</b>.</p><p>Coba login pada simulasi di panel kiri.</p>`, narr: "Isi Connect To dengan IP router, login admin, lalu klik Connect.", vis: "login" },
    { h: "Aktivitas: temukan menu", html: `<p>Setelah login, kamu melihat sidebar menu. Temukan menu yang diminta di panel kiri.</p><div class="actBox"><div class="q" id="findQ"></div><div class="fb" id="findFb"></div></div>`, narr: "Sekarang temukan menu yang diminta pada sidebar WinBox.", vis: "dash", act: "find" }] },
  { id: "interface", t: "Interface", ic: "port", sub: "Nama, status, dan MTU", practice: "p-iface", slides: [
    { h: "Interface di RouterOS", html: `<p><b>Interface</b> adalah pintu masuk dan keluar data: port Ethernet (ether1…), wireless (wlan1), bridge, VLAN, tunnel.</p><ul><li>Flag <b>R</b> = running (kabel terhubung, link aktif).</li><li>Flag <b>X</b> = disabled (dimatikan).</li><li><b>MTU</b> standar Ethernet 1500 byte.</li></ul>`, narr: "Interface adalah pintu data pada router. Flag R berarti running, flag X berarti disabled.", vis: "iftable" },
    { h: "Memberi nama interface", html: `<p>Nama default <code>ether1</code>, <code>ether2</code> sulit dibaca. Administrator biasanya mengganti nama sesuai fungsi, misalnya <b>WAN</b> dan <b>LAN</b>.</p><p>Caranya: <b>Interfaces</b> → klik dua kali interface → ubah <b>Name</b> → <b>Apply</b> → <b>OK</b>. Semua konfigurasi lain otomatis mengikuti nama baru.</p>`, narr: "Ganti nama interface sesuai fungsinya, misalnya WAN dan LAN, supaya konfigurasi mudah dibaca.", vis: "iftable" }] },
  { id: "ip", t: "IP Address", ic: "ip", sub: "Alamat, prefix, dan subnet", practice: "p-ip", slides: [
    { h: "IP address dan prefix", html: `<p>Alamat IPv4 terdiri dari 32 bit, ditulis 4 oktet: <code>192.168.10.1</code>. <b>Prefix</b> <code>/24</code> berarti 24 bit pertama adalah bagian network.</p><ul><li>Network: <code>192.168.10.0</code></li><li>Host: <code>192.168.10.1 – 192.168.10.254</code></li><li>Broadcast: <code>192.168.10.255</code></li></ul><div class="note">Di WinBox, tulis IP lengkap dengan prefix. Jika prefix tidak ditulis, RouterOS memakai <code>/32</code>.</div>`, narr: "IP address ditulis bersama prefix. Contoh 192.168.10.1 garis miring 24. Gunakan kalkulator di kiri untuk mencoba.", vis: "calc" },
    { h: "Menambahkan IP di WinBox", html: `<p>Menu <b>IP → Addresses</b> → tombol <b>+</b>.</p><ul><li><b>Address</b>: <code>192.168.10.1/24</code></li><li><b>Network</b>: terisi otomatis</li><li><b>Interface</b>: <code>LAN</code></li></ul><p>Router lalu otomatis membuat <b>connected route</b> (DAC) ke 192.168.10.0/24.</p>`, narr: "Tambahkan IP di menu IP, Addresses. Router otomatis membuat connected route.", vis: "calc" }] },
  { id: "dhcp", t: "DHCP", ic: "dhcp", sub: "Server, pool, dan lease", practice: "p-dhcp", slides: [
    { h: "Proses DORA", html: `<p><b>DHCP</b> membagikan IP otomatis kepada client. Prosesnya disebut <b>DORA</b>:</p><ol><li><b>Discover</b> – client mencari server (broadcast).</li><li><b>Offer</b> – server menawarkan IP.</li><li><b>Request</b> – client meminta IP tersebut.</li><li><b>ACK</b> – server menyetujui; IP dipinjamkan selama <i>lease time</i>.</li></ol>`, narr: "DHCP bekerja dengan empat langkah: Discover, Offer, Request, dan Acknowledge.", vis: "dora" },
    { h: "DHCP di RouterOS", html: `<p>Menu <b>IP → DHCP Server</b> → tombol <b>DHCP Setup</b>. Wizard 6 langkah:</p><ol><li>Interface: <code>LAN</code></li><li>Address Space: <code>192.168.10.0/24</code></li><li>Gateway: <code>192.168.10.1</code></li><li>Pool: <code>192.168.10.10-192.168.10.100</code></li><li>DNS: <code>8.8.8.8</code></li><li>Lease Time: <code>01:00:00</code></li></ol><p>Client yang sudah mendapat IP terlihat di tab <b>Leases</b> dengan status <b>bound</b>.</p>`, narr: "Gunakan DHCP Setup pada menu IP, DHCP Server. Ada enam langkah, dari memilih interface hingga lease time.", vis: "dora" }] },
  { id: "dns", t: "DNS", ic: "dns", sub: "Nama domain & cache", practice: "p-dns", slides: [
    { h: "Fungsi DNS", html: `<p><b>DNS</b> menerjemahkan nama domain (google.com) menjadi IP (142.250.4.100). Tanpa DNS, client hanya bisa memakai alamat IP.</p><p>Router MikroTik bisa menjadi <b>DNS cache</b>: client bertanya ke router, router bertanya ke DNS publik, lalu menyimpan jawabannya.</p>`, narr: "DNS menerjemahkan nama domain menjadi alamat IP. Router MikroTik dapat berperan sebagai DNS cache.", vis: "dnsanim" },
    { h: "DNS di RouterOS", html: `<p>Menu <b>IP → DNS</b>:</p><ul><li><b>Servers</b>: <code>8.8.8.8</code>, <code>1.1.1.1</code></li><li><b>Allow Remote Requests</b>: centang agar client boleh memakai router sebagai DNS.</li></ul><p>Uji dengan <code>/ping google.com</code> di New Terminal.</p>`, narr: "Isi DNS server, lalu centang Allow Remote Requests agar client bisa memakai router sebagai DNS.", vis: "dnsanim" }] },
  { id: "nat", t: "NAT", ic: "nat", sub: "Masquerade ke Internet", practice: "p-nat", slides: [
    { h: "Mengapa butuh NAT?", html: `<p>PC di LAN memakai <b>IP privat</b> (192.168.x.x) yang tidak dikenal di Internet. <b>NAT</b> (Network Address Translation) mengganti alamat sumber paket menjadi IP WAN router sebelum keluar.</p><p><b>Masquerade</b> adalah src-nat otomatis memakai IP interface keluar, cocok untuk WAN yang IP-nya dari DHCP.</p>`, narr: "NAT masquerade mengganti IP privat client menjadi IP WAN router, sehingga balasan dari Internet bisa kembali.", vis: "natanim" },
    { h: "NAT di WinBox", html: `<p>Menu <b>IP → Firewall → tab NAT → +</b></p><ul><li>Tab General: <b>Chain</b> <code>srcnat</code>, <b>Out. Interface</b> <code>WAN</code></li><li>Tab Action: <b>Action</b> <code>masquerade</code></li></ul><p>CLI: <code>/ip firewall nat add chain=srcnat out-interface=WAN action=masquerade</code></p>`, narr: "Di tab NAT, pilih chain srcnat, out interface WAN, dan action masquerade.", vis: "natanim" }] },
  { id: "firewall", t: "Firewall", ic: "fw", sub: "Chain input, forward, output", practice: "p-fw", slides: [
    { h: "Tiga chain filter", html: `<ul><li><b>input</b>: paket yang <u>tujuannya router</u> (ping ke router, WinBox, DNS ke router).</li><li><b>forward</b>: paket yang <u>melewati router</u> (PC LAN ke Internet).</li><li><b>output</b>: paket yang <u>berasal dari router</u> (router ping 8.8.8.8).</li></ul><p>Rule dibaca dari atas ke bawah; rule pertama yang cocok menentukan <b>action</b>: accept, drop, atau reject.</p>`, narr: "Firewall filter punya tiga chain. Input untuk paket menuju router, forward untuk paket yang melewati router, dan output untuk paket dari router.", vis: "chains" },
    { h: "Aktivitas: pilih chain", html: `<div class="actBox" id="chainAct"></div>`, narr: "Tentukan chain yang tepat untuk setiap kasus. Ingat: apakah paket ditujukan ke router atau melewati router?", vis: "chains", act: "chain" }] },
  { id: "routing", t: "Routing", ic: "route", sub: "Default & static route", practice: "p-route", slides: [
    { h: "Tabel routing", html: `<p>Router memilih jalur berdasarkan <b>tabel routing</b> di <b>IP → Routes</b>:</p><ul><li><b>DAC</b> – connected, dibuat otomatis dari IP address.</li><li><b>DAd</b> – dinamis dari DHCP Client.</li><li><b>AS</b> – static, dibuat administrator.</li></ul><p><b>Default route</b> <code>0.0.0.0/0</code> dipakai untuk semua tujuan yang tidak ada di tabel, biasanya menuju gateway ISP.</p>`, narr: "Default route nol nol nol nol garis miring nol mengarahkan semua tujuan yang tidak dikenal ke gateway ISP.", vis: "routeanim" },
    { h: "Static route antar-router", html: `<p>Jika ada jaringan lain di belakang router lain, tambahkan <b>static route</b>:</p><p><code>Dst. Address 192.168.20.0/24</code> → <code>Gateway 10.10.10.2</code></p><p>Ingat: router tujuan juga harus tahu jalan pulang. Jika route salah, paket berhenti di tengah jalan. Kamu akan berlatih ini di <b>Lab 05</b>.</p>`, narr: "Static route dipakai untuk menjangkau jaringan di belakang router lain. Router tujuan juga harus tahu jalan pulang.", vis: "routeanim" }] },
  { id: "wireless", t: "Wireless", ic: "wifi", sub: "Access point & keamanan", practice: "p-wlan", slides: [
    { h: "Mode wireless", html: `<ul><li><b>ap-bridge</b>: router menjadi access point untuk banyak client.</li><li><b>station</b>: router menjadi client yang terhubung ke AP lain.</li><li><b>bridge</b>: AP point-to-point untuk satu client.</li></ul><p>Parameter utama: <b>SSID</b> (nama jaringan), <b>Band</b> (2GHz-b/g/n), <b>Frequency</b>, dan <b>Security Profile</b>.</p>`, narr: "Agar router menjadi hotspot, gunakan mode ap bridge, isi SSID, dan pasang security profile WPA2.", vis: "wifi" },
    { h: "Keamanan WPA2", html: `<p>Buat <b>Security Profile</b>: mode <code>dynamic keys</code>, centang <code>WPA2 PSK</code>, isi <b>WPA2 Pre-Shared Key</b> minimal 8 karakter. Pilih profile ini pada interface <b>wlan1</b>.</p><div class="note">Profile <code>default</code> tidak terenkripsi. Jangan biarkan hotspot sekolah terbuka.</div>`, narr: "Gunakan security profile WPA2 dengan password minimal delapan karakter.", vis: "wifi" }] }
];

/* ================= MAP (scene 04) ================= */
function materiUnlocked(i) { return SET.unlockAll || i === 0 || !!P.materi[MATERI[i - 1].id]; }
function renderMap() {
  const v = $("#v-map"); const done = MATERI.filter(m => P.materi[m.id]).length;
  const curI = MATERI.findIndex(m => !P.materi[m.id]);
  const node = (n, title, sub, ic, state, attr) => `<button class="node ${state}" ${attr}><span class="num">${String(n).padStart(2, "0")}</span><span class="nic">${BIG[ic]}</span><b>${title}</b><small>${sub}</small><span class="tag">${state.includes("done") ? "✓ selesai" : state.includes("lock") ? "🔒 terkunci" : state.includes("cur") ? "▶ lanjutkan" : "buka"}</span></button>`;
  const labsOk = SET.unlockAll || done === MATERI.length;
  const chOk = SET.unlockAll || (P.missions.lab3 || {}).done;
  v.innerHTML = bg("bgstudio") + `<div class="wrap"><div class="eyebrow">Scene 04 · Peta Materi</div><h1 class="title">Roadmap MTCNA</h1><p class="lead">Materi dibuka bertahap. Selesaikan satu topik untuk membuka topik berikutnya. Kemajuan: <b style="color:#fff">${done} / ${MATERI.length}</b> materi.</p>
  <div class="road">${MATERI.map((m, i) => node(i + 1, m.t, m.sub, m.ic, (P.materi[m.id] ? "done" : "") + (!materiUnlocked(i) ? " lock" : "") + (i === curI ? " cur" : ""), `data-m="${i}"`)).join("")}
  ${node(12, "LAB", "6 studi kasus Virtual WinBox", "lab", labsOk ? "" : "lock", 'data-x="labs"')}${node(13, "CHALLENGE", "Tantangan berwaktu", "flag", chOk ? "" : "lock", 'data-x="challenge"')}${node(14, "EVALUASI", "Teori + praktik", "exam", "", 'data-x="eval"')}</div></div>`;
  v.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { const i = +b.dataset.m; if (!materiUnlocked(i)) { Audio.sfx("err"); toast("Selesaikan materi sebelumnya dulu.", "warn"); return; } Audio.sfx("click"); MAT = i; SLIDE = 0; go("materi"); });
  v.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { if (b.classList.contains("lock")) { Audio.sfx("err"); toast(b.dataset.x === "labs" ? "Selesaikan semua materi untuk membuka LAB (atau buka lewat menu Lab Simulasi)." : "Selesaikan Lab 03 untuk membuka Challenge.", "warn"); return; } go(b.dataset.x); });
  Narr.say(done === 0 ? "Ini peta belajarmu. Mulai dari Pengenalan MikroTik. Setiap materi yang selesai akan membuka materi berikutnya." : `Kamu sudah menyelesaikan ${done} materi. Lanjutkan perjalananmu.`, "arahan");
}

/* ================= MATERI pages ================= */
let SLIDE = 0, VIS_T = 0;
function renderMateri() {
  const m = MATERI[MAT]; const s = m.slides[SLIDE]; const last = SLIDE === m.slides.length - 1;
  const v = $("#v-materi");
  v.innerHTML = bg("bglab") + `<div class="wrap"><div class="eyebrow">Materi ${String(MAT + 1).padStart(2, "0")} · ${esc(m.t)}</div><h2 class="title">${esc(s.h)}</h2>
  <div class="mGrid"><div class="mStage" id="stage"></div><div class="mText">${s.html}
  <div class="pager"><div class="dots">${m.slides.map((_, i) => `<i class="${i === SLIDE ? "on" : ""}"></i>`).join("")}</div>
  <button class="btn btn-ghost btn-sm" style="color:#1C3A86;border-color:#BFD0EE" id="mPrev" ${SLIDE ? "" : "disabled"}>‹ Kembali</button>
  ${last ? `${m.practice ? `<button class="btn btn-blue btn-sm" id="mPrac">▶ Praktik di Virtual WinBox</button>` : ""}<button class="btn btn-gold btn-sm" id="mDone">✓ Selesai &amp; Lanjut</button>` : `<button class="btn btn-blue btn-sm" id="mNext">Lanjut ›</button>`}</div>
  ${last && m.practice && (P.missions[m.practice] || {}).done ? `<p style="margin:10px 0 0;font-size:13px;color:var(--ok);font-weight:700">✓ Praktik selesai · skor ${(P.missions[m.practice] || {}).score}</p>` : ""}</div></div>
  <div class="row" style="margin-top:16px"><button class="btn btn-ghost btn-sm" id="mMap">← Peta Materi</button></div></div>`;
  $("#mPrev").onclick = () => { SLIDE--; Audio.sfx("click"); renderMateri(); };
  $("#mNext") && ($("#mNext").onclick = () => { SLIDE++; Audio.sfx("click"); renderMateri(); });
  $("#mMap").onclick = () => go("map");
  $("#mPrac") && ($("#mPrac").onclick = () => startMission(m.practice));
  $("#mDone") && ($("#mDone").onclick = () => { if (s.act && !ACT_OK[m.id + SLIDE]) { Audio.sfx("err"); toast("Selesaikan aktivitas terlebih dahulu.", "warn"); return; } P.materi[m.id] = true; saveP(); Audio.sfx("win"); const nx = MAT + 1; if (nx < MATERI.length) { MAT = nx; SLIDE = 0; toast("Materi selesai! Materi berikutnya terbuka.", "ok"); renderMateri(); } else { toast("Semua materi selesai! LAB terbuka.", "ok"); go("labs"); } });
  VIS_T++; VIS[s.vis] && VIS[s.vis]($("#stage"), VIS_T);
  if (s.act) ACTS[s.act] && ACTS[s.act]();
  Narr.say(s.narr, SLIDE === 0 ? "jelas" : s.act ? "arahan" : "jelas");
}
const ACT_OK = {};
const live = t => t === VIS_T && CUR === "materi";
