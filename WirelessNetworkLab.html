<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireless Network Lab — Virtual Network Technician</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📶%3C/text%3E%3C/svg%3E">
<style>
/* ============ WIRELESS NETWORK LAB — style ============ */
:root{
  --navy:#102A43; --navy2:#0b1f33; --blue:#168BFF; --blue2:#0f6fd1; --white:#fff; --soft:#F1F5F9;
  --line:#dbe3ec; --text:#1f2d3d; --muted:#5b6b7c; --ok:#16a34a; --okbg:#e8f7ee; --warn:#f59e0b; --warnbg:#fff6e5;
  --err:#dc2626; --errbg:#fdecec; --r:14px; --sh:0 6px 22px rgba(16,42,67,.10);
  --font:'Poppins','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#071526;color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5}
button{font-family:inherit}
img{max-width:100%}
h1,h2,h3,h4{margin:.2em 0 .5em;color:var(--navy);line-height:1.25}
h2{font-size:1.45rem} h3{font-size:1.12rem} h4{font-size:1rem}
p{margin:.35em 0 .7em}
code,.mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
.hidden{display:none!important}

/* ---------- top bar ---------- */
#topbar{position:absolute;top:0;left:0;right:0;height:56px;z-index:50;display:flex;align-items:center;gap:12px;padding:8px 14px;
  background:linear-gradient(90deg,var(--navy),#163a5c);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px;cursor:pointer;white-space:nowrap}
#topbar .brand .logo{width:34px;height:34px;border-radius:9px;background:var(--blue);display:grid;place-items:center}
#topbar .brand small{display:block;font-weight:400;font-size:.72rem;opacity:.8}
#topbar .prog{flex:1;min-width:80px;max-width:340px;margin-left:auto}
#topbar .prog .bar{height:8px;background:rgba(255,255,255,.18);border-radius:8px;overflow:hidden}
#topbar .prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#39d98a,var(--blue));transition:width .5s}
#topbar .prog span{font-size:.72rem;opacity:.85}
#topbar .tb{display:flex;gap:6px}
.ibtn{border:0;background:rgba(255,255,255,.12);color:#fff;width:38px;height:38px;border-radius:10px;cursor:pointer;display:grid;place-items:center;font-size:17px;transition:.15s}
.ibtn:hover{background:rgba(255,255,255,.25)} .ibtn.off{opacity:.45}
.ibtn svg{width:20px;height:20px}

/* ---------- stage ---------- */

.scene-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.scene-head .tag{background:var(--blue);color:#fff;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:4px}
.scene-head h2{margin:0}
.scene-head p{margin:2px 0 0;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}


.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff;transition:.15s;font-size:.92rem;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--blue2)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)} .btn.ghost:hover{background:var(--soft)}
.btn.ok{background:var(--ok)} .btn.warn{background:var(--warn)} .btn.danger{background:var(--err)} .btn.navy{background:var(--navy)}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:8px}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.72rem;font-weight:600;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:#b45309} .pill.err{background:var(--errbg);color:var(--err)} .pill.blue{background:#e6f2ff;color:var(--blue2)}
.sim-badge{display:inline-flex;align-items:center;gap:5px;background:#fff7e6;color:#9a5b00;border:1px dashed #f0b44c;padding:2px 9px;border-radius:8px;font-size:.72rem;font-weight:600}
.note{background:#eef6ff;border-left:4px solid var(--blue);padding:10px 12px;border-radius:8px;font-size:.88rem;margin:10px 0}
.note.warn{background:var(--warnbg);border-color:var(--warn)} .note.ok{background:var(--okbg);border-color:var(--ok)} .note.err{background:var(--errbg);border-color:var(--err)}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--soft);color:var(--navy);font-weight:600}
.tbl tr.hl td{background:#eef6ff}
input[type=text],input[type=password],input[type=number],select,textarea{font-family:inherit;font-size:.9rem;padding:7px 9px;border:1px solid #c5d0dc;border-radius:7px;background:#fff;color:var(--text);max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #9cccff;border-color:var(--blue)}
label{font-size:.88rem}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.field>span{font-size:.8rem;color:var(--muted);font-weight:500}

/* sub tabs */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.subtabs button{border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:10px;cursor:pointer;font-weight:600;font-size:.84rem;color:var(--navy)}
.subtabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.subtabs button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#cbd5e1;margin-right:6px;vertical-align:middle}
.subtabs button .dot.s1{background:var(--warn)} .subtabs button .dot.s2{background:var(--ok)}
.navbar-bottom{display:flex;justify-content:space-between;gap:10px;margin-top:18px}

/* ---------- guide (Pak Yarli) ---------- */
#guide{position:fixed;left:12px;right:12px;bottom:10px;z-index:60;display:flex;align-items:flex-end;gap:10px;pointer-events:none;max-width:980px;margin:0 auto}
#guide .av{width:86px;height:100px;border-radius:14px;overflow:hidden;flex:none;background:#dfe9f5;border:3px solid #fff;box-shadow:var(--sh);pointer-events:auto;cursor:pointer}
#guide .av img{width:100%;height:100%;object-fit:cover;object-position:top}
#guide .bubble{pointer-events:auto;flex:1;background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;box-shadow:0 10px 30px rgba(16,42,67,.2);padding:10px 14px;position:relative;max-height:150px;overflow:auto}
#guide .bubble b.nm{color:var(--blue2);font-size:.8rem;display:block}
#guide .bubble .tx{font-size:.9rem}
#guide .bubble .ctl{position:absolute;top:6px;right:8px;display:flex;gap:4px}
#guide .bubble .ctl button{border:0;background:var(--soft);border-radius:7px;width:28px;height:26px;cursor:pointer;font-size:13px}
#guide.min .bubble{display:none}
#guide .speaking{position:absolute;left:-2px;top:-2px;width:12px;height:12px;border-radius:50%;background:#39d98a;box-shadow:0 0 0 0 rgba(57,217,138,.7);animation:pulse 1.2s infinite}
@keyframes pulse{to{box-shadow:0 0 0 12px rgba(57,217,138,0)}}


/* ---------- modal & toast ---------- */
#modal{position:fixed;inset:0;background:rgba(9,25,41,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:14px}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .2s}
#modal .box.wide{max-width:900px}
#modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#modal .mh h3{margin:0;flex:1}
#modal .mb{padding:16px 18px}
#modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.95);opacity:0}}
#toasts{position:fixed;top:64px;right:14px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:#fff;border-left:5px solid var(--blue);padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:.88rem;animation:slidein .25s}
.toast.ok{border-color:var(--ok)} .toast.err{border-color:var(--err)} .toast.warn{border-color:var(--warn)}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}

/* ---------- opening ---------- */
.opening{position:relative;width:100%;max-width:1280px;margin:0 auto;aspect-ratio:1672/941;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(16,42,67,.35);background:#0b3a78}
.opening img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.opening .hot{position:absolute;border-radius:14px;cursor:pointer;border:0;background:transparent;transition:.2s}
.opening .hot:hover{box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 30px rgba(22,139,255,.9);background:rgba(255,255,255,.06)}
.opening .hot.mulai{border-radius:40px;animation:glow 1.8s infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(255,217,61,.55),0 0 28px rgba(255,217,61,.75)}}
.opening .wave{position:absolute;border:3px solid rgba(120,220,255,.75);border-radius:50%;pointer-events:none;animation:wave 2.6s infinite ease-out;opacity:0}
@keyframes wave{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.opening .led{position:absolute;width:.55%;aspect-ratio:1;border-radius:50%;background:#5dffb0;box-shadow:0 0 8px #5dffb0;animation:blink 1s infinite steps(2);pointer-events:none}
@keyframes blink{50%{opacity:.2}}
.opening-under{max-width:1280px;margin:12px auto 0;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- menu ---------- */
.dash-hero{display:flex;gap:16px;align-items:center;background:linear-gradient(120deg,var(--navy),#1d4f80);color:#fff;border-radius:18px;padding:18px;margin-bottom:16px;overflow:hidden;position:relative}
.dash-hero h2{color:#fff;margin:0} .dash-hero img{width:110px;border-radius:14px;border:3px solid rgba(255,255,255,.4)}
.dash-hero .big{font-size:2rem;font-weight:700}
.mcard{cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:.2s;position:relative;overflow:hidden}
.mcard:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(16,42,67,.16);border-color:var(--blue)}
.mcard .ico{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--blue),#5ab8ff);display:grid;place-items:center;color:#fff}
.mcard .ico svg{width:28px;height:28px}
.mcard .num{position:absolute;right:12px;top:8px;font-size:2rem;font-weight:800;color:#eef3f8}
.mcard h3{margin:4px 0 0}

/* ---------- device / antenna catalog ---------- */
.dev{cursor:pointer;text-align:center;transition:.2s}
.dev:hover,.dev.on{border-color:var(--blue);box-shadow:0 0 0 3px #cfe6ff}
.dev .im{height:120px;display:grid;place-items:center;background:linear-gradient(#fff,#f3f7fb);border-radius:10px;margin-bottom:6px}
.dev .im img{max-height:112px;object-fit:contain;mix-blend-mode:multiply}
.dev b{display:block;color:var(--navy)}
.drop{border:2px dashed #b6c6d8;border-radius:12px;min-height:90px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;transition:.15s;background:#fafcfe}
.drop.over{border-color:var(--blue);background:#eef6ff}
.drop.ok{border-color:var(--ok);background:var(--okbg)} .drop.bad{border-color:var(--err);background:var(--errbg)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.06);cursor:grab;font-size:.84rem;font-weight:600;user-select:none;touch-action:none}
.chip img{height:34px;mix-blend-mode:multiply}
.chip.sel{outline:3px solid var(--blue)}

/* quiz */
.q{margin-bottom:14px}
.q .opts{display:grid;gap:7px;margin-top:8px}
.q .opt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;text-align:left;cursor:pointer;font-size:.9rem;transition:.15s}
.q .opt:hover{border-color:var(--blue)} .q .opt.sel{border-color:var(--blue);background:#eef6ff}
.q .opt.right{border-color:var(--ok);background:var(--okbg)} .q .opt.wrong{border-color:var(--err);background:var(--errbg)}
.q .fb{margin-top:6px;font-size:.86rem}

/* ---------- terminal ---------- */
.term{background:#0c1117;color:#cfe3d0;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;border-radius:10px;padding:10px 12px;height:300px;overflow:auto;line-height:1.45}
.term .ln{white-space:pre-wrap;word-break:break-word}
.term .in{display:flex;gap:6px}
.term .in input{flex:1;background:transparent;border:0;color:#fff;font-family:inherit;font-size:13px;outline:none;padding:0}
.term .pr{color:#7fd4ff}
.term .e{color:#ff8a80} .term .g{color:#8cffb0} .term .y{color:#ffe082}
.term.mt{background:#0a0a0a;color:#e8e8e8} .term.mt .pr{color:#6fff6f}
.quickcmd{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.quickcmd button{border:1px solid var(--line);background:#fff;border-radius:7px;font-size:.74rem;padding:3px 7px;cursor:pointer;font-family:Consolas,monospace}

/* ---------- laptop (Windows-like) ---------- */
.laptop{background:#2b2f36;border-radius:16px 16px 6px 6px;padding:12px 12px 0;box-shadow:var(--sh)}
.laptop .scr{background:#1a6fb5 linear-gradient(135deg,#0f4c8a,#3a8fd6);border-radius:6px;height:470px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.laptop .base{height:14px;background:linear-gradient(#cfd5dc,#9aa3ad);margin:0 -12px;border-radius:0 0 12px 12px}
.laptop .desk{flex:1;position:relative;overflow:hidden}
.laptop .taskbar{height:40px;background:rgba(20,24,32,.92);display:flex;align-items:center;gap:4px;padding:0 6px;color:#fff;font-size:12px}
.laptop .taskbar .tbi{height:32px;min-width:36px;padding:0 8px;border-radius:6px;display:flex;align-items:center;gap:5px;cursor:pointer;border:0;background:transparent;color:#fff;font-size:12px}
.laptop .taskbar .tbi:hover,.laptop .taskbar .tbi.on{background:rgba(255,255,255,.14)}
.laptop .taskbar .tray{margin-left:auto;display:flex;align-items:center;gap:8px;padding-right:4px}
.win{position:absolute;inset:8px;background:#fff;border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.win .wt{height:32px;background:#f3f3f3;display:flex;align-items:center;padding:0 10px;font-size:12px;gap:8px;border-bottom:1px solid #ddd;flex:none}
.win .wt .x{margin-left:auto;cursor:pointer;width:28px;text-align:center}
.win .wb{flex:1;overflow:auto;position:relative}
.browser-bar{display:flex;gap:6px;align-items:center;padding:6px 8px;background:#f1f3f4;border-bottom:1px solid #ddd;flex:none}
.browser-bar input{flex:1;border-radius:18px;border:1px solid #ccc;padding:5px 12px;font-size:13px}
.flyout{position:absolute;right:8px;bottom:8px;width:300px;max-width:calc(100% - 16px);background:#202327;color:#fff;border-radius:10px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:13px;max-height:calc(100% - 16px);overflow:auto}
.flyout .net{padding:8px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px}
.flyout .net:hover,.flyout .net.on{background:#33373d}
.flyout input{width:100%;margin-top:6px;background:#111;color:#fff;border:1px solid #555}

/* ---------- router web UI (TP-Link-like) ---------- */
.rui{font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#333;display:flex;flex-direction:column;height:100%;background:#fff}
.rui .rh{background:linear-gradient(90deg,#14a2b8,#2bb8c9);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 14px;flex:none}
.rui .rh .lg{font-weight:700;font-size:20px;display:flex;align-items:center;gap:6px}
.rui .rh .md{border-left:1px solid rgba(255,255,255,.5);padding-left:12px;font-size:12px;line-height:1.3}
.rui .rh .md b{font-size:14px}
.rui .rh .act{margin-left:auto;display:flex;gap:14px;font-size:11px;text-align:center}
.rui .rh .act span{cursor:pointer}
.rui .rbody{flex:1;display:flex;min-height:0;background:#22a7b6}
.rui .rnav{width:170px;flex:none;overflow:auto;padding:6px}
.rui .rnav .it{background:#fff;margin-bottom:3px;padding:7px 10px;border-radius:2px;cursor:pointer;font-size:13px}
.rui .rnav .it.on{background:#ffd200;font-weight:700}
.rui .rnav .sub{background:#e9f6f8;padding:5px 10px 5px 20px;cursor:pointer;font-size:12px;color:#147a87}
.rui .rnav .sub.on{background:#bfe6ec;font-weight:700}
.rui .rmain{flex:1;background:#fff;overflow:auto;padding:14px 18px;min-width:0}
.rui .rhelp{width:210px;flex:none;background:#eef6f7;overflow:auto;padding:12px;font-size:11.5px;color:#444;border-left:1px solid #cde}
.rui .rhelp h4{color:#147a87;font-size:13px}
.rui h3{color:#148a98;font-size:17px;border-bottom:1px solid #9fd3da;padding-bottom:6px;margin:2px 0 12px}
.rui .fr{display:flex;align-items:center;gap:10px;margin:7px 0;flex-wrap:wrap}
.rui .fr>label:first-child{width:170px;text-align:right;color:#333;font-size:13px}
.rui .fr input[type=text],.rui .fr input[type=password],.rui .fr select{border:1px solid #9ab;border-radius:3px;padding:4px 7px;font-size:13px;width:190px}
.rui .rsave{background:#16a3b4;color:#fff;border:0;border-radius:3px;padding:7px 34px;font-size:14px;cursor:pointer;margin:14px 0 0 180px}
.rui .rsave:hover{background:#0f8a99}
.rui .rmsg{margin:8px 0 0 180px;font-size:12px}
.rui table.rt{border-collapse:collapse;font-size:12px;width:100%}
.rui table.rt th{background:#d6eef1;padding:5px;text-align:left} .rui table.rt td{padding:5px;border-bottom:1px solid #e3e3e3}
.rlogin{height:100%;display:grid;place-items:center;background:linear-gradient(#e8f6f8,#fff)}
.rlogin .lb{width:300px;max-width:92%;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:22px;text-align:center}
.rlogin input{width:100%;margin:6px 0;padding:8px}


/* ---------- WinBox-like ---------- */
.wbx{font-family:Tahoma,Verdana,sans-serif;font-size:12px;background:#ececec;border:1px solid #999;border-radius:6px;display:flex;flex-direction:column;height:480px;overflow:hidden;color:#111}
.wbx .wtitle{background:linear-gradient(#e6e6e6,#cfcfcf);padding:5px 8px;font-size:12px;border-bottom:1px solid #999;display:flex;gap:8px}
.wbx .wtool{padding:4px 6px;border-bottom:1px solid #bbb;display:flex;gap:6px;background:#f2f2f2}
.wbx .wbody{flex:1;display:flex;min-height:0}
.wbx .wmenu{width:150px;background:#d9d9d9;border-right:1px solid #aaa;overflow:auto;padding:3px 0;flex:none}
.wbx .wmenu div{padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
.wbx .wmenu div:hover,.wbx .wmenu div.on{background:#bcd3ee}
.wbx .wmenu div.sub{padding-left:24px}
.wbx .wwork{flex:1;position:relative;background:#c9c9c9;overflow:auto;padding:8px}
.wwin{background:#f0f0f0;border:1px solid #888;box-shadow:2px 3px 10px rgba(0,0,0,.3);margin-bottom:8px}
.wwin .wh{background:linear-gradient(#5a8ad1,#3c6db6);color:#fff;padding:3px 8px;font-weight:bold;display:flex}
.wwin .wh .x{margin-left:auto;cursor:pointer}
.wwin .wc{padding:8px}
.wwin .tabs{display:flex;gap:2px;margin-bottom:6px}
.wwin .tabs span{border:1px solid #999;border-bottom:0;padding:3px 9px;background:#ddd;cursor:pointer}
.wwin .tabs span.on{background:#f8f8f8;font-weight:bold}
.wwin .fr{display:flex;align-items:center;gap:6px;margin:4px 0}
.wwin .fr label{width:120px;text-align:right}
.wwin .fr input,.wwin .fr select{font-family:Tahoma,sans-serif;font-size:12px;padding:2px 4px;border:1px solid #888;border-radius:0;width:170px}
.wb-btn{font-family:Tahoma,sans-serif;font-size:12px;padding:3px 12px;border:1px solid #888;background:linear-gradient(#fafafa,#ddd);cursor:pointer;border-radius:2px}
.wb-btn:hover{background:#e8f0ff}
table.wl{width:100%;border-collapse:collapse;background:#fff;font-size:12px}
table.wl th{background:#e5e5e5;border:1px solid #bbb;padding:3px 5px;text-align:left;font-weight:normal}
table.wl td{border-bottom:1px solid #eee;padding:3px 5px}
table.wl tr.sel td{background:#cfe0fb}
table.wl tr{cursor:pointer}


/* ---------- topology svg ---------- */
.topo{width:100%;background:#f8fbff;border:1px solid var(--line);border-radius:12px;touch-action:none}
.topo .port{cursor:pointer}
.topo .port:hover rect{stroke:#168BFF;stroke-width:3}
.topo .lbl{font-size:12px;fill:#102A43;font-family:var(--font)}
.flow{stroke-dasharray:6 6;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}

/* checklist */
.chk{list-style:none;padding:0;margin:0;font-size:.86rem}
.chk li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed #e3e9ef}
.chk li i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #c3cfdb;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff;margin-top:1px}
.chk li.ok i{background:var(--ok);border-color:var(--ok)}
.chk li.bad i{background:var(--err);border-color:var(--err)}
.chk li.ok span{color:var(--muted)}

/* meters */
.meter{background:#0f1c2b;border-radius:12px;padding:12px;color:#d7e6f5;font-family:Consolas,monospace}
.meter .mv{font-size:1.6rem;font-weight:700}
.meter .mlab{font-size:.7rem;opacity:.75;text-transform:uppercase;letter-spacing:.06em}
.mbar{height:10px;background:#21364d;border-radius:6px;overflow:hidden;margin-top:6px}
.mbar i{display:block;height:100%;transition:width .4s,background .4s}
.knob{display:flex;flex-direction:column;gap:4px}
input[type=range]{width:100%;accent-color:var(--blue)}

/* led tester */
.tester{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.tester .unit{background:linear-gradient(#e7ebee,#c9d0d6);border-radius:14px;padding:14px 12px;width:150px;text-align:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),var(--sh)}
.tester .unit b{font-size:.75rem;color:#334}
.tester .leds{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;margin:10px 0}
.tester .leds div{display:flex;align-items:center;gap:6px;font-size:.75rem;font-family:Consolas,monospace}
.tester .leds span{width:14px;height:14px;border-radius:50%;background:#3d4a3d;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.tester .leds span.on{background:#3cff62;box-shadow:0 0 10px #3cff62}
.wire{display:inline-block;width:34px;height:14px;border-radius:7px;border:1px solid rgba(0,0,0,.2);vertical-align:middle}

/* floorplan */
.fp{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none}

/* result */
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.75rem;font-weight:600;color:var(--navy);opacity:.35;filter:grayscale(1)}
.badge.on{opacity:1;filter:none}
.badge .md{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#ffe680,#f5a524);box-shadow:0 4px 12px rgba(245,165,36,.5);font-size:26px}
.score-ring{width:140px;height:140px}

/* timeline */
.tl{display:flex;gap:8px;overflow:auto;padding:6px 2px 10px}
.tl .ti{flex:1;min-width:120px;border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:#fff;transition:.15s;text-align:center}
.tl .ti:hover,.tl .ti.on{border-color:var(--blue);background:#eef6ff}
.tl .ti b{display:block;font-size:1.05rem;color:var(--navy)}
.tl .ti .y{font-size:.75rem;color:var(--muted)}

/* fade transition */
.fade-in{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ===== 16:9 fixed stage ===== */
#app{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;background:var(--soft);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.6)}
#stage{position:absolute;top:56px;bottom:92px;left:0;right:0;padding:12px 18px;overflow:hidden}
#stage>.page{transform-origin:top left}
#app.op #topbar,#app.op #guide{display:none}
#app.op #stage{top:0;bottom:0;padding:0}
.opening{width:100%;height:100%;max-width:none;margin:0;border-radius:0;box-shadow:none;aspect-ratio:auto}
#ocap{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:70%;background:rgba(9,25,41,.78);color:#fff;padding:8px 16px;border-radius:12px;font-size:14px;text-align:center;pointer-events:none}
#guide{position:absolute;left:0;right:0;bottom:0;height:92px;z-index:60;display:flex;align-items:center;gap:12px;padding:6px 16px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(16,42,67,.08);max-width:none;margin:0;pointer-events:auto}
#guide .av{width:66px;height:78px;border-width:2px}
#guide .bubble{max-height:80px;height:80px;overflow:hidden;box-shadow:none;border-radius:12px;background:#f5f9fd;padding:6px 70px 6px 12px}
#guide .bubble .tx{font-size:.86rem;line-height:1.38;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#gnav{flex:none;display:flex;gap:8px}
#gnav .navbar-bottom{margin:0;gap:8px}
#gnav .btn{padding:10px 16px;font-size:.88rem;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modal{position:absolute}
#toasts{position:absolute}
.scene-head{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;flex-wrap:nowrap}
.scene-head h2{font-size:1.3rem;margin:0;white-space:nowrap}
.scene-head p{margin:0;font-size:.86rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scene-head .tag{margin:0;flex:none}
.subtabs{margin:0 0 10px}
.card{padding:14px}
.chk li{padding:3px 0;font-size:.84rem}
.dash-hero{padding:14px 18px;margin-bottom:12px}
.dash-hero img{width:92px}
.mcard{gap:4px;padding:12px 14px}
.mcard .ico{width:44px;height:44px}
.q{margin-bottom:0}
.wbx{height:600px}
#cTerm .term{height:430px}
.qnav{display:flex;gap:6px;align-items:center;margin-top:10px}
.qnav span{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11px;background:#e3eaf2;color:#556;cursor:pointer}
.qnav span.on{background:var(--navy);color:#fff}.qnav span.ok{background:var(--ok);color:#fff}.qnav span.no{background:var(--err);color:#fff}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#app.op #stage>.page,#app.op #stage>.page>div{height:100%}

</style>
</head>

const AudioSys = {
  ctx: null, master: null, music: null, sfx: null, delay: null, musicOn: true, started: false, timer: null, step: 0, next: 0, duckLvl: 1,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    try { this.ctx = new AC(); } catch (e) { return false; }
    const c = this.ctx;
    this.master = c.createDynamicsCompressor(); this.master.connect(c.destination);
    this.music = c.createGain(); this.music.gain.value = 0; this.music.connect(this.master);
    this.sfx = c.createGain(); this.sfx.gain.value = .45; this.sfx.connect(this.master);
    // echo for arps
    this.delay = c.createDelay(1); this.delay.delayTime.value = 60 / 92 * .75;
    const fb = c.createGain(); fb.gain.value = .33; const dl = c.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 2400;
    this.delay.connect(dl); dl.connect(fb); fb.connect(this.delay); dl.connect(this.music);
    try { this.musicOn = localStorage.getItem('wnl-music') !== 'off'; } catch (e) { }

  },
  midi(n) { return 440 * Math.pow(2, (n - 69) / 12); },
  tone(f, t, d, type = 'sine', v = .2, dest = null, att = .005) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + d + .05); return o;
  },
  noise(t, d, v, hp = 6000, dest = null) {
    const c = this.ctx; const len = Math.max(1, Math.floor(c.sampleRate * d)); const b = c.createBuffer(1, len, c.sampleRate); const ch = b.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = c.createBufferSource(); s.buffer = b; const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; const g = c.createGain(); g.gain.value = v;
    s.connect(f); f.connect(g); g.connect(dest || this.sfx); s.start(t);
  },
  // ---- music: A-minor tech ambient, 92 BPM, 8-bar loop ----

  net(ip, m) { return (IP.toInt(ip) & IP.toInt(m)) >>> 0; },
  same(a, b, m) { return IP.valid(a) && IP.valid(b) && IP.maskValid(m) && IP.net(a, m) === IP.net(b, m); },

    else lines.push({ t: opts.unreach ? `Reply from ${opts.unreach}: Destination host unreachable.` : 'Request timed out.', d: opts.unreach ? 700 : 1300, c: 'e' });

  lines.push({ t: `\nPing statistics for ${target}:\n    Packets: Sent = 4, Received = ${ok ? 4 : (opts.unreach ? 4 : 0)}, Lost = ${ok ? 0 : (opts.unreach ? 0 : 4)} (${ok ? 0 : (opts.unreach ? 0 : 100)}% loss),`, d: 200 });

        if (!moved) { $$('.chip', container).forEach(c => c.classList.remove('sel')); if (sel === ch) sel = null; else { sel = ch; ch.classList.add('sel'); } Sfx('click'); return; }
        if (z) { onDrop(ch.dataset.v, z, ch); sel = null; ch.classList.remove('sel'); }
      };
      window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
    });
  });
  $$('[data-zone]', container).forEach(z => z.addEventListener('click', e => { if (sel && !e.target.closest('.chip')) { const s = sel; sel = null; s.classList.remove('sel'); onDrop(s.dataset.v, z, s); } }));
}

    // band compare
    const bands = {
      '2,4 GHz': ['Jangkauan lebih jauh, tembus dinding lebih baik', 'Hanya 3 channel 20 MHz yang tidak saling tumpang tindih (1, 6, 11)', 'Padat: Bluetooth, microwave, AP tetangga → mudah interferensi', 'Cocok: perangkat IoT, area luas, klien lama'],

    const showBand = b => { $('#bandBody', bc).innerHTML = `<ul class="chk">${bands[b].map(x => `<li class="ok"><i>✓</i><span style="color:var(--text)">${x}</span></li>`).join('')}</ul>`; };
    r1.appendChild(bc); showBand('2,4 GHz');

    // channel visualizer
    const cv = h(`<div class="card"><h3>🎛️ Simulasi Channel 2,4 GHz <span class="sim-badge">SIMULASI</span></h3>
      <p class="small muted">Tiga AP dipasang berdekatan di satu gedung. Pilih channel untuk setiap AP, lalu amati tumpang tindih spektrumnya. Targetnya: tidak ada interferensi channel bertetangga.</p>
      <div class="row" id="chSel"></div><canvas id="chCv" width="900" height="210" style="width:100%;background:#0f1c2b;border-radius:10px;margin-top:8px"></canvas><div id="chMsg" class="small"></div></div>`);
    r1.appendChild(cv);
    const chans = [1, 3, 6]; const cols = ['#5ab8ff', '#ffb547', '#39d98a'];
    [0, 1, 2].forEach(i => {
      const s = h(`<label class="row" style="gap:6px"><b style="color:${cols[i]}">AP-${i + 1}</b><select>${Array.from({ length: 13 }, (_, k) => `<option ${k + 1 === chans[i] ? 'selected' : ''}>${k + 1}</option>`).join('')}</select></label>`);
      $('select', s).onchange = e => { chans[i] = +e.target.value; drawCh(); }; $('#chSel', cv).appendChild(s);
    });
    const drawCh = () => {
      const c = $('#chCv', cv), x = c.getContext('2d'); x.clearRect(0, 0, c.width, c.height);
      const fx = f => 40 + (f - 2400) / (2490 - 2400) * (c.width - 60);
      x.strokeStyle = '#2f4a66'; x.fillStyle = '#9fb7cf'; x.font = '12px Consolas';
      for (let ch = 1; ch <= 13; ch++) { const f = 2407 + ch * 5; x.beginPath(); x.moveTo(fx(f), 170); x.lineTo(fx(f), 176); x.stroke(); x.fillText(ch, fx(f) - 4, 192); }
      x.fillText('Channel', 4, 192); x.beginPath(); x.moveTo(30, 170); x.lineTo(c.width - 10, 170); x.stroke();
      chans.forEach((ch, i) => {
        const f = 2407 + ch * 5, l = fx(f - 11), r = fx(f + 11);
        x.beginPath(); x.moveTo(l, 170); x.bezierCurveTo(l + 8, 40, r - 8, 40, r, 170); x.closePath(); x.globalAlpha = .28; x.fillStyle = cols[i]; x.fill(); x.globalAlpha = 1; x.strokeStyle = cols[i]; x.lineWidth = 2; x.stroke();
        x.fillStyle = cols[i]; x.fillText('AP-' + (i + 1), fx(f) - 14, 58 + i * 14);
      });
      let bad = [], same = [];
      for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) { const d = Math.abs(chans[i] - chans[j]); if (d === 0) same.push(`AP-${i + 1} & AP-${j + 1}`); else if (d < 5) bad.push(`AP-${i + 1} & AP-${j + 1}`); }

      else m.innerHTML = `<div class="note warn">${same.length ? '⚠️ Co-channel (berbagi waktu siar): ' + same.join(', ') + '. ' : ''}${bad.length ? '⛔ Adjacent-channel interference (spektrum tumpang tindih): ' + bad.join(', ') + '.' : ''} Jarak antar-channel minimal 5 nomor.</div>`;
    };
    drawCh();

    // width visual
    P[2].appendChild(h(`<div class="card"><h3>↔️ Channel Width (Lebar Channel)</h3>

    // compare cards (swipe)
    P[2].appendChild(h(`<div class="card" style="margin-top:12px"><h3>🆚 Perbandingan Wi-Fi 4, Wi-Fi 5, dan Wi-Fi 6 <span class="tiny muted"></span></h3>
      <div style="display:flex;gap:12px">
      ${[['Wi-Fi 4', '802.11n', '2,4 & 5 GHz', '600 Mbps', '64-QAM', 'MIMO (SU)', 'Rumah, kebutuhan dasar'], ['Wi-Fi 5', '802.11ac', '5 GHz', '± 6,9 Gbps', '256-QAM', 'MU-MIMO downlink', 'Kantor, kelas, streaming'], ['Wi-Fi 6', '802.11ax', '2,4/5 GHz (+6 GHz 6E)', '± 9,6 Gbps', '1024-QAM', 'OFDMA + MU-MIMO up/down', 'Area padat: sekolah, aula, kampus']].map((c, i) => `<div class="card" style="min-width:250px;flex:1;scroll-snap-align:start;border-top:5px solid ${['#94a3b8', '#168BFF', '#16a34a'][i]}"><h3>${c[0]}</h3><div class="muted small">${c[1]}</div><table class="tbl" style="margin-top:6px"><tr><th>Pita</th><td>${c[2]}</td></tr><tr><th>Maks. teoritis</th><td>${c[3]}</td></tr><tr><th>Modulasi</th><td>${c[4]}</td></tr><tr><th>Multi-user</th><td>${c[5]}</td></tr><tr><th>Cocok untuk</th><td>${c[6]}</td></tr></table></div>`).join('')}</div></div>`));

    // quiz + challenge
    const qc = h(`<div><h3>🧠 Kuis: Pilih Standar Sesuai Kebutuhan</h3></div>`);
    qc.appendChild(quizBlock([
      { q: '<b>Tantangan:</b> Sekolah membutuhkan Wi-Fi untuk ratusan siswa yang terhubung bersamaan di aula. Standar mana yang paling sesuai?', opts: ['802.11b', '802.11g', '802.11n (Wi-Fi 4)', '802.11ax (Wi-Fi 6)'], a: 3, why: 'Wi-Fi 6 memiliki OFDMA, MU-MIMO uplink/downlink, dan BSS Coloring yang dirancang untuk area padat pengguna.' },
      { q: 'Standar yang <b>hanya</b> bekerja di pita 5 GHz adalah…', opts: ['802.11b', '802.11ac', '802.11g', '802.11n'], a: 1, why: '802.11ac (Wi-Fi 5) hanya beroperasi di 5 GHz.' },
      { q: 'Tiga AP 2,4 GHz dipasang berdekatan. Kombinasi channel terbaik adalah…', opts: ['1, 2, 3', '1, 6, 11', '6, 6, 6', '3, 7, 9'], a: 1, why: 'Channel 1, 6, 11 tidak saling tumpang tindih.' },
      { q: 'Sebuah gudang luas berisi sensor IoT lama yang hanya mendukung 2,4 GHz. Pita yang harus diaktifkan…', opts: ['6 GHz', '5 GHz saja', '2,4 GHz', '60 GHz'], a: 2, why: 'Perangkat lama hanya mendukung 2,4 GHz, dan 2,4 GHz juga menjangkau area lebih luas.' },
      { q: 'Kecepatan 600 Mbps pada 802.11n berarti…', opts: ['Kecepatan internet yang pasti diterima pengguna', 'Kecepatan teoritis maksimum standar', 'Kecepatan minimal', 'Kecepatan kabel LAN'], a: 1, why: 'Angka standar adalah batas teoritis; kecepatan nyata lebih rendah.' },
    ], sc => { App.score('q_standar', sc); App.mark('standar', 2); feedback(sc >= 60, `Skor kuis standar: ${sc}`); say(sc >= 80 ? 'Bagus sekali! Kamu sudah memahami standar Wi-Fi. Lanjut ke materi perangkat wireless.' : 'Kuis selesai. Baca kembali pembahasannya ya, lalu lanjut ke materi perangkat wireless.', sc >= 80 ? 'antusias' : 'berpikir'); }));
    P[3].appendChild(qc);
    st.appendChild(bottomNav('kompetensi', 'perangkat'));
    say('IEEE 802.11 adalah keluarga standar jaringan nirkabel atau Wi-Fi. Klik setiap standar pada timeline, coba simulasi channel 2,4 gigahertz, lalu kerjakan kuis di bagian bawah.', 'presentasi');
  }
};

<script>
/* ============ SCENE 06 — Antena ============ */
'use strict';
const ANT = [
  { id: 'omni', name: 'Omnidirectional', img: 'ant_omni.png', gain: 8, h: 360, pol: 'Vertikal', freq: '2,4 / 5 GHz', fn: 'Memancarkan sinyal ke segala arah horizontal (360°) untuk melayani klien di sekitar AP.', ch: 'Gain 2–12 dBi; beamwidth horizontal 360°, vertikal sempit (makin tinggi gain makin pipih seperti donat).', use: 'Hotspot ruang kelas, kantor, aula; AP indoor/outdoor untuk area sekeliling.' },
  { id: 'directional', name: 'Directional (Grid)', img: 'ant_grid.png', gain: 24, h: 10, pol: 'V atau H (diputar)', freq: '2,4 / 5 GHz', fn: 'Memusatkan energi radio ke satu arah sempit untuk link jarak jauh.', ch: 'Gain 18–27 dBi; beamwidth ±7–14°; reflektor kisi ringan & tahan angin.', use: 'Point-to-Point antargedung, menangkap sinyal BTS/ISP jauh.' },
  { id: 'sectoral', name: 'Sectoral', img: 'ant_sectoral.png', gain: 17, h: 90, pol: 'Vertikal / Dual', freq: '2,4 / 5 GHz', fn: 'Melayani sektor sudut tertentu (60°, 90°, 120°). Beberapa sektor digabung untuk cakupan 360°.', ch: 'Gain 14–20 dBi; beamwidth horizontal 60–120°, vertikal ±5–10°.', use: 'BTS/AP Point-to-Multipoint, distribusi di lapangan atau satu sisi gedung.' },
  { id: 'panel', name: 'Panel', img: 'ant_panel.png', gain: 16, h: 30, pol: 'V / H / Dual', freq: '2,4 / 5 GHz', fn: 'Antena pipih berpola terarah, mudah dipasang di dinding/tiang.', ch: 'Gain 8–19 dBi; beamwidth ±20–60°; front-to-back ratio baik.', use: 'Mengarahkan Wi-Fi ke area tertentu, link jarak pendek–menengah, CPE.' },
  { id: 'yagi', name: 'Yagi', img: 'ant_yagi.png', gain: 14, h: 30, pol: 'V atau H', freq: 'Bergantung panjang elemen (mis. 2,4 GHz)', fn: 'Tersusun dari elemen logam (reflector, driven element, director) yang membentuk arah pancaran utama.', ch: 'Gain 9–16 dBi; beamwidth ±25–45°; makin banyak elemen makin tinggi gain.', use: 'Link terarah jarak menengah, menangkap sinyal pada frekuensi kerja tertentu.' },
  { id: 'parabolic', name: 'Parabolic Dish', img: 'ant_parabolic.png', gain: 27, h: 6, pol: 'V / H / Dual', freq: '5 GHz (umum)', fn: 'Reflektor parabola memfokuskan energi radio ke feed horn — gain sangat tinggi.', ch: 'Gain 24–34 dBi; beamwidth sangat sempit ±3–8°; butuh alignment presisi & tiang kokoh.', use: 'Backhaul jarak jauh (beberapa km) dengan LOS bersih.' },
];
// Beamwidth from gain (approx. G = 10log10(30000/(θH·θV)))
function beam(a, gain) {
  const k = 30000, lin = Math.pow(10, gain / 10);
  if (a.id === 'omni') return { H: 360, V: Math.max(2, Math.min(80, k / (360 * lin))) };
  if (a.id === 'sectoral') return { H: a.h, V: Math.max(2, Math.min(60, k / (a.h * lin))) };
  const t = Math.sqrt(k / lin); return { H: t, V: t };
}
// pattern in dB (0 = max) for angle deg (0 = boresight), view 'top'|'side'
function patDB(a, gain, ang, view) {
  ang = ((ang % 360) + 540) % 360 - 180; const b = beam(a, gain); const bw = view === 'top' ? b.H : b.V; const A = Math.abs(ang);
  if (a.id === 'omni') { if (view === 'top') return -0.6 + 0.6 * Math.cos(ang * Math.PI / 30); const e = Math.min(A, 180 - A); return Math.max(-30, -12 * Math.pow(e / bw, 2)); }
  const fb = a.id === 'parabolic' ? 32 : a.id === 'directional' ? 28 : a.id === 'panel' ? 25 : a.id === 'sectoral' ? 24 : 18;
  if (bw >= 300) return 0;
  const main = -12 * Math.pow(A / bw, 2); const side = -fb + 6 + 4 * Math.cos(A * Math.PI / (bw * 0.9));
  return Math.max(main, A > bw * 1.2 ? Math.min(side, -13) : -40, -fb - 4 + (A > 150 ? 4 : 0));
}
function drawPolar(cv, a, gain, view, opts = {}) {
  const x = cv.getContext('2d'), W = cv.width, H = cv.height, cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 22;
  x.clearRect(0, 0, W, H); x.fillStyle = '#0f1c2b'; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#2b4460'; x.fillStyle = '#7f9bb8'; x.font = '11px Consolas'; x.lineWidth = 1;
  [0, -10, -20, -30].forEach((d, i) => { const r = R * (1 + d / 40); x.beginPath(); x.arc(cx, cy, r, 0, 7); x.stroke(); x.fillText(d + ' dB', cx + 3, cy - r + 12); });
  for (let k = 0; k < 360; k += 30) { const t = (k - 90) * Math.PI / 180; x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + R * Math.cos(t), cy + R * Math.sin(t)); x.stroke(); x.fillText(k + '°', cx + (R + 12) * Math.cos(t) - 10, cy + (R + 12) * Math.sin(t) + 4); }
  x.beginPath();
  for (let k = 0; k <= 360; k++) { const db = Math.max(-40, patDB(a, gain, k, view)); const r = R * (1 + db / 40); const t = (k - 90) * Math.PI / 180; const px = cx + r * Math.cos(t), py = cy + r * Math.sin(t); k ? x.lineTo(px, py) : x.moveTo(px, py); }
  x.closePath(); x.fillStyle = opts.color || 'rgba(22,139,255,.35)'; x.fill(); x.strokeStyle = opts.stroke || '#5ab8ff'; x.lineWidth = 2; x.stroke();
  // -3 dB markers
  const b = beam(a, gain); const bw = view === 'top' ? b.H : b.V;
  if (bw < 300 && !(a.id === 'omni' && view === 'top')) {
    x.setLineDash([4, 4]); x.strokeStyle = '#ffd166';
    const base = a.id === 'omni' ? [90, 270] : [0];
    base.forEach(c => [-bw / 2, bw / 2].forEach(o => { const t = (c + o - 90) * Math.PI / 180; x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + R * Math.cos(t), cy + R * Math.sin(t)); x.stroke(); }));
    x.setLineDash([]);
  }
  x.fillStyle = '#fff'; x.font = 'bold 12px Poppins,sans-serif'; x.fillText((view === 'top' ? 'Tampak atas (azimuth)' : 'Tampak samping (elevasi)'), 8, 16);
}

const LOS = { mA: 'roof', mB: 'roof', f: 5.8, azA: 40, azB: 210 }; // shared 06D/06F
const MOUNTS = { wall: ['Dinding lantai 2', -3], roof: ['Atap gedung', 0.5], pole: ['Tiang atap (+4 m)', 4.5], tall: ['Tiang tinggi (+8 m)', 8.5] };
const BLD = { A: 10, B: 12, D: 300, obs: [{ x: 120, h: 15, n: 'Pohon' }, { x: 205, h: 13.5, n: 'Gedung kantin' }] };
const BEAR = { A: 72, B: 252 };
function losCalc() {
  const hA = BLD.A + MOUNTS[LOS.mA][1], hB = BLD.B + MOUNTS[LOS.mB][1]; let worst = 99, worstO = null, blocked = false;
  BLD.obs.forEach(o => {
    const y = hA + (hB - hA) * o.x / BLD.D; const d1 = o.x / 1000, d2 = (BLD.D - o.x) / 1000;
    const r = 17.32 * Math.sqrt(d1 * d2 / (LOS.f * BLD.D / 1000)); const c = (y - o.h) / r;
    if (c < worst) { worst = c; worstO = { ...o, y, r }; } if (y < o.h) blocked = true;
  });
  return { hA, hB, clear: worst, o: worstO, blocked, status: blocked ? 'blocked' : worst < 0.6 ? 'fresnel' : 'ok' };
}

      <div class="grid" style="grid-template-columns:500px 1fr;gap:14px"><div><div class="grid g2"><div class="field"><span>Lokasi antena Gedung A (tinggi 10 m)</span><select id="mA">${Object.keys(MOUNTS).map(k => `<option value="${k}">${MOUNTS[k][0]}</option>`).join('')}</select></div>

      <div><svg id="losSvg" viewBox="0 0 900 330" width="100%" style="background:linear-gradient(#bfe3ff,#eef8ff);border-radius:12px"></svg><svg id="topSvg" viewBox="0 0 400 180" width="42%" style="background:#eaf3e6;border-radius:12px;margin-top:8px"></svg></div></div></div>`));
    const sv = $('#losSvg', b); $('#mA', b).value = LOS.mA; $('#mB', b).value = LOS.mB; $('#fq', b).value = LOS.f; $('#azA', b).value = LOS.azA;

      s += `<rect x="${X(0) - 40}" y="${Y(BLD.A)}" width="60" height="${BLD.A * 11}" fill="#e8e1d4" stroke="#998"/><text x="${X(0) - 35}" y="${Y(BLD.A) + 20}" font-size="12">Gedung A</text>`;
      s += `<rect x="${X(300) - 20}" y="${Y(BLD.B)}" width="60" height="${BLD.B * 11}" fill="#e8e1d4" stroke="#998"/><text x="${X(300) - 15}" y="${Y(BLD.B) + 20}" font-size="12">Gedung B</text>`;
      s += `<rect x="${X(120) - 4}" y="${Y(6)}" width="8" height="66" fill="#7a5230"/><ellipse cx="${X(120)}" cy="${Y(11)}" rx="38" ry="${4.5 * 11}" fill="#3f8f3a"/><text x="${X(120) - 18}" y="318" font-size="11">Pohon 15 m</text>`;
      s += `<rect x="${X(205) - 30}" y="${Y(13.5)}" width="60" height="${13.5 * 11}" fill="#d6cbb8" stroke="#998"/><text x="${X(205) - 26}" y="318" font-size="11">Kantin 13,5 m</text>`;
      // fresnel ellipse
      const N = 60; let up = '', dn = '';
      for (let i = 0; i <= N; i++) { const xm = i / N * 300; const y = r.hA + (r.hB - r.hA) * xm / 300; const d1 = xm / 1000, d2 = (300 - xm) / 1000; const rr = 17.32 * Math.sqrt(Math.max(0, d1 * d2) / (LOS.f * 0.3)); up += `${X(xm)},${Y(y + rr)} `; dn = `${X(xm)},${Y(y - rr)} ` + dn; }

      sv.innerHTML = s;
      const aimErr = Math.abs(((LOS.azA - BEAR.A + 540) % 360) - 180);

      // top view
      const t = $('#topSvg', b); const ax = 50, ay = 140, bx = 350, by = 40; const rad = d => (d - 90) * Math.PI / 180;
      t.innerHTML = `<text x="8" y="16" font-size="11" fill="#355">Tampak atas · Utara ↑</text><rect x="${ax - 20}" y="${ay - 15}" width="40" height="30" fill="#e8e1d4" stroke="#998"/><text x="${ax - 18}" y="${ay + 30}" font-size="11">A</text><rect x="${bx - 20}" y="${by - 15}" width="40" height="30" fill="#e8e1d4" stroke="#998"/><text x="${bx - 6}" y="${by + 30}" font-size="11">B</text>
        <path d="M${ax},${ay} L${ax + 260 * Math.cos(rad(LOS.azA - 6))},${ay + 260 * Math.sin(rad(LOS.azA - 6))} L${ax + 260 * Math.cos(rad(LOS.azA + 6))},${ay + 260 * Math.sin(rad(LOS.azA + 6))} Z" fill="rgba(22,139,255,.3)" stroke="#168BFF"/>

    draw();
    const decide = yes => {

        if (good) { this.done('D'); App.score('los', 100 - Math.min(40, App.errs('los') * 10)); say('Keputusan tepat! Jalur terbuka, zona Fresnel bersih, dan antena sudah mengarah ke gedung lawan. Lanjut ke simulasi pemilihan antena.', 'antusias'); }

  },

    b.appendChild(h(`<div class="card"><h3>🛰️ Simulasi Pemasangan & Alignment Point-to-Point <span class="sim-badge">SIMULASI · angka ilustratif, bukan pengukuran radio nyata</span></h3>

      $('#fTop', b).innerHTML = `${cone(ax, ay, S.azA, '#168BFF')}${cone(bx, by, S.azB, '#f59e0b')}<rect x="${ax - 22}" y="${ay - 14}" width="44" height="28" fill="#e8e1d4" stroke="#998"/><text x="${ax - 18}" y="${ay + 4}" font-size="11">Gd A</text><rect x="${bx - 22}" y="${by - 14}" width="44" height="28" fill="#e8e1d4" stroke="#998"/><text x="${bx - 18}" y="${by + 4}" font-size="11">Gd B</text><line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#16a34a" stroke-dasharray="4 4" opacity=".6"/><text x="8" y="152" font-size="11" fill="#355">Tampak atas · arah ideal A→B ${BEAR.A}°, B→A ${BEAR.B}°</text>`;

  },

      <div class="fr"><label style="width:auto"><input type="radio" name="st" value="wpa" ${s.type === 'wpa2' ? 'checked' : ''}> <b>WPA/WPA2 - Personal (Recommended)</b></label></div>
      <div style="margin-left:24px">${this.fr('Version:', this.sel('ver', ['Automatic', 'WPA-PSK', 'WPA2-PSK'], s.ver))}${this.fr('Encryption:', this.sel('enc', ['Automatic', 'TKIP', 'AES'], s.enc))}${this.fr('Wireless Password:', this.inp('pw', s.pass) + ' <span class="tiny">(8–63 ASCII characters)</span>')}</div>

/* ---------------- Laptop (Windows-like) ---------------- */
// net hooks: status(), scan(), connect(ssid,pass), disconnect(), ping(t), resolve(name), browse(host) -> 'router'|'web'|{err}, mountRouter(el), analyzer()
class Laptop {
  constructor(el, net, o = {}) {
    this.el = el; this.net = net; this.o = o; this.app = null; this.url = '';
    el.innerHTML = `<div class="laptop"><div class="scr"><div class="desk"></div><div class="taskbar">
      <button class="tbi" data-app="browser" title="Browser">🌐 <span>Browser</span></button><button class="tbi" data-app="cmd" title="Command Prompt">⌨️ <span>CMD</span></button>${o.noAnalyzer ? '' : '<button class="tbi" data-app="analyzer" title="Wi-Fi Analyzer">📶 <span>Analyzer</span></button>'}
      <div class="tray"><button class="tbi" data-app="wifi" id="trayNet" title="Jaringan">🛜</button><span id="clk"></span></div></div></div><div class="base"></div></div>`;
    $$('[data-app]', el).forEach(b => b.onclick = () => { Sfx('click'); this.open(b.dataset.app === this.app && b.dataset.app === 'wifi' ? null : b.dataset.app); });
    this.desk = $('.desk', el); this.clock(); this.open(null);
  }
  clock() { const c = $('#clk', this.el); if (!c || !document.body.contains(c)) return; const d = new Date(); c.textContent = d.toTimeString().slice(0, 5); setTimeout(() => this.clock(), 20000); }
  open(app) {
    this.app = app; $$('[data-app]', this.el).forEach(b => b.classList.toggle('on', b.dataset.app === app));
    this.desk.innerHTML = `<div style="position:absolute;left:14px;top:14px;color:#fff;font-size:12px;text-align:center;width:70px;cursor:pointer" data-d="browser"><div style="font-size:30px">🌐</div>Browser</div><div style="position:absolute;left:14px;top:90px;color:#fff;font-size:12px;text-align:center;width:70px;cursor:pointer" data-d="cmd"><div style="font-size:30px">⌨️</div>Command Prompt</div>`;
    $$('[data-d]', this.desk).forEach(d => d.ondblclick = d.onclick = () => this.open(d.dataset.d));
    if (app === 'browser') this.openBrowser();
    if (app === 'cmd') this.openCmd();
    if (app === 'wifi') this.openWifi();
    if (app === 'analyzer') this.openAnalyzer();
    this.updTray();
  }
  updTray() { const s = this.net.status(); const t = $('#trayNet', this.el); if (t) t.textContent = s.wifi.up ? '📶' : s.wired.up ? '🖧' : '🌐̸'; }
  win(title) { const w = h(`<div class="win"><div class="wt">${title}<span class="x">✕</span></div><div class="wb"></div></div>`); $('.x', w).onclick = () => this.open(null); this.desk.appendChild(w); return $('.wb', w); }
  openBrowser() {
    const wb = this.win('🌐 Browser'); wb.style.display = 'flex'; wb.style.flexDirection = 'column';
    wb.innerHTML = `<div class="browser-bar"><span>◀ ▶ ⟳</span><input id="url" value="${esc(this.url)}" placeholder="Ketik alamat, mis. 192.168.0.1"><button class="btn sm" id="goU">Buka</button></div><div id="page" style="flex:1;min-height:0;overflow:auto"></div>`;
    const go_ = () => { this.url = $('#url', wb).value.trim(); this.navigate($('#page', wb)); };
    $('#goU', wb).onclick = go_; $('#url', wb).onkeydown = e => { if (e.key === 'Enter') go_(); };
    if (this.url) this.navigate($('#page', wb)); else $('#page', wb).innerHTML = `<div style="padding:30px;text-align:center;color:#666"><div style="font-size:40px">🌐</div>Ketik alamat IP router pada address bar, lalu tekan Enter.</div>`;
    setTimeout(() => $('#url', wb).focus(), 50);
  }
  navigate(page) {
    let host = this.url.replace(/^https?:\/\//i, '').split('/')[0].toLowerCase();
    page.innerHTML = '<div style="padding:30px;color:#666">Memuat…</div>';
    setTimeout(() => {
      if (!document.body.contains(page)) return;
      const r = this.net.browse(host);
      if (r === 'router') { page.style.height = '100%'; this.net.mountRouter(page, this); }
      else if (r === 'web') page.innerHTML = `<div style="padding:30px"><h2 style="color:#1a73e8">${esc(host)}</h2><p>✅ Halaman web berhasil dimuat (simulasi). Koneksi internet berfungsi.</p></div>`;
      else page.innerHTML = `<div style="padding:30px;color:#444;font-family:Arial"><div style="font-size:40px">😟</div><h2 style="color:#333">This site can't be reached</h2><p><b>${esc(host)}</b> took too long to respond.</p><p class="small">Try: checking the connection · checking the proxy and the firewall</p><p style="color:#888;font-size:12px">${r.err || 'ERR_CONNECTION_TIMED_OUT'}</p></div>`;
      this.o.onNavigate && this.o.onNavigate(host, r);
    }, 500);
  }
  openCmd() {
    const wb = this.win('⌨️ Command Prompt'); wb.style.background = '#0c1117'; wb.style.padding = '4px';
    this.term = new Terminal(wb, { prompt: 'C:\\Users\\Siswa>', banner: 'Microsoft Windows [Version 10.0.19045]\n(c) Microsoft Corporation. All rights reserved.\n', handler: c => this.cmd(c), quick: this.o.quick || ['ipconfig', 'ipconfig /all', 'ping 192.168.0.1', 'ping 8.8.8.8', 'nslookup google.com', 'netsh wlan show interfaces'] });
    const t = $('.term', wb); t.style.height = 'calc(100% - 40px)'; t.style.borderRadius = '0';
  }

LAB.E = {
  title: '08E · Pengaturan Radio Wireless (Point-to-Point)', pose: 'jelaskan',
  story: 'Link point-to-point 5 GHz antara Gedung A dan Gedung B (jarak 300 m, antena panel terintegrasi 16 dBi di kedua sisi) sudah terpasang dan sejajar. Tugasmu mengoptimalkan parameter radio agar link stabil dan cepat. Di sekitar sekolah ada WISP lain yang memakai sebagian channel 5 GHz.',
  card: [['Jarak link', '300 m, LOS bersih'], ['Antena', 'Panel 16 dBi (kedua sisi)'], ['Batas EIRP (contoh simulasi)', '36 dBm — selalu cek regulasi frekuensi & daya pancar yang berlaku'], ['Target kualitas', 'RSSI −65 s.d. −40 dBm · SNR ≥ 25 dB'], ['Tugas', 'Bandingkan minimal 2 konfigurasi berbeda']],
  init() { this.r = { freq: 5745, width: 80, tx: 25, proto: '802.11', ssid: 'P2P-GDA-GDB', sec: 'wpa2' }; this.rows = []; this.scanned = false; this.f = {}; },
  calc() {
    const r = this.r; const ctr = r.width === 20 ? r.freq : r.width === 40 ? r.freq + 10 : r.freq + 30; const lo = ctr - r.width / 2, hi = ctr + r.width / 2;
    const fspl = 20 * Math.log10(0.3) + 20 * Math.log10(ctr) + 32.44; const rssi = r.tx + 32 - fspl - 2;
    const th = -174 + 10 * Math.log10(r.width * 1e6) + 7;
    const intf = [{ f: 5745, p: -70 }, { f: 5785, p: -76 }].filter(i => i.f - 10 < hi && i.f + 10 > lo);
    let nlin = Math.pow(10, th / 10); intf.forEach(i => nlin += Math.pow(10, i.p / 10)); const nf = 10 * Math.log10(nlin);
    let snr = rssi - nf; if (rssi > -40) snr -= (rssi + 40) * 1.2; // saturation degrades EVM
    const T = [[5, 14.4], [8, 28.9], [11, 43.3], [14, 57.8], [18, 86.7], [21, 115.6], [24, 130], [27, 144.4], [30, 173.3], [33, 192.6]];
    let phy = 0; T.forEach(([s, v]) => { if (snr >= s) phy = v; }); phy *= r.width === 20 ? 1 : r.width === 40 ? 2.08 : 4.5;
    const tp = phy * (r.proto === 'nv2' ? .72 : .6); const eirp = r.tx + 16 - 1;

      ['TX power dalam batas EIRP (≤ 36 dBm)', c.eirp <= 36, 'EIRP = TX power + gain antena − loss kabel. Turunkan TX power.'],
      ['RSSI −65 s.d. −40 dBm (tidak saturasi)', c.rssi <= -40 && c.rssi >= -65, 'Jika RSSI lebih kuat dari −40 dBm, turunkan TX power agar receiver tidak jenuh.'],

      <div class="grid g2">
       <div class="wwin"><div class="wh">Wireless</div><div class="wc">
        <div class="fr"><label>Mode:</label><select disabled><option>bridge</option></select></div>
        <div class="fr"><label>Band:</label><select disabled><option>5ghz-a/n/ac</option></select></div>
        <div class="fr"><label>Frequency:</label><select id="rf">${[5745, 5765, 5785, 5805, 5825].map(f => `<option ${f === r.freq ? 'selected' : ''}>${f}</option>`).join('')}</select> MHz</div>
        <div class="fr"><label>Channel Width:</label><select id="rw">${[[20, '20MHz'], [40, '20/40MHz-Ce'], [80, '20/40/80MHz-Ceee']].map(o => `<option value="${o[0]}" ${o[0] === r.width ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></div>
        <div class="fr"><label>Tx Power:</label><input type="range" id="rt" min="0" max="25" value="${r.tx}" style="width:120px"> <b id="rtv">${r.tx}</b> dBm</div>
        <div class="fr"><label>Wireless Protocol:</label><select id="rp"><option ${r.proto === '802.11' ? 'selected' : ''}>802.11</option><option ${r.proto === 'nv2' ? 'selected' : ''}>nv2</option></select></div>
        <div class="fr"><label>SSID:</label><input value="${r.ssid}" readonly></div><div class="fr"><label>Security Profile:</label><input value="p2p-wpa2 (WPA2 PSK aes)" readonly></div>
        <div class="fr"><label></label><button class="wb-btn" id="rScan">Frequency Usage…</button><button class="wb-btn" id="rSave">Simpan Hasil</button></div></div></div>
       <div><div class="meter"><div class="mlab">Signal Analyzer — sisi Gedung B</div><div class="grid g3" style="margin-top:6px"><div><div class="mlab">RSSI</div><div class="mv" id="eR"></div></div><div><div class="mlab">Noise floor</div><div class="mv" id="eN"></div></div><div><div class="mlab">SNR</div><div class="mv" id="eS"></div></div></div><div class="mbar"><i id="eB"></i></div>
         <div class="small" style="margin-top:8px">EIRP: <b id="eE"></b> · PHY rate: <b id="eP"></b> · Throughput ±<b id="eT"></b></div><div class="small">Status link: <b id="eSt"></b></div></div>

async function runTester(el, map, cycles = 2) {

}
function pjTopoCheck() {

  out.push(['Semua perangkat sesuai kebutuhan (1 internet, 1 router, 2 switch, 3 AP, 20 PC, 15 laptop/HP)', Object.keys(need).every(k => pjCount(k) === need[k])]);

function pjIpCheck() {

const FP = { w: 720, h: 300, rooms: [[0, 0, 260, 300, 'Lab TKJ 1 (PC)'], [260, 0, 260, 300, 'Lab TKJ 2 (PC)'], [520, 0, 200, 300, 'Ruang Teori']] };

const ECAT = { A: 'Standar IEEE 802.11', B: 'Identifikasi perangkat', C: 'Jenis & karakteristik antena', D: 'Pencocokan antena-kasus', E: 'Konfigurasi dasar', F: 'Mode AP/Router/WISP/Station/Radio', G: 'Diagnosis troubleshooting' };
const EREMED = { A: ['standar', 'Materi Wireless (Scene 04)'], B: ['perangkat', 'Perangkat Wireless (Scene 05)'], C: ['antena', 'Pengenalan Antena (Scene 06B–06C)'], D: ['antena', 'Pemilihan Antena (Scene 06E)'], E: ['konfigurasi', 'Konfigurasi Dasar (Scene 07)'], F: ['lab', 'Virtual Wireless Lab (Scene 08)'], G: ['trouble', 'Troubleshooting (Scene 09)'] };
function getWeights() { try { const w = JSON.parse(localStorage.getItem('wnl-weights') || 'null'); if (w) return w; } catch (e) { } return { kuis: 20, ident: 15, konf: 35, trouble: 20, proyek: 10 }; }
const avg = keys => { const v = keys.map(k => App.score(k) || 0); return Math.round(v.reduce((a, b) => a + b, 0) / v.length); };
function computeFinal() {
  const W = getWeights();
  const parts = { kuis: App.score('evalMcq') || 0, ident: avg(['q_perangkat', 's_perangkat', 'm_antena', 'pilihAnt']), konf: avg(['config', 'labA', 'labB', 'labC', 'labD', 'labE', 'align']), trouble: avg(['tsA', 'tsB', 'tsC']), proyek: App.score('proyek') || 0 };
  const tot = Object.values(W).reduce((a, b) => a + b, 0) || 1;
  const fin = Math.round(Object.keys(W).reduce((a, k) => a + parts[k] * W[k], 0) / tot);
  return { W, parts, fin };
}

    st.appendChild(btns);
    $$('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
    $('#hMenu').onclick = () => go('menu'); $('#hQuiz').onclick = () => go('evaluasi');
    $('#hAll').onclick = () => modal('Ulangi pembelajaran?', 'Seluruh progres dan nilai akan dihapus agar kamu bisa belajar dari awal.', [{ label: 'Batal', cls: 'ghost' }, { label: 'Ulangi dari awal', cls: 'danger', onClick: () => { App.reset(); C7.reset(); PJ.reset(); Object.values(LAB).forEach(m => { m.dev = m.mt = m.r = null; m.fin = false; }); go('kompetensi'); } }]);
    $('#hCopy').onclick = async () => { try { await navigator.clipboard.writeText(summary); toast('✅ Hasil disalin', 'ok'); } catch (e) { modal('Salin hasil', `<pre style="white-space:pre-wrap">${esc(summary)}</pre>`); } };
    if (lulus) { Sfx('win'); }
    say(lulus ? `Selamat ${App.state.name || ''}! Nilai akhirmu ${fin} dan kamu dinyatakan tuntas. Kamu sudah layak disebut teknisi jaringan nirkabel. Terima kasih sudah belajar bersama Pak Yarli!` : `Nilai akhirmu saat ini ${fin}. Selesaikan materi dan misi yang belum tuntas, lalu ulangi evaluasi. Pak Yarli yakin kamu bisa!`, lulus ? 'antusias' : 'senyum');
  }
};

</script>
</body>
</html>
